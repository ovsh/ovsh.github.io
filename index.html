/* --- the games -------------------------------------------------------
   Six cards cut in homage, not in copy. Every mark below is drawn here,
   out of the same torn paper as the rest of the street: a name lettered
   by hand, and one shape that says what the game FELT like. No logo, no
   wordmark, no borrowed artwork -- those belong to their owners and
   have no business being redrawn on somebody's life story.

   They rise past the boy at the screen in three columns, staggered in
   time so about three are in the air at once, and the whole set plays
   three times and stops. */
P.gamecards = function(p){
  var CW = 104, CH = 116, top = p.y == null ? 378 : p.y, out = "";
  var cols = [p.x, p.x + 164, p.x + 328];
  /* column and time index are deliberately out of step: no two cards in
     the same column are ever in the air together */
  var G = [
    {c:0, d:0, n:["Pokémon"],              k:"mon",     band:"f-red",   ink:"#fdf5e6", art:"f-gold",  bg:"f-cream"},
    {c:2, d:1, n:["The Sims"],                  k:"plan",    band:"f-green", ink:"#26351f", art:"f-blue2", bg:"f-cream"},
    {c:1, d:2, n:["RollerCoaster","Tycoon"],    k:"coaster", band:"f-teal",  ink:"#fdf5e6", art:"f-gold",  bg:"f-cream"},
    {c:0, d:3, n:["RuneScape"],                 k:"sword",   band:"f-kraft3",ink:"#fdf5e6", art:"f-gold",  bg:"f-cream2"},
    {c:2, d:4, n:["Counter-Strike"],            k:"crate",   band:"f-slate", ink:"#fdf5e6", art:"f-red",   bg:"f-cream2"},
    {c:1, d:5, n:["Age of","Empires II"],       k:"keep",    band:"f-blue3", ink:"#fdf5e6", art:"f-cream2",bg:"f-cream"}
  ];
  var i;
  for(i = 0; i < G.length; i++){
    var g = G[i], x = cols[g.c], y = top - (g.d > 2 ? 14 : 0), sd = p.seed + i * 40;
    var cx = x + CW * 0.5, s = "";
    /* the tilt is cut into the card, not animated onto it: a css rotate
       on a plain svg group turns about the origin of the whole sheet,
       which would throw the card halfway across the room */
    var tilt = [-3.4, 2.6, -1.8, 3.2, -2.4, 1.6][i];
    /* the card: cream stock, a colour band across the head, the picture
       in the middle, the name cut along the foot */
    s += one(cutRect(x, y, CW, CH, 1.9, sd, 16), g.bg, 6, 7);
    s += one(cutRect(x + 4, y + 5, CW - 8, 21, 1.2, sd + 1, 12), g.band, 0, 0);
    s += gameArt(g.k, cx, y + 62, sd + 5, g.art, g.band);
    var ny = y + CH - (g.n.length > 1 ? 26 : 13);
    var j;
    for(j = 0; j < g.n.length; j++){
      s += fitLabel(cx, ny + j * 15, g.n[j], 14, CW - 14, "sgn", "#3a2e28");
    }
    out += '<g class="a-card' + (g.d ? " d" + g.d : "") + '"><g transform="rotate(' +
      tilt + " " + f(cx) + " " + f(y + CH * 0.5) + ')">' + s + "</g></g>";
  }
  return out;
};

/* one picture per card, all of it original paper shapes */
function gameArt(k, cx, cy, sd, art, band){
  var o = "";
  if(k === "mon"){
    /* a round creature in tall grass: two ears, two eyes, a stripe */
    o += '<g class="f-green3" style="opacity:.8"><path d="' +
      cut([[cx - 34, cy + 22],[cx - 28, cy + 2],[cx - 20, cy + 22],[cx - 10, cy - 2],[cx - 2, cy + 22]], 1, sd, 5) + '"/><path d="' +
      cut([[cx + 4, cy + 22],[cx + 12, cy],[cx + 20, cy + 22],[cx + 30, cy + 4],[cx + 36, cy + 22]], 1, sd + 1, 5) + '"/></g>';
    o += one(cut([[cx - 17, cy - 12],[cx - 11, cy - 26],[cx - 4, cy - 14]], 1, sd + 2, 4), art, 2, 3);
    o += one(cut([[cx + 17, cy - 12],[cx + 11, cy - 26],[cx + 4, cy - 14]], 1, sd + 3, 4), art, 2, 3);
    o += one(cutDisc(cx, cy, 19, 1.1, sd + 4, 12), art, 3, 4);
    o += '<g class="f-red2"><path d="' + cutRect(cx - 19, cy - 3, 38, 5, 0.8, sd + 5, 8) + '"/></g>';
    o += '<g class="f-ink"><circle cx="' + f(cx - 7) + '" cy="' + f(cy - 8) + '" r="2.6"/>' +
      '<circle cx="' + f(cx + 7) + '" cy="' + f(cy - 8) + '" r="2.6"/></g>';
  } else if(k === "plan"){
    /* a floor plan with one small person standing in it */
    o += one(cutRect(cx - 32, cy - 24, 64, 46, 1.2, sd, 14), art, 3, 4);
    o += '<g class="f-cream" style="opacity:.9"><path d="' + cutRect(cx - 28, cy - 20, 26, 18, 0.8, sd + 1, 8) + '"/>' +
      '<path d="' + cutRect(cx + 4, cy - 20, 24, 18, 0.8, sd + 2, 8) + '"/>' +
      '<path d="' + cutRect(cx - 28, cy + 4, 56, 14, 0.8, sd + 3, 10) + '"/></g>';
    o += '<g class="f-ink" style="opacity:.85"><circle cx="' + f(cx + 15) + '" cy="' + f(cy + 8) + '" r="3.4"/><path d="' +
      cutRect(cx + 12, cy + 12, 6, 8, 0.6, sd + 4, 4) + '"/></g>';
    o += one(cut([[cx - 40, cy - 24],[cx, cy - 40],[cx + 40, cy - 24]], 1.4, sd + 5, 8), band, 2, 3);
  } else if(k === "coaster"){
    /* a loop of track with a car climbing out of it */
    var pts = [], t, i2;
    for(i2 = 0; i2 <= 14; i2++){
      t = i2 / 14 * TAU;
      pts.push([cx - 6 + Math.sin(t) * 22, cy + 2 - Math.cos(t) * 20]);
    }
    o += '<g fill="none" stroke="#8a6142" stroke-width="4" style="opacity:.9"><path d="' +
      cut(pts, 0.9, sd, 4) + '"/></g>';
    o += '<g fill="none" stroke="#8a6142" stroke-width="4"><path d="' +
      cutLine(cx - 40, cy + 24, cx - 12, cy + 18, 1, sd + 1, 10) + '"/><path d="' +
      cutLine(cx + 14, cy + 16, cx + 40, cy - 12, 1, sd + 2, 10) + '"/></g>';
    o += one(cut([[cx + 22, cy - 6],[cx + 40, cy - 16],[cx + 44, cy - 6],[cx + 26, cy + 3]], 1.2, sd + 3, 6), art, 2, 3);
  } else if(k === "sword"){
    /* a sword laid across a shield */
    o += one(cut([[cx - 30, cy - 22],[cx + 2, cy - 26],[cx + 2, cy + 6],[cx - 14, cy + 24],[cx - 30, cy + 4]], 1.4, sd, 10), art, 3, 4);
    o += '<g class="f-kraft3" style="opacity:.6"><path d="' + cutRect(cx - 26, cy - 8, 26, 5, 0.7, sd + 1, 6) + '"/></g>';
    o += one(cut([[cx + 6, cy + 22],[cx + 26, cy - 22],[cx + 31, cy - 20],[cx + 12, cy + 24]], 1.1, sd + 2, 8), "f-cream3", 2, 3);
    o += '<g class="f-kraft3"><path d="' + cutRect(cx + 2, cy + 14, 20, 5, 0.8, sd + 3, 6) + '"/></g>';
  } else if(k === "crate"){
    /* a supply crate with a crosshair over it */
    o += one(cutRect(cx - 26, cy - 14, 44, 38, 1.4, sd, 12), "f-kraft2", 4, 5);
    o += '<g class="f-kraft3" style="opacity:.75"><path d="' +
      cutLine(cx - 26, cy - 14, cx + 18, cy + 24, 1, sd + 1, 10) + '"/><path d="' +
      cutLine(cx + 18, cy - 14, cx - 26, cy + 24, 1, sd + 2, 10) + '"/></g>';
    o += '<g fill="none" stroke="#c05f48" stroke-width="3.4"><circle cx="' + f(cx + 16) + '" cy="' + f(cy - 14) + '" r="13"/></g>';
    o += '<g class="' + art + '"><path d="' + cutRect(cx + 14.4, cy - 34, 3.2, 12, 0.5, sd + 3, 4) + '"/>' +
      '<path d="' + cutRect(cx + 14.4, cy - 6, 3.2, 12, 0.5, sd + 4, 4) + '"/>' +
      '<path d="' + cutRect(cx - 4, cy - 15.6, 12, 3.2, 0.5, sd + 5, 4) + '"/>' +
      '<path d="' + cutRect(cx + 24, cy - 15.6, 12, 3.2, 0.5, sd + 6, 4) + '"/></g>';
  } else {
    /* a keep: one turret block, battlements, a flag on a pole */
    o += one(cutRect(cx - 24, cy - 16, 48, 40, 1.5, sd, 12), art, 4, 5);
    o += '<g class="' + art + '"><path d="' + cutRect(cx - 30, cy - 24, 12, 12, 0.9, sd + 1, 5) + '"/>' +
      '<path d="' + cutRect(cx - 8, cy - 24, 12, 12, 0.9, sd + 2, 5) + '"/>' +
      '<path d="' + cutRect(cx + 14, cy - 24, 12, 12, 0.9, sd + 3, 5) + '"/></g>';
    o += '<g class="f-brown2" style="opacity:.75"><path d="' + cutRect(cx - 7, cy + 4, 14, 20, 0.9, sd + 4, 6) + '"/></g>';
    o += '<g stroke="#8a6142" stroke-width="2.6" fill="none"><path d="' +
      cutLine(cx + 2, cy - 24, cx + 2, cy - 44, 0.8, sd + 5, 8) + '"/></g>';
    o += one(cut([[cx + 3, cy - 44],[cx + 24, cy - 39],[cx + 3, cy - 32]], 1, sd + 6, 5), "f-red", 2, 2);
  }
  return o;
}

/* --- the workshop street ---------------------------------------------
   The last act gives a beat of its own to each thing built, so each one
   is a different world: an arcade, a bench, a hillside, a film set, a
   cutting room, a picture house. They share two rules only. The middle
   of the front is left clear, because the print of the thing itself is
   pinned there, and the trade sign always stands on the right, past the
   print and past the words blocked into the top left of the frame. */

/* words are set smaller instead of being allowed to run off their own
   board. Names on this street are between six and ten letters long. */
function fitLabel(x, y, str, size, room, fam, fill){
  var wide = str.length * size * (fam === "sgb" ? 0.5 : 0.55);
  if(wide > room) size = Math.max(9, Math.round(size * room / wide * 10) / 10);
  return label(x, y, str, size, fam, fill);
}

/* the trade sign every workshop on this street carries: the name and
   what the thing does, on one board on one post. No year: this street
   is a street, not a timeline, and a date under every name turned it
   back into the CV the whole page exists to not be. The board is cut
   30 shorter than it once was, which is exactly the plaque that came
   off it, so the two lines sit centred on the paper and not high on
   an empty board. */
function toolSign(x, i, seed){
  var s = COPY.tools[i], top = 214, bw = 150, cx = x + bw * 0.5, out = "";
  out += one(cutRect(cx - 7, top + 88, 14, FLOOR - top - 82, 1.4, seed, 20), "f-brown2", 4, 5);
  out += one(cutRect(x - 8, top - 8, bw + 16, 116, 2.4, seed + 1, 20), "f-cream2", 8, 9);
  out += one(cutRect(x, top, bw, 100, 1.8, seed + 2, 16), "f-cream", 0, 0);
  out += fitLabel(cx, top + 46, s.n, 28, bw - 18, "sgn", "#3a2e28");
  out += fitLabel(cx, top + 74, s.s, 15, bw - 20, "sgb", "#4a3524");
  return out;
}

};

    var sx = x + 60 + i * ((w - 120) / 6), sy = top + 44 + (i % 2) * 26, sr = 15 + (i % 3) * 4, pts = [], k;
    for(k = 0; k < 10; k++){
      var a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? sr * 0.44 : sr;
      pts.push([sx + Math.cos(a) * rr, sy + Math.sin(a) * rr]);
    }
    stx += '<path d="' + cut(pts, 0.8, p.seed + 10 + i, 4) + '"/>';
  }
  out += '<g class="f-gold" style="opacity:.8">' + stx + "</g>";
  /* the lamp on its stand, left of the print */
  var lx = x + 52, lt = base - 300;
  out += '<g stroke="#4a3f36" stroke-width="5" fill="none"><path d="' +
    cutLine(lx + 24, base, lx + 24, lt + 40, 1.4, p.seed + 20, 20) + '"/><path d="' +
    cutLine(lx + 24, base - 8, lx - 10, base, 1.2, p.seed + 21, 8) + '"/><path d="' +
    cutLine(lx + 24, base - 8, lx + 58, base, 1.2, p.seed + 22, 8) + '"/></g>';
  out += one(cut([[lx - 4, lt],[lx + 52, lt + 6],[lx + 48, lt + 46],[lx, lt + 42]], 1.8, p.seed + 23, 10), "f-cream3", 5, 6);
  out += one(cut([[lx + 46, lt + 4],[lx + 74, lt - 10],[lx + 72, lt + 58],[lx + 44, lt + 46]], 1.6, p.seed + 24, 8), "f-gold", 0, 0);
  /* the clapperboard, propped where the walker passes it */
  var kx = x + 176, kt = base - 118;
  out += one(cutRect(kx, kt, 108, 76, 1.8, p.seed + 30, 12), "f-cream2", 6, 7);
  out += one(cut([[kx - 2, kt - 4],[kx + 106, kt - 12],[kx + 108, kt + 14],[kx, kt + 20]], 1.6, p.seed + 31, 10), "f-ink", 4, 5);
  var bars = "";
  for(i = 0; i < 5; i++) bars += '<path d="' + cut([[kx + 6 + i * 21, kt - 2],[kx + 16 + i * 21, kt - 3],[kx + 14 + i * 21, kt + 15],[kx + 4 + i * 21, kt + 16]], 0.8, p.seed + 40 + i, 4) + '"/>';
  out += '<g class="f-cream">' + bars + "</g>";
  /* the camera and the chair, right of the print and under the sign */
  var mx = x + w - 236, mt = base - 214;
  out += '<g stroke="#4a3f36" stroke-width="5" fill="none"><path d="' +
    cutLine(mx + 30, base, mx + 30, mt + 54, 1.4, p.seed + 50, 16) + '"/><path d="' +
    cutLine(mx + 30, mt + 54, mx - 4, base, 1.4, p.seed + 51, 16) + '"/><path d="' +
    cutLine(mx + 30, mt + 54, mx + 64, base, 1.4, p.seed + 52, 16) + '"/></g>';
  out += one(cutRect(mx - 6, mt, 76, 56, 1.6, p.seed + 53, 10), "f-ink", 5, 6);
  out += one(cut([[mx + 70, mt + 12],[mx + 96, mt + 4],[mx + 96, mt + 52],[mx + 70, mt + 44]], 1.4, p.seed + 54, 8), "f-slate", 3, 4);
  out += '<g class="f-cream2" style="opacity:.7"><path d="' + cutDisc(mx + 16, mt - 12, 15, 1.2, p.seed + 55, 12) + '"/>' +
    '<path d="' + cutDisc(mx + 50, mt - 12, 15, 1.2, p.seed + 56, 12) + '"/></g>';
  var hx = x + w - 122, ht = base - 152;
  out += '<g stroke="#4a3f36" stroke-width="5" fill="none"><path d="' +
    cutLine(hx, ht + 60, hx + 30, base, 1.2, p.seed + 60, 12) + '"/><path d="' +
    cutLine(hx + 76, ht + 60, hx + 46, base, 1.2, p.seed + 61, 12) + '"/><path d="' +
    cutLine(hx, ht + 60, hx + 46, base, 1.2, p.seed + 62, 12) + '"/><path d="' +
    cutLine(hx + 76, ht + 60, hx + 30, base, 1.2, p.seed + 63, 12) + '"/></g>';
  out += one(cutRect(hx - 4, ht + 52, 86, 18, 1.2, p.seed + 64, 8), "f-cream3", 3, 4);
  out += one(cutRect(hx - 4, ht, 86, 42, 1.4, p.seed + 65, 8), "f-cream3", 4, 5);
  out += toolSign(x + 470, p.i, p.seed + 70);
  return out;
};

/* the picture house at the end of the street. The name is cut into the
   canopy well above the screen, because the screen is a real frame the
   reader can start, and nothing of ours may sit on top of it. */
P.marquee = function(p){
  var x = p.x, w = p.w, base = FLOOR + 6, top = base - 430, i, out = "";
  out += one(cutRect(x, top, w, base - top, 2.8, p.seed, 40), "f-plum", 10, 11);
  /* the canopy: one wide sheet with a row of bulbs along its lip */
  var ct = top - 18, cb = ct + 92;
  out += one(cut([[x - 34, cb],[x + w + 34, cb - 4],[x + w + 14, ct],[x - 14, ct + 4]], 2.6, p.seed + 1, 28), "f-cream", 9, 10);
  var bulbs = "";
  for(i = 0; i * 46 < w + 60; i++) bulbs += '<circle cx="' + f(x - 26 + i * 46) + '" cy="' + f(cb + 2) + '" r="5"/>';
  out += '<g class="f-gold">' + bulbs + "</g>";
  /* The name of the film is set 40 units right of the middle of the
     canopy, not on it, and it is cut at 28 and not at 34.
     At the stop where this beat is read the canopy runs across the top
     of the frame, and it has to pass between two things: the block of
     words, which is pinned to the left, and the two paper tabs in the
     top right corner. On a 1280 stage that lane is only 487 wide, which
     34 point letters do not fit through. 28 clears both sides at every
     stage width. On a phone the frame holds only half this front, and
     40 units the wrong way would push the name off the right edge, so
     the .lb rule slides the pair back. The canopy itself is one flat
     sheet and does not care where on it the type sits. */
  var tg = fitLabel(x + w / 2 + 40, ct + 46, COPY.cinema, 28, w - 90, "sgn", "#3a2e28") +
           fitLabel(x + w / 2 + 40, ct + 74, COPY.cinemaSub, 18, w - 90, "sgb", "#6b543f");
  out += '<g class="mqt">' + tg + "</g>";
  /* the ticket booth and the doors, both under the pinned screen */
  var bx = x + w - 176;
  out += one(cutRect(bx, base - 156, 132, 156, 2, p.seed + 10, 18), "f-cream2", 7, 8);
  out += one(cutRect(bx + 16, base - 132, 100, 62, 1.6, p.seed + 11, 12), "f-glass", 0, 0);
  out += one(cutRect(bx + 4, base - 172, 124, 24, 1.4, p.seed + 12, 12), "f-red", 4, 5);
  var dx = x + 30;
  for(i = 0; i < 2; i++){
    out += one(cutRect(dx + i * 76, base - 148, 64, 148, 1.8, p.seed + 20 + i, 14), "f-brown2", 4, 5);
    out += '<g class="f-gold"><path d="' + cutDisc(dx + i * 76 + (i ? 12 : 52), base - 74, 4.4, 0.8, p.seed + 30 + i, 8) + '"/></g>';
  }
  return out;
};

/* --- the growth track -------------------------------------------------
   The Affirm beat gets a rollercoaster cut from paper, in the shape the
   numbers actually make: a long flat run at nothing much, then a blade
   that goes almost straight up. It starts at a "$0" board on a stake
   and ends on a crest marked "$10B", with a small car parked on top.
   The rail is uncovered from the left as the traveller walks the beat,
   through a clip rectangle the loop widens, so the line is drawn rather
   than simply present. */

P.growthtrack = function(p){
  var x = p.x, w = p.w;
  var y0 = p.y0 == null ? 596 : p.y0, y1 = p.y1 == null ? 330 : p.y1;
  var rise = y0 - y1, n = 60, i, t, out = "";
  function ry(tt){
    /* nothing for the first two fifths, then a climb that gets steeper
       the whole way up. The small waver on the flat run keeps it a
       ride cut from paper instead of a chart line drawn with a rule. */
    var lift = Math.pow(clamp((tt - 0.42) / 0.58, 0, 1), 2);
    return y0 - rise * lift - Math.sin(tt * Math.PI * 3.4) * 5 * (1 - lift);
  }
  var top = [], bot = [], posts = "", ties = "";
  for(i = 0; i <= n; i++){
    t = i / n;
    top.push([x + w * t, ry(t) - 9]);
    bot.push([x + w * t, ry(t) + 9]);
  }
  /* gap: a stretch of the run, as a pair of fractions along it, with no
     legs under it, so the trestle never stands a row of posts across a
     sign that has to be read */
  var gp = p.gap || null;
  for(i = 5; i < n; i += 6){
    t = i / n;
    var qx = x + w * t, qy = ry(t) + 5;
    if(FLOOR + 6 - qy < 14) continue;
    if(gp && t > gp[0] && t < gp[1]) continue;
    posts += '<path d="' + cutRect(qx - 6, qy, 12, FLOOR + 6 - qy, 1.4, p.seed + 40 + i, 30) + '"/>';
  }
  out += '<g class="f-kraft3" style="opacity:.92">' + posts + "</g>";
  bot.reverse();
  out += one(cut(top.concat(bot), 1.5, p.seed, 8), "f-red2", 5, 7);
  for(i = 1; i < n; i += 2){
    t = i / n;
    ties += '<path d="' + cutRect(x + w * t - 3, ry(t) - 13, 6, 26, 0.9, p.seed + 200 + i, 4) + '"/>';
  }
  out += '<g class="f-kraft2" style="opacity:.8">' + ties + "</g>";

  /* the car, parked on the crest */
  var cx = x + w * 0.985, cy = ry(0.985) - 12;
  out += one(cut([[cx - 26, cy - 26],[cx + 26, cy - 30],[cx + 30, cy],[cx - 30, cy]], 1.6, p.seed + 9, 8), "f-gold", 4, 5);
  out += '<g class="f-ink" style="opacity:.85"><path d="' + cutDisc(cx - 15, cy + 5, 6, 1, p.seed + 10, 9) +
    '"/><path d="' + cutDisc(cx + 15, cy + 5, 6, 1, p.seed + 11, 9) + '"/></g>';

  /* the crest plaque, revealed with the rail it belongs to. It hangs
     over the top of the blade, where no walker and no caption reaches. */
  var lx = x + w * 0.9, ly = y1 - 112;
  out += one(cutRect(lx - 80, ly, 160, 66, 1.8, p.seed + 12, 12), "f-cream", 6, 7);
  out += label(lx, ly + 50, "$10B", 44, "sgn", "#93412f");

  var head = '<clipPath id="trkClip" clipPathUnits="userSpaceOnUse">' +
    '<rect id="trkRect" x="' + f(x - 80) + '" y="-700" width="0" height="2400"/></clipPath>';
  /* The start board is never hidden: the ride has to begin somewhere,
     and the number it begins at is half the point. It is carried on a
     stake up out of the walking band, because at rail height the man
     walking the beat stands in front of it. */
  var sx = x + 4, start = one(cutRect(sx - 4, y0 - 118, 12, 122, 1.2, p.seed + 21, 12), "f-kraft3", 4, 5) +
    one(cutRect(sx - 52, y0 - 172, 108, 60, 1.6, p.seed + 20, 10), "f-cream", 5, 6) +
    label(sx + 2, y0 - 128, "$0", 40, "sgn", "#6b543f");
  return head + '<g clip-path="url(#trkClip)">' + out + "</g>" + start;
};

/* =================================================================
   4. THE HERO
   Rebuilt as a real chain. The old rig hung every limb off the same
   pair of shared origins, so a rotated torso tore the arms off it.
   Now the hierarchy IS the skeleton:

     rig
       legB  -> shB                  (hip -> knee)
       torso -> armB -> fArmB        (hip -> shoulder -> elbow)
                head                 (neck)
                armF -> fArmF
       legF  -> shF

   Both legs pivot on the hip point; the torso pivots on the SAME hip
   point, so rotating the torso can never open a gap there. Every limb
   carries a cut paper disc centred exactly on its own pivot, and a
   disc centred on a rotation origin is rotation invariant, so no seam
   can appear at any frame. One local unit = one world unit at scale 1.
   ================================================================= */

var FOOTY = 158, KNEEY = 126, HIPY = 92, SHY = 50, NECKY = 44, CX = 80;
var THIGH = 34, SHIN = 32, UARM = 26, FARM = 24;

var FORMS = {
  /* the toddler walks past the cream house front, so cream legs would
     leave a shirt floating in mid air. He wears the same blue as the
     child he becomes, which also makes the growth read as one person. */
  baby:   {sc:0.50, hr:17, tw:13, lw:7.6, aw:6.6, fy:118,
           top:"f-gold",  bot:"f-blue3",  hair:"f-brown",  skin:"f-kraft"},
  child:  {sc:0.58, hr:17, tw:14, lw:8.0, aw:6.6, fy:158,
           top:"f-teal",  bot:"f-blue3",  hair:"f-brown2", skin:"f-kraft"},
  teen:   {sc:0.74, hr:16, tw:15, lw:8.4, aw:6.8, fy:158,
           top:"f-red2",  bot:"f-blue4",  hair:"f-brown2", skin:"f-kraft"},
  /* the grown up wears warm paper on purpose: a navy shirt vanishes
     into navy hills and night windows, and the hero must read against
     every backdrop in the story. */
  adult:  {sc:0.85, hr:15, tw:16, lw:8.8, aw:7.0, fy:158,
           top:"f-red",   bot:"f-blue4",  hair:"f-ink",    skin:"f-kraft"},
  parent: {sc:0.85, hr:15, tw:16, lw:8.8, aw:7.0, fy:158, stroller:1,
           top:"f-red",   bot:"f-blue4",  hair:"f-ink",    skin:"f-kraft"},
  /* the same walk with a second child in it: the older one on foot
     between his parents, the younger one still in the wagon. He is the
     child form shrunk to the height of a five year old standing next
     to a grown up, and he keeps the child colours so the boy who ran
     down the first street is recognisably the boy who is walking now. */
  family: {sc:0.85, hr:15, tw:16, lw:8.8, aw:7.0, fy:158, stroller:1,
           top:"f-red",   bot:"f-blue4",  hair:"f-ink",    skin:"f-kraft",
           kid:{ox:-40, k:0.682, hr:17, tw:14, lw:8.0, aw:6.6,
                top:"f-teal", bot:"f-blue3", hair:"f-brown2", skin:"f-kraft"}}
};

/* seat and desk heights fall out of the puppet: seated, the hip rests
   at shin height, so the chair can never be guessed wrong */
function seatOf(k){ return Math.round(FLOOR - SHIN * FORMS[k].sc); }

/* one limb segment: a tapered paper strip with a joint disc at each end.
   The disc at (jx,jy) sits exactly on the rotation origin. */
function seg(jx, jy, len, half, seed, cls){
  var body = cut([[jx - half, jy],[jx + half, jy],
                  [jx + half * 0.84, jy + len],[jx - half * 0.84, jy + len]], 1.1, seed, 6);
  return sheet([cutDisc(jx, jy, half * 1.06, 0.8, seed + 3, 11),
                body,
                cutDisc(jx, jy + len, half * 0.92, 0.8, seed + 5, 11)], cls, 0, 0);
}
function org(x, y){ return ' style="transform-origin:' + f(x) + 'px ' + f(y) + 'px"'; }

/* the whole figure, in its own local frame, offset by ox.
   swap flips the limb var assignment so a companion walking beside the
   hero is out of phase with him instead of marching in lockstep.
   k shrinks the whole figure about its own feet, so a shorter person
   can stand on the same ground line as the others. Every joint height,
   every limb length and every thickness is computed from k rather than
   wrapped in a scale transform: the poses are CSS rotations with an
   explicit transform-origin, and a nested scale would move the origins
   out from under them. At k = 1 the numbers come out at 158 / 126 / 92
   / 50 / 44 again, so the four figures that were here before are drawn
   exactly as they were. */
function puppet(ox, F, swap, seed, k){
  var hx = CX + ox, s = seed || 900, K = k || 1;
  var A = swap ? ["legF","shF","armF","fArmF"] : ["legB","shB","armB","fArmB"];
  var B = swap ? ["legB","shB","armB","fArmB"] : ["legF","shF","armF","fArmF"];
  /* joints, measured up from the feet */
  var FT = FOOTY,
      KN = FOOTY - (FOOTY - KNEEY) * K,
      HP = FOOTY - (FOOTY - HIPY) * K,
      SD = FOOTY - (FOOTY - SHY) * K,
      NK = FOOTY - (FOOTY - NECKY) * K;
  var TH = THIGH * K, SN = SHIN * K, UA = UARM * K, FA = FARM * K;
  var hr = F.hr * K, tw = F.tw * K, lw = F.lw * K, aw = F.aw * K;
  var hy = NK - hr + K;

  function leg(cn, sn, sd, cls){
    var foot = cut([[hx - lw, FT - 4 * K],[hx + lw * 1.9, FT - 6 * K],
                    [hx + lw * 2.1, FT],[hx - lw * 1.1, FT + K]], 1, sd + 21, 4);
    return '<g class="' + cn + '"' + org(hx, HP) + '>' +
      seg(hx, HP, TH, lw, sd, cls) +
      '<g class="' + sn + '"' + org(hx, KN) + '>' +
        seg(hx, KN, SN, lw * 0.9, sd + 11, cls) +
        one(foot, "f-ink", 0, 0) +
      "</g></g>";
  }
  function arm(cn, fn, sd, cls){
    return '<g class="' + cn + '"' + org(hx, SD) + '>' +
      seg(hx, SD, UA, aw, sd, cls) +
      '<g class="' + fn + '"' + org(hx, SD + UA) + '>' +
        seg(hx, SD + UA, FA, aw * 0.9, sd + 11, cls) +
        '<g class="' + F.skin + '"><path d="' + cutDisc(hx, SD + UA + FA + 2 * K, aw * 1.15, 0.8, sd + 23, 10) + '"/></g>' +
      "</g></g>";
  }

  var torso = cut([[hx - tw * 0.92, HP + 2 * K],[hx - tw, SD + 6 * K],[hx - tw * 0.8, SD - 3 * K],
                   [hx + tw * 0.8, SD - 3 * K],[hx + tw, SD + 6 * K],[hx + tw * 0.92, HP + 2 * K]], 1.4, s + 40, 8);
  /* long hair is one sheet cut behind the head and taken down past the
     shoulder. It is laid down BEFORE the face, so the profile, the eyes
     and the smile all stay on top of it and the head still reads at the
     size a cutout figure is actually seen at. */
  var backHair = "";
  if(F.long){
    backHair = '<g class="' + F.hair + '"><path d="' + cut([
      [hx + hr * 0.46, hy - hr * 1.16], [hx - hr * 1.02, hy - hr * 0.78],
      [hx - hr * 1.36, hy + hr * 0.58], [hx - hr * 1.24, SD + 24 * K],
      [hx - hr * 0.30, SD + 28 * K],    [hx + hr * 0.30, hy + hr * 0.88],
      [hx + hr * 0.94, hy - hr * 0.18]], 1.4, s + 56, 8) + '"/></g>';
  }

  var fringe = cut([[hx - hr, hy + 2 * K],[hx - hr * 0.9, hy - hr * 0.9],[hx, hy - hr * 1.16],
           [hx + hr * 0.86, hy - hr * 0.78],[hx + hr * 0.66, hy - hr * 0.2],
           [hx + hr * 0.2, hy - hr * 0.5],[hx - hr * 0.5, hy - hr * 0.3]], 1.3, s + 52, 6);
  var eyes = '<g class="f-ink"><path d="' + cutDisc(hx + hr * 0.54, hy - K, 2.5 * K, 0.5, s + 53, 8) + '"/>' +
        '<path d="' + cutDisc(hx + hr * 0.08, hy - K, 2.5 * K, 0.5, s + 54, 8) + '"/></g>';
  var cheeks = '<g class="f-red2" style="opacity:.34"><path d="' + cutDisc(hx + hr * 0.76, hy + hr * 0.42, hr * 0.2, 0.6, s + 55, 8) + '"/></g>';
  var mouth = '<path fill="none" stroke="#7a4a3a" stroke-width="' + f(hr * 0.14) + '" stroke-linecap="round" d="M' +
        f(hx + hr * 0.12) + " " + f(hy + hr * 0.42) + " q" + f(hr * 0.26) + " " + f(hr * 0.24) + " " + f(hr * 0.5) + " " + f(-hr * 0.06) + '"/>';

  var head = '<g class="head"' + org(hx, NK) + '>' +
    one(cutRect(hx - aw * 0.8, NK - 6 * K, aw * 1.6, 12 * K, 0.9, s + 50, 3), F.skin, 0, 0) +
    backHair +
    '<g class="' + F.skin + '"><path d="' + cutDisc(hx, hy, hr, 1.5, s + 51, 14) + '"/></g>' +
    '<g class="' + F.hair + '"><path d="' + fringe + '"/></g>' +
    eyes + cheeks + mouth +
    "</g>";

  /* a scarf knotted at the throat. It is laid over the top of the torso
     sheet, so it reads as a second piece of paper and not as a stripe
     printed on the first one. */
  var scarf = F.scarf ? one(cut([
      [hx - tw * 0.72, SD - 4 * K],[hx + tw * 0.72, SD - 4 * K],
      [hx + tw * 0.60, SD + 9 * K],[hx - tw * 0.60, SD + 9 * K]], 1.1, s + 44, 5), F.scarf, 0, 0) +
    one(cut([[hx + tw * 0.06, SD + 5 * K],[hx + tw * 0.56, SD + 3 * K],
             [hx + tw * 0.44, SD + 26 * K],[hx - tw * 0.02, SD + 24 * K]], 1.1, s + 45, 6), F.scarf, 0, 0) : "";

  /* the dress is hung off the hip and cut AFTER both legs, so it covers
     the top of the thighs the way a real skirt does. The dots are a
     second colour of paper punched out and dropped on. */
  var dress = "";
  if(F.dress){
    var hem = HP + 34 * K, dots = "", di;
    for(di = 0; di < 5; di++){
      var dcol = [-0.98, -0.36, 0.30, 0.92, -0.04][di];
      var drow = [0.30, 0.62, 0.30, 0.60, 0.90][di];
      dots += '<path d="' + cutDisc(hx + tw * dcol * (0.98 + drow * 0.7),
        HP - 2 * K + (hem - HP + 2 * K) * drow, tw * 0.15, 0.6, s + 46 + di, 8) + '"/>';
    }
    dress = one(cut([[hx - tw * 0.98, HP - 3 * K],[hx + tw * 0.98, HP - 3 * K],
                     [hx + tw * 1.72, hem],[hx - tw * 1.72, hem]], 1.4, s + 43, 8), F.dress, 0, 0) +
      '<g class="' + (F.dot || "f-cream2") + '" style="opacity:.85">' + dots + "</g>";
  }

  var armA = arm(A[2], A[3], s + 200, F.top);
  var armB = arm(B[2], B[3], s + 300, F.top);
  var chest = sheet([cutDisc(hx, HP, tw * 0.92, 1, s + 41, 12), torso], F.top, 0, 0) +
    one(cut([[hx - tw * 0.94, HP - 12 * K],[hx + tw * 0.94, HP - 12 * K],
             [hx + tw * 0.92, HP + 3 * K],[hx - tw * 0.92, HP + 3 * K]], 1.1, s + 42, 5), F.bot, 0, 0) +
    scarf;
  /* the near arm laps over the chest and the far arm goes behind it,
     which is what a body seen side on does. Both go under the head, or
     a raised arm would be cut straight across the face. */
  var stack = armA + chest + head + armB;
  return '<g class="rig"' + org(hx, FT) + '>' +
    leg(A[0], A[1], s + 100, F.bot) +
    '<g class="torso"' + org(hx, HP) + '>' + stack + "</g>" +
    leg(B[0], B[1], s + 400, F.bot) +
    dress +
  "</g>";
}

/* the stroller is a prop the parent pushes, cut from the same paper and
   parked in front of the hands so the walk still reads */
function stroller(F){
  var x = CX + 74, base = FOOTY, s = 1700, out = "";
  out += '<g class="f-ink" style="opacity:.9"><path d="' + cutDisc(x + 6, base - 9, 10, 1.1, s, 12) + '"/>' +
    '<path d="' + cutDisc(x + 52, base - 9, 10, 1.1, s + 1, 12) + '"/></g>';
  out += one(cut([[x - 4, base - 62],[x + 58, base - 70],[x + 60, base - 34],[x + 8, base - 26]], 1.6, s + 2, 8), "f-red2", 5, 6);
  out += one(cut([[x + 2, base - 74],[x + 44, base - 82],[x + 46, base - 60],[x + 4, base - 54]], 1.5, s + 3, 6), "f-cream2", 4, 4);
  /* one arm is up over the rim of the wagon and stays up: a baby holds
     a hand out of a pram at every age. */
  out += '<g class="' + F.skin + '"><path d="' +
    cut([[x + 15, base - 74],[x + 5, base - 90],[x - 1, base - 88],[x + 9, base - 70]], 1, s + 7, 5) + '"/>' +
    '<path d="' + cutDisc(x + 1, base - 92, 4.4, 0.7, s + 8, 9) + '"/></g>';
  out += '<g class="' + F.skin + '"><path d="' + cutDisc(x + 24, base - 84, 9, 1, s + 4, 10) + '"/></g>';
  /* the push bar ends at the hands, not in the air above them. Across
     the walk the hand disc travels between x 60 and 86 at y 98 to 101,
     so the bar is laid along that line and the grip is never broken. */
  out += '<g stroke="#3a2e28" stroke-width="4" fill="none" style="opacity:.85"><path d="' +
    cutLine(x - 4, base - 66, CX + 2, base - 57, 1.2, s + 5, 14) + '"/><path d="' +
    cutLine(x + 8, base - 28, x + 54, base - 34, 1.2, s + 6, 14) + '"/></g>';
  return out;
}

/* --- poses ---------------------------------------------------------- */

var V = ["by","rr","ta","ha","l1","s1","l2","s2","a1","e1","a2","e2"];

/* six stepped walk frames. The knee only ever folds backward. */
var WALK = [], wi;
for(wi = 0; wi < 6; wi++){
  var wa = wi / 6 * TAU;
  WALK.push({
    by: -1.4 - 1.4 * Math.cos(2 * wa),
    rr: 0,
    ta: 2 * Math.sin(2 * wa),
    ha: -1.6 * Math.sin(2 * wa),
    l1: -30 * Math.sin(wa),
    s1: 24 + 24 * Math.sin(wa + 2.4),
    l2: -30 * Math.sin(wa + Math.PI),
    s2: 24 + 24 * Math.sin(wa + Math.PI + 2.4),
    a1: 20 * Math.sin(wa),
    e1: -16 - 10 * Math.sin(wa),
    a2: 20 * Math.sin(wa + Math.PI),
    e2: -16 - 10 * Math.sin(wa + Math.PI)
  });
}

/* the first walk. He is upright, never on hands and knees: short flat
   footed steps, knees that never quite straighten, both arms held out
   for balance, and the whole rig rocking a little side to side. That
   rock is what makes it read as a toddler rather than a small adult. */
var TODDLE = [], ci;
for(ci = 0; ci < 6; ci++){
  var td = ci / 6 * TAU;
  TODDLE.push({
    by: -0.9 - 1.1 * Math.cos(2 * td),
    rr: 3.6 * Math.sin(td),
    ta: -5 + 2.4 * Math.sin(2 * td),
    ha: 3 - 3.2 * Math.sin(td),
    l1: -17 * Math.sin(td),
    s1: 21 + 16 * Math.sin(td + 2.4),
    l2: -17 * Math.sin(td + Math.PI),
    s2: 21 + 16 * Math.sin(td + Math.PI + 2.4),
    a1: -76 - 10 * Math.sin(td),
    e1: 18 + 8 * Math.sin(td),
    a2: -66 + 10 * Math.sin(td),
    e2: 14 - 8 * Math.sin(td)
  });
}

/* seated: the rig drops so the hip lands on the seat, the thighs go
   flat and the shins drop straight to the floor */
var SIT = {by: THIGH, rr:0, ta:-4, ha:3, l1:-90, s1:90, l2:-84, s2:84,
           a1:-45, e1:-48, a2:-38, e2:-42};
/* seated AND playing: the same legs, but the whole torso tipped in at
   the screen and both arms out level, so the hands come down on the
   board on the desk. This is the difference between a boy who owns a
   computer and a boy who is inside one. */
var PLAY = {by: THIGH, rr:0, ta:5, ha:1, l1:-90, s1:90, l2:-84, s2:84,
            a1:-76, e1:-2, a2:-68, e2:-6};
var STAND = {by:0, rr:0, ta:0, ha:0, l1:-7, s1:4, l2:9, s2:12,
             a1:-9, e1:-14, a2:11, e2:-18};

/* --- the puppets, built once, swapped by form ----------------------- */

var heroWrap = null, HERO = {}, heroKey = "";
function buildHeroes(){
  var keys = ["baby","child","teen","adult","parent","family"], n, out = "";
  for(n = 0; n < keys.length; n++){
    var k = keys[n], F = FORMS[k], pal;
    for(pal = 0; pal < 2; pal++){
      if(pal && (k === "baby" || k === "child" || k === "teen")) continue;
      var id = k + (pal ? "-pal" : "");
      var sh = '<g class="f-ink" style="opacity:.17"><path d="' +
        cutDisc(CX, F.fy + 3, F.tw * 1.5, 1.4, 1500 + n, 14) + '"/></g>';
      /* the row is packed tight and the figures lap over each other,
         which is what a family walking abreast looks like from the
         side. Nothing is cut off by the row: .hero is set to overflow
         visible, so the viewBox is a measuring frame and not a
         window. */
      var mOx = F.palOx == null ? -74 : F.palOx;
      var body = "";
      if(pal){
        body += '<g class="f-ink" style="opacity:.13"><path d="' +
          cutDisc(CX + mOx, F.fy + 3, F.tw * 1.3, 1.4, 1560, 14) + '"/></g>';
        /* she is cut in one warm gold dress with cream dots punched out
           of it, a plum scarf at the throat and plum tights below the
           hem. Gold is the one colour in the box that is not worn by
           anybody else on the road with her, so she reads at a glance in
           snow, at night and against the cream house fronts. The long
           hair is the same sheet she has always had. */
        /* she takes the opposite arm and leg phase to the man beside
           her, so the two of them are not one figure printed twice. */
        body += puppet(mOx, {sc:F.sc, hr:16, tw:15, lw:8.2, aw:6.6, long:1,
          top:"f-gold", dress:"f-gold", dot:"f-cream", scarf:"f-plum",
          bot:"f-plum", hair:"f-brown2", skin:"f-kraft"}, 1, 1900);
      }
      /* the older child stands between the two of them and takes his
         father's phase, which leaves him out of step with his mother. */
      var kid = "";
      if(F.kid){
        kid = '<g class="f-ink" style="opacity:.13"><path d="' +
          cutDisc(CX + F.kid.ox, F.fy + 3, F.kid.tw * F.kid.k * 1.5, 1.3, 1580, 13) + '"/></g>' +
          puppet(F.kid.ox, F.kid, 0, 2100, F.kid.k);
      }
      body += kid;
      body += sh + puppet(0, F, 0, 900 + n * 7);
      if(F.stroller) body += stroller(F);
      out += '<svg class="hero" id="hero-' + id + '" viewBox="0 0 200 176" ' +
        'aria-hidden="true" focusable="false" preserveAspectRatio="xMidYMax meet">' + body + "</svg>";
      HERO[id] = null;
    }
  }
  heroWrap.innerHTML = out;
  var key;
  for(key in HERO) if(Object.prototype.hasOwnProperty.call(HERO, key)) HERO[key] = document.getElementById("hero-" + key);
}

function setPose(el, p){
  var k;
  for(k = 0; k < V.length; k++){
    var v = V[k];
    el.style.setProperty("--" + v, f(p[v] || 0) + (v === "by" ? "px" : "deg"));
  }
}

/* =================================================================
   5. BUILD: TIMELINE -> DOM, once, at load
   ================================================================= */

var VPW = 1000;
/* the set is built for a 1000 unit wide frame. Past this many pixels the
   stage stops growing and is centred instead, so an ultrawide window can
   not show so much world at once that the opening scene is already gone. */
var STAGE_MAX = 1920;
var DEPTHS = [{k:"sky",d:0.05},{k:"far",d:0.18},{k:"mid",d:0.44},
              {k:"near",d:0.72},{k:"ground",d:1.00},{k:"fg",d:1.20}];

var stage = document.getElementById("stage");
var world = document.getElementById("world");
var uiHost = document.getElementById("ui");
var tintEl = document.getElementById("tint");
var skyfill = document.getElementById("skyfill");
var glowLayer = document.getElementById("glowLayer");
var celestWrap = document.getElementById("celestWrap");
var skyLights = document.getElementById("skyLights");
var starHost = document.getElementById("starHost");
var sunBox = document.getElementById("sunBox");
var moonBox = document.getElementById("moonBox");
var spacer = document.getElementById("spacer");
var scrollEl = document.getElementById("scroll");
var progEl = document.getElementById("progBar"), progOn = false;
var frameEl = document.getElementById("frame");
var metricsEl = document.getElementById("metrics");

/* how far ahead of its own beat a backdrop flat is slid in, and how far
   past the end of it the flat is still guaranteed to cover the frame */
var BAND_IN = 240, BAND_OUT = 560;
var TRK = null;

var starts = [], WORLD_SPAN = 0, i, j, n;
for(i = 0; i < TIMELINE.length; i++){ starts.push(WORLD_SPAN); WORLD_SPAN += TIMELINE[i].span; }

/* --- parallax layers ------------------------------------------------ */

var layers = [];
for(i = 0; i < DEPTHS.length; i++){
  var d = DEPTHS[i].d, K = (1 - d) * (VPW / 2);
  var el = document.createElement("div");
  el.className = "layer";
  var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "sheetsvg");
  svg.setAttribute("preserveAspectRatio", "none");
  var rec = {el:el, d:d, svg:svg, groups:[], lo:Infinity, hi:-Infinity};
  var markup = "", bandLos = [];
  for(j = 0; j < TIMELINE.length; j++){
    var scn = TIMELINE[j], list = scn.layers[DEPTHS[i].k] || [], body = "";
    /* each group records the real span of paper it holds, in this layer's
       own coordinates. Culling by scene span instead would hide the world
       spanning cardboard base the moment scene 0 fell behind the camera. */
    var glo = Infinity, ghi = -Infinity, bandLo = Infinity;
    for(n = 0; n < list.length; n++){
      var pc = list[n], painter = P[pc.t];
      if(!painter) continue;
      var abs = {}, key;
      for(key in pc) if(Object.prototype.hasOwnProperty.call(pc, key)) abs[key] = pc[key];
      if(pc.band){
        var w0 = starts[j] + pc.band.from, w1 = starts[j] + pc.band.to;
        /* A backdrop flat belongs to its own beat. It is anchored so the
           moment the camera reaches that beat the flat already fills the
           frame, and it is cut wide enough to hold the frame to the end
           of it. Anchoring the flat to the viewport instead made every
           backdrop arrive thousands of units late, so a scene wore the
           flat of the beat three beats behind it. */
        abs.x = (w0 - BAND_IN) * d;
        abs.w = VPW + 900 + (w1 - w0 + BAND_IN + BAND_OUT) * d;
        if(w0 < bandLo) bandLo = w0;
      } else if(pc.from !== undefined && pc.to !== undefined){
        /* a strip of ground is measured from the start of its own beat, so
           the running order of the beats can be changed without every road
           and every stretch of water having to be measured again */
        var gto = pc.to === "END" ? WORLD_SPAN + 700 - starts[j] : pc.to;
        abs.to = gto;
        abs.x = (starts[j] + pc.from) * d + K;
        abs.w = gto - pc.from;
      } else {
        abs.x = (starts[j] + pc.x) * d + K;
      }
      if(pc.t === "growthtrack") TRK = {x:abs.x, w:abs.w};
      body += painter(abs);
      if(abs.x < glo) glo = abs.x;
      var right = abs.x + (abs.w !== undefined ? abs.w : 0);
      if(right > ghi) ghi = right;
    }
    if(glo === Infinity){ glo = 1; ghi = 0; }
    else {
      if(glo - 340 < rec.lo) rec.lo = glo - 340;
      if(ghi + 340 > rec.hi) rec.hi = ghi + 340;
    }
    bandLos.push(bandLo < Infinity ? bandLo : null);
    markup += '<g class="scenegrp" data-lo="' + f(glo - 340) + '" data-hi="' + f(ghi + 340) + '">' + body + "</g>";
  }
  if(rec.lo === Infinity){ rec.lo = 0; rec.hi = VPW; }
  rec.lo = Math.floor(rec.lo); rec.hi = Math.ceil(rec.hi);
  svg.innerHTML = markup;
  el.appendChild(svg);
  world.appendChild(el);
  var gs = svg.querySelectorAll(".scenegrp");
  /* a flat is on stage from just before its own beat until the next flat
     in the same layer takes the frame. One in, one out, like a stagehand,
     instead of every flat this layer owns piling up behind the traveller. */
  var firstBand = -1, jj;
  for(j = 0; j < gs.length; j++){
    /* the beat this group belongs to, kept so a one shot animation can
       be started when the reader reaches that beat. A far flat is only
       compressed by its depth, so on the back layers one group can
       overlap the frame from the first pixel of the story: without this
       the aeroplane would fly its single crossing at load, hours of
       scrolling before anyone got to the beat it belongs to. */
    var gg = {el:gs[j], lo:parseFloat(gs[j].getAttribute("data-lo")),
      hi:parseFloat(gs[j].getAttribute("data-hi")), on:true, live:false,
      sc0:starts[j], sc1:starts[j] + TIMELINE[j].span};
    if(bandLos[j] !== null){
      if(firstBand < 0) firstBand = j;
      var nxt = null;
      for(jj = j + 1; jj < bandLos.length; jj++){ if(bandLos[jj] !== null){ nxt = bandLos[jj]; break; } }
      gg.wlo = (j === firstBand) ? -1e7 : bandLos[j] - BAND_IN;
      gg.whi = nxt === null ? 1e7 : nxt - BAND_IN;
      gg.dim = false;
    }
    rec.groups.push(gg);
  }
  layers.push(rec);
  if(DEPTHS[i].k === "ground"){
    heroWrap = document.createElement("div");
    heroWrap.className = "heroWrap";
    world.appendChild(heroWrap);
  }
}
world.appendChild(layers[layers.length - 1].el);   /* fg paints after the hero */
buildHeroes();

/* the deep sheet of the two-sheet light. It goes in ahead of the ground
   layer, so sky, far, mid and near are under it and everything the story
   is actually about -- the ground, the props, the man, the paper pinned
   to the set -- is in front of it and stays bright. */
var tintBackEl = document.createElement("div");
tintBackEl.className = "tint-b";
world.insertBefore(tintBackEl, layers[4].el);

/* --- the take off ----------------------------------------------------
   Driven by the reader's own scroll, not by a clock. The stairs are
   pulled away, the aircraft rolls, rotates and climbs out of the top of
   the frame, and it does all of it in the stretch of world AFTER the
   beat that puts him inside it. */
var jetEl = document.getElementById("jetGo");
var jetStairsEl = document.getElementById("jetStairs");
var jetFaceEl = document.getElementById("jetFace");
var TK0 = 0, TK1 = 1;
for(i = 0; i < TIMELINE.length; i++){
  if(TIMELINE[i].id === "flight"){ TK0 = starts[i] + 520; TK1 = starts[i] + 1040; }
}
/* rotation pivot: the main gear, so the nose lifts and the wheels do not */
var TKPX = 480, TKPY = FLOOR + 4;
function sm(a, b, t){
  var q = clamp((t - a) / (b - a), 0, 1);
  return q * q * (3 - 2 * q);
}
var lastTk = -1, lastFo = -1;
function flyJet(focus){
  if(!jetEl) return;
  /* the face at the window is handed over from the figure on the stairs.
     It is worked out BEFORE the take off guard below, because tk is
     pinned at zero for the whole walk up and the guard would park the
     hand over on its first frame. The cross fade starts a few units
     early, so there is never a frame with neither of him on the paper. */
  if(jetFaceEl){
    var fo = sm(TK0 - 12, TK0 + 26, focus);
    if(Math.abs(fo - lastFo) > 0.004){ lastFo = fo; jetFaceEl.style.opacity = f(fo); }
  }
  var tk = clamp((focus - TK0) / (TK1 - TK0), 0, 1);
  if(Math.abs(tk - lastTk) < 0.0015) return;
  lastTk = tk;
  var roll = sm(0, 0.30, tk), climb = sm(0.30, 1, tk);
  var tx = roll * 150 + climb * 900;
  var ty = -climb * climb * 700;
  var rot = -11 * sm(0.26, 0.50, tk) + 6 * sm(0.62, 1, tk);
  jetEl.setAttribute("transform", "translate(" + f(tx) + "," + f(ty) + ") rotate(" +
    f(rot) + " " + TKPX + " " + TKPY + ")");
  jetEl.style.opacity = f(1 - sm(0.80, 0.97, tk));
  if(jetStairsEl){
    var so = 1 - sm(0.02, 0.16, tk);
    jetStairsEl.style.opacity = f(so);
    /* wheeled away to the left as it goes, so it does not just dissolve */
    jetStairsEl.setAttribute("transform", "translate(" + f(-sm(0.02, 0.20, tk) * 90) + ",0)");
  }
}

/* --- lamp pools ------------------------------------------------------ */

var glowEls = [];
for(j = 0; j < TIMELINE.length; j++){
  var gl = TIMELINE[j].glows || [];
  for(i = 0; i < gl.length; i++){
    var g = gl[i], gd = document.createElement("div");
    gd.className = "glow " + (g.when === "day" ? "g-day" : g.when === "any" ? "g-any" :
      g.when === "home" ? "g-home" : "g-night") + (g.crt ? " g-crt" : "") +
      (g.cls ? " " + g.cls : "");
    gd.style.setProperty("--str", g.str);
    gd.style.background = "radial-gradient(circle closest-side, rgba(" + g.c + ",.62) 0%, rgba(" + g.c +
      ",.34) 42%, rgba(" + g.c + ",.1) 72%, rgba(" + g.c + ",0) 100%)";
    glowLayer.appendChild(gd);
    glowEls.push({el:gd, x:g.x + starts[j], y:g.y, r:g.r});
  }
}

/* =================================================================
   6. INTEGRAL TEXT
   A caption is a stack of torn paper strips with a world anchor and
   a placement spec. It travels with its scene, is blocked into that
   scene's negative space, and is cut from the same paper as the art.
   Nothing here is a card in a corner.
   ================================================================= */

var TEARN = 0;
function strip(cls, inner, rot, small){
  var t = (small ? TEARS_S : TEARS)[TEARN++ % (small ? TEARS_S.length : TEARS.length)];
  return '<span class="strip ' + cls + '" style="--tear:' + t + ';--rot:' + f(rot) + 'deg">' +
    '<span class="sh"></span><span class="fc">' + inner + "</span></span>";
}
function esc(s){ return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

var caps = [];
for(j = 0; j < TIMELINE.length; j++){
  var cl = TIMELINE[j].caps || [];
  for(i = 0; i < cl.length; i++){
    var c = cl[i], wrap = document.createElement("div"), html = "", k2;
    wrap.className = "capw" + (c.kind === "title" ? " titw" : "") +
      (c.tone === "dark" ? " dark" : "") + (c.big ? " big" : "") +
      (c.slow ? " slow" : "");
    wrap.style.setProperty("--mw", c.mw + "px");
    wrap.style.setProperty("--tilt", f(c.tilt || -1) + "deg");
    /* hs: a hand cut type size for a headline that has to hold one long
       sentence on ONE line at every width. one: never let it wrap. */
    if(c.hs) wrap.style.setProperty("--hl-fs", c.hs);
    if(c.chip) html += strip("cp", esc(c.chip), 1.4, 1);
    var hd = c.head || [];
    for(k2 = 0; k2 < hd.length; k2++){
      html += strip("hl" + (c.one ? " one" : "") + (c.sizes ? " t" + c.sizes[k2] : ""),
        esc(hd[k2]), k2 % 2 ? 0.5 : -0.4);
    }
    if(c.sub) html += strip("bd", esc(c.sub), 0.5);
    if(c.body){
      html += '<span class="bd-wrap" style="--bw:' + (c.bw || 500) + 'px">' +
        strip("bd", esc(c.body), 0.6) + "</span>";
    }
    if(c.sign) html += strip("sig", esc(c.sign), 2.2);
    if(c.link) html += '<span class="lnks">' + strip("lnk",
      '<a href="' + c.link.href + '" target="_blank" rel="noopener" tabindex="-1">' + esc(c.link.label) + "</a>", 0.8) + "</span>";
    if(c.links){
      var ls = "";
      for(k2 = 0; k2 < c.links.length; k2++){
        ls += strip("lnk", '<a href="' + c.links[k2].h + '" tabindex="-1"' +
          (c.links[k2].h.indexOf("http") === 0 ? ' target="_blank" rel="noopener"' : "") +
          ">" + esc(c.links[k2].t) + "</a>", k2 % 2 ? 0.9 : -0.7, 1);
      }
      html += '<span class="lnks">' + ls + "</span>";
    }
    if(c.hint){
      var ht = TEARS_S[TEARN++ % TEARS_S.length];
      html += '<span class="hint" style="--tear:' + ht + '">' +
        '<span class="sh"></span><span class="fc">' + esc(c.hint) +
        '<span class="arrow"></span></span></span>';
    }
    wrap.innerHTML = html;
    wrap.setAttribute("aria-hidden", "true");
    uiHost.appendChild(wrap);
    caps.push({el:wrap, x:c.x + starts[j], col:c.col || "center", row:c.row || "upper",
      w:0, h:0, on:null});
  }
}

/* =================================================================
   6b. ARTIFACTS
   The real work, pinned into the set as objects at ground depth: a
   torn cream mount, two strips of tape, and a small cut tag that says
   the thing opens somewhere else. Every one is a real link to a real
   address, and every clipping quotes its headline exactly.
   ================================================================= */

var artLayer = document.createElement("div");
artLayer.className = "arts";
/* two sheets carry their own light: the drawing app notice and the
   picture house poster. Both land in a night scene, and the dusk wash
   that sells the rest of the set would read them as background wall
   art. They go on a second layer that hangs in FRONT of the tint, so
   the paper keeps its full white and the lamps still warm it. */
var litLayer = document.createElement("div");
litLayer.className = "arts lit";
var arts = [];
for(j = 0; j < TIMELINE.length; j++){
  var arl = TIMELINE[j].arts || [];
  for(i = 0; i < arl.length; i++){
    /* a prop has nowhere to go, so it is not a link and carries no tag */
    var ar = arl[i], prop = ar.kind === "prop";
    var link = document.createElement(prop ? "div" : "a");
    link.className = "art" + (ar.kind === "clip" ? " clip" : prop ? " prop" :
      ar.kind === "shot" ? " shot" : ar.kind === "video" ? " video" : "");
    if(!prop){
      link.href = ar.href;
      link.target = "_blank";
      link.rel = "noopener";
      link.tabIndex = -1;
    }
    link.setAttribute("aria-hidden", "true");
    /* rev is the point on the road where this sheet is earned, gone the
       point where the beat that owns it hands the frame on */
    if(ar.rev != null || ar.gone != null) link.className += " late";
    link.style.setProperty("--tilt", f(ar.tilt || 0) + "deg");
    link.style.setProperty("--tear", TEARS[TEARN++ % TEARS.length]);
    link.style.setProperty("--tear2", TEARS_S[TEARN++ % TEARS_S.length]);
    var inr = ar.leg ? '<i class="art-leg"></i><span class="art-sh"></span>'
                     : '<span class="art-sh"></span>';
    if(ar.kind === "clip"){
      inr += '<span class="art-fc"><span class="cl-m">' + esc(ar.mast) + "</span>" +
        '<span class="cl-h">' + esc(ar.head) + "</span></span>";
    } else if(prop){
      inr += '<span class="art-fc">' + propSvg(ar) + "</span>";
    } else if(ar.kind === "video"){
      /* a facade, not a player: one still and the cut play tab on top of
         it. The still is loaded late, so a reader who never walks this
         far down the street asks the video host for nothing at all. */
      inr += '<span class="art-fc"><img src="' + ar.src + '" alt="' +
