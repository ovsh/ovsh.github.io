<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Miki Ovshievich</title>
<style>
/* ---------------------------------------------------------------
   THE JOURNEY, paper cutout.
   Every scene element is a flat paper shape with a hand cut edge.
   Depth = layered sheets, each casting a solid OFFSET shadow.
   No filter: blur anywhere. Softness lives in gradients only.

   TYPE DECISION
   display: a warm old style serif, set heavy and tight, letters
            blocked onto torn paper strips. This is the "cut from a
            magazine" voice and it carries every headline.
   body:    the system sans, at 18px and up, on wider torn strips.
   chips:   the same sans, small caps, on a small paper tag.
   The two voices never swap jobs.
   --------------------------------------------------------------- */

:root{
  --display:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,"Times New Roman",serif;
  --body:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  /* season drift: painters read these, the engine blends them */
  --leaf:#7d9a5c; --gr2:#8ea364; --gr3:#637a46;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{height:100%;overflow:hidden;background:#e2d2b4}
body{
  height:100%;
  overflow:hidden;
  background:#e2d2b4;
  color:#3a2e28;
  font:400 16px/1.45 var(--body);
  -webkit-font-smoothing:antialiased;
}
/* The story scrolls INSIDE one container, so the document itself never
   moves. The set is a sticky pane at the top of that container. This is
   what makes a ?p= deep link exact: the engine reads scrollTop, sets
   scrollTop, and the picture is always painted at the page origin. */
.scroll{position:fixed;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:contain;background:#e2d2b4;-webkit-overflow-scrolling:touch}
.scroll:focus{outline:none}
.scroll:focus-visible{outline:3px solid #2a3f57;outline-offset:-3px}
.sticky{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:#e2d2b4}
.spacer{width:1px;pointer-events:none}
.backdrop{position:absolute;inset:0;background:#e2d2b4;z-index:0}

/* ---------- paper swatches, one place, used by every SVG piece ---------- */
.f-cream {fill:#f3e5cb} .f-cream2{fill:#e5d2ae} .f-cream3{fill:#d3bb92}
.f-kraft {fill:#c89b66} .f-kraft2{fill:#b0824f} .f-kraft3{fill:#8f6641}
.f-brown {fill:#8a6142} .f-brown2{fill:#65442d} .f-ink  {fill:#3a2e28}
.f-red   {fill:#c05f48} .f-red2  {fill:#9b4736}
.f-blue  {fill:#7290ab} .f-blue2 {fill:#4d6c88} .f-blue3{fill:#37536d} .f-blue4{fill:#26394f}
.f-green {fill:#8ea364} .f-green2{fill:var(--gr2)} .f-green3{fill:var(--gr3)} .f-green4{fill:#2f4530}
.f-gold  {fill:#e0b256} .f-plum  {fill:#7c5f80} .f-teal {fill:#5d8a86}
.f-leaf  {fill:var(--leaf)}
.f-glass {fill:#cfe1e4} .f-screen{fill:#dfe9cf}
.f-slate {fill:#5b5f6b} .f-snow{fill:#eef1f2}

/* the offset paper shadow: solid, translated, never blurred */
.psh{fill:#4a3524;opacity:.2}
.psh-l{fill:#4a3524;opacity:.115}
/* the pale core a torn paper edge shows */
.core{fill:none;stroke:#fdf6e6;stroke-width:1.8;stroke-linecap:round;opacity:.6}

/* in world signage: the same two voices as the UI text */
.sgn{font-family:var(--display);font-weight:800;letter-spacing:-.012em}
.sgb{font-family:var(--body);font-weight:600;letter-spacing:.01em}

/* ---------- the stage that holds the whole diorama ----------
   The set is built at a fixed size, so past about 1920px the stage stops
   growing and stands centred on the paper backdrop, the same way the tall
   phone letterband works. Stretching it instead would push the camera
   past the opening scene before the reader had read a word. */
.stage{position:absolute;left:0;right:0;top:0;bottom:0;isolation:isolate;background:#b48557;overflow:hidden;z-index:1}
.diorama{position:absolute;inset:0;isolation:isolate}
.skyfill{position:absolute;inset:0;background:linear-gradient(180deg,
  var(--sky-a,#8fb6cf) 0%, var(--sky-a,#8fb6cf) 32%,
  var(--sky-b,#bcd6dd) 62%, var(--sky-c,#f0dcb8) 100%)}

/* deliberately NOT isolated: the back tint that lives inside it has to
   blend against the sky wash painted behind the world, or a multiply
   over transparent paper would come out as a flat slab of colour */
.world{position:absolute;inset:0}
.layer{position:absolute;inset:0;transform:translate3d(0,0,0)}
/* every sheet is scenery. A painted sheet is wider than the paper on it,
   so without this the topmost layer would sit over every pinned artifact
   and swallow the click that belongs to the link underneath. */
.sheetsvg{position:absolute;overflow:visible;pointer-events:none}
.scenegrp.off{display:none}
/* a far band belongs to its own stretch of world. When the camera leaves
   that stretch the band is faded out like a stagehand pulling a flat,
   instead of trailing behind the traveller for the rest of the story. */
.scenegrp.dim{opacity:0}
.world.tr .scenegrp{transition:opacity .34s linear}
html.rm .world.tr .scenegrp{transition:none}

/* light: warm lamp pools, radial gradients, each under a literal lamp */
.glows{position:absolute;inset:0;pointer-events:none}
.glow{position:absolute;border-radius:50%;pointer-events:none}
.g-night{opacity:calc(var(--night,0) * var(--str,.8))}
.g-day{opacity:calc((1 - var(--night,0)) * var(--str,.8))}
.g-any{opacity:var(--str,.8)}
/* "home" pools wait for the enter beat: warm only once somebody is
   in, and only as deep as the night is. The fade runs on CSS time,
   so the windows come on after the scroll loop has parked. */
.g-home{opacity:0;transition:opacity 1.6s ease .25s}
.home .g-home{opacity:calc(var(--night,0) * var(--str,.8))}
.rm .g-home{transition:none}
/* the going-to-bed play. Everything below waits for .home and runs on
   CSS clocks counted from the moment the family steps inside: the
   windows warm first, the chimney starts to breathe, two small heads
   climb into the upstairs pane and watch the night for a while, sink
   away to bed, the upstairs light goes out, and sleep letters drift
   up past the roof. Scrolling back strips .home and the whole evening
   rewinds to nothing. Reduced motion keeps the warm windows and skips
   the play entirely. */
.kidpeek,.babypeek{transform:translateY(42px)}
.home .kidpeek{animation:peek 4.6s cubic-bezier(.34,1.3,.4,1) 2.2s both}
.home .babypeek{animation:peek 4.2s cubic-bezier(.34,1.3,.4,1) 2.9s both}
@keyframes peek{0%{transform:translateY(42px)}14%{transform:translateY(0)}
  78%{transform:translateY(0)}100%{transform:translateY(42px)}}
.home .g-up{animation:lightout 1.6s ease 7.8s both}
@keyframes lightout{to{opacity:.07}}
.puff{opacity:0}
.home .puff{animation:puffup 5.4s linear 1.6s infinite}
.home .p2{animation-delay:3.4s}
.home .p3{animation-delay:5.2s}
@keyframes puffup{0%{opacity:0;transform:translateY(16px)}
  25%{opacity:.5}65%{opacity:.26}100%{opacity:0;transform:translateY(-26px)}}
.zz{opacity:0}
.home .zz{animation:zdrift 3.6s ease-in 9.4s infinite}
.home .z2{animation-delay:10.1s}
.home .z3{animation-delay:10.8s}
@keyframes zdrift{0%{opacity:0;transform:translateY(12px)}
  30%{opacity:.85}100%{opacity:0;transform:translateY(-26px)}}
.rm .kidpeek,.rm .babypeek,.rm .puff,.rm .zz,.rm .g-up{animation:none}

/* Night is TWO sheets, not one.

   A single tint over the whole diorama made dusk read as dusk, but it
   also put the man, his desk, his screen and every pinned clipping
   under the same blue as the hills three miles behind them. Paper does
   not work that way: at night the far country goes flat and cold while
   the thing under the lamp, in your hands, stays its own colour.

   So the deep tint (.tint-b) is mounted INSIDE the world, under the
   ground layer, and it darkens sky bands, far bands, mid and near only.
   The light tint (.tint) still covers everything -- but it is now weak,
   just enough to keep hero, ground, artifacts and foreground of a piece
   with the hour without draining them. The two multiply together over
   the background, which is why the far distance ends up exactly where
   it always was, and the key art ends up bright.

   The pair is chosen so that TINT_B x TINT / 255 == the single tint this
   set was lit by before. Change one and you must change the other. */
.tint{position:absolute;inset:0;mix-blend-mode:multiply;background:#fff;pointer-events:none}
.tint-b{position:absolute;inset:0;mix-blend-mode:multiply;background:#fff;pointer-events:none}

.sky-lights{position:absolute;inset:0;pointer-events:none}
.celestwrap{position:absolute;inset:0}
.celest{position:absolute;width:0;height:0}
#sunBox{left:74%;top:12%}
/* the disc is repainted as the light drops, so a low sun stays warm
   under the dusk tint instead of going grey in the corner */
#sun path{fill:var(--sunfill,#e2b355)}
#moonBox{left:19%;top:14%}
.celest svg,.celest .halo{position:absolute;overflow:visible}
.halo{border-radius:50%}
.stars{position:absolute;inset:0;opacity:var(--star-op,0)}

/* paper grain, one generated tile */
.grain{position:absolute;inset:0;mix-blend-mode:multiply;opacity:.4;
  background-image:var(--grain);background-size:150px 150px;pointer-events:none}

/* the proscenium: one cut paper sheet framing the set */
.frame{position:absolute;inset:0;pointer-events:none;overflow:visible}
.frame path{fill:#e2d2b4}
.frame .fsh{fill:#4a3524;opacity:.2}

/* ---------- hero puppet ----------
   Every joint group rotates around a pivot that sits INSIDE its own
   paper, and a joint disc is centred on that exact pivot, so no angle
   can pull a limb off the body. Arms and head ride inside the torso
   group; legs pivot on the same point the torso does. */
.heroWrap{position:absolute;left:0;top:0;width:0;height:0;overflow:visible;pointer-events:none}
.hero{position:absolute;overflow:visible;left:0;top:0}
.hero g{transform-box:view-box}
/* the picture house name, slid back along its own canopy when the stage
   is the narrow band a phone gets. The units are world units, because a
   transform on a node inside the sheet svg is read in the user space of
   that svg and every sheet is cut in world units. */
.lb .mqt{transform-box:view-box;transform:translateX(-215px)}
.hero .rig  {transform:translate(0,var(--by,0px)) rotate(var(--rr,0deg))}
.hero .torso{transform:rotate(var(--ta,0deg))}
.hero .head {transform:rotate(var(--ha,0deg))}
.hero .armB {transform:rotate(var(--a2,0deg))}
.hero .armF {transform:rotate(var(--a1,0deg))}
.hero .legB {transform:rotate(var(--l2,0deg))}
.hero .legF {transform:rotate(var(--l1,0deg))}
.hero .shB  {transform:rotate(var(--s2,0deg))}
.hero .shF  {transform:rotate(var(--s1,0deg))}
.hero .fArmB{transform:rotate(var(--e2,0deg))}
.hero .fArmF{transform:rotate(var(--e1,0deg))}
.hero{display:none;width:100%;height:100%}
.hero.on{display:block}
.hero.enter{animation:puppetIn .5s cubic-bezier(.22,1.1,.36,1) both}
.hero.leave{animation:puppetOut .3s cubic-bezier(.4,0,.9,.4) both}
/* the door shuts. gone holds the last frame of puppetOut, so the
   family that walked the whole road leaves the paper the way every
   puppet before them left it, and stays inside until the reader backs
   out of the doorway. Slower than leave: a doorstep, not an exit. The
   reduced-motion block kills the animation, so gone falls back to a
   plain opacity for that reader. */
.hero.gone{animation:puppetOut .55s cubic-bezier(.55,0,.8,.6) both}
.rm .hero.gone{opacity:0}
@keyframes puppetIn{
  0%{opacity:0;translate:0 -46px;rotate:-7deg}
  58%{opacity:1;translate:0 4px;rotate:2.5deg}
  100%{opacity:1;translate:0 0;rotate:0deg}
}
@keyframes puppetOut{
  0%{opacity:1;translate:0 0;rotate:0deg}
  100%{opacity:0;translate:0 30px;rotate:6deg}
}

/* ---------- ambient: ONE narrative cycle per scene ----------
   Nothing here is infinite. A cycle starts when its scene group goes
   live and it ends. Leaving and re-entering the scene plays it again,
   which is exactly one beat of stop motion per visit. */
.scenegrp.live .a-cloud {animation:railA 13s cubic-bezier(.33,0,.25,1) both}
.scenegrp.live .a-cloud2{animation:railB 17s cubic-bezier(.33,0,.25,1) both}
@keyframes railA{from{transform:translate(0,0) rotate(0deg)}to{transform:translate(52px,-7px) rotate(1.2deg)}}
@keyframes railB{from{transform:translate(0,0) rotate(.6deg)}to{transform:translate(-44px,6px) rotate(-.9deg)}}
/* the beige CRT wakes up once, then holds its steady glow */
.scenegrp.live .a-wake{animation:wake 2.6s steps(1,end) both}
@keyframes wake{0%{fill:#cfd6c4}22%{fill:#f2f4de}34%{fill:#d8ddc8}46%,100%{fill:#e7edd6}}
/* the modem handshakes once, then the line is up */
.scenegrp.live .a-led{animation:led 3.4s steps(1,end) both}
@keyframes led{0%{fill:#8d6a4e}18%{fill:#e2b256}30%{fill:#8d6a4e}42%{fill:#e2b256}54%{fill:#8d6a4e}66%,100%{fill:#c05f48}}
.scenegrp.live .a-crt{animation:crt 2.4s steps(1,end) both}
@keyframes crt{0%{fill:#b9c4a6}26%{fill:#eef3d8}44%,100%{fill:#dfe9cf}}
/* one wave set rocks in and settles */
.scenegrp.live .a-wave1{animation:waveA 11s cubic-bezier(.4,0,.3,1) both}
.scenegrp.live .a-wave2{animation:waveB 14s cubic-bezier(.4,0,.3,1) both}
@keyframes waveA{from{transform:translate(0,0)}to{transform:translate(26px,-3px)}}
@keyframes waveB{from{transform:translate(0,0)}to{transform:translate(-22px,3px)}}
/* the game cards: cut-paper homages that rise past the boy at the
   screen, one after another, and are gone. Three passes, then still --
   nothing on this street loops for ever. */
/* The step is a sixth of the cycle, so the two cards that share a column
   sit exactly half a cycle apart, and the visible window is cut to 44%
   of the cycle. Two cards in one column can therefore never be on the
   paper at the same instant, in any pass, and the column is only ever
   empty for a third of a second. */
.scenegrp.live .a-card{animation:cardPop 5.4s cubic-bezier(.34,0,.3,1) 3 both}
.scenegrp.live .a-card.d1{animation-delay:.9s}
.scenegrp.live .a-card.d2{animation-delay:1.8s}
.scenegrp.live .a-card.d3{animation-delay:2.7s}
.scenegrp.live .a-card.d4{animation-delay:3.6s}
.scenegrp.live .a-card.d5{animation-delay:4.5s}
/* translate only. A css rotate or scale on a plain svg group turns about
   the origin of the whole sheet, not the middle of the card, so the tilt
   is cut into the paper by the painter instead. */
@keyframes cardPop{
  0%  {opacity:0;transform:translate(0,30px)}
  4%  {opacity:0;transform:translate(0,26px)}
  11% {opacity:1;transform:translate(0,16px)}
  38% {opacity:1;transform:translate(0,-16px)}
  48% {opacity:0;transform:translate(0,-28px)}
  100%{opacity:0;transform:translate(0,-28px)}}
/* the tablet in the winter room lights up once */
.scenegrp.live .a-spark{animation:sparkUp 3.2s steps(1,end) both}
@keyframes sparkUp{0%{opacity:0}30%{opacity:.5}52%{opacity:1}100%{opacity:1}}
/* the elevated train pulls through once */
.scenegrp.live .a-train{animation:trainGo 9s cubic-bezier(.35,0,.3,1) both}
@keyframes trainGo{from{transform:translate(-190px,0)}to{transform:translate(210px,0)}}
/* stars: one shared shimmer pass, then steady */
.stars.live .a-tw{animation:tw 5.2s steps(1,end) both}
@keyframes tw{0%{opacity:.45}34%{opacity:1}52%{opacity:.6}70%,100%{opacity:1}}

/* ---------- UI: crisp, never pixelated, always above the tint ---------- */
.ui{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.ui a,.ui button{pointer-events:auto}

.skip{
  position:absolute;top:max(14px,env(safe-area-inset-top));right:max(22px,env(safe-area-inset-right));
  z-index:9;pointer-events:auto;
  display:inline-block;padding:9px 15px 10px;
  font-family:var(--body);font-size:14px;font-weight:650;text-decoration:none;color:#4a3524;
  background:#f3e5cb;rotate:-1.1deg;
  clip-path:polygon(1% 4%,26% 1%,58% 3%,84% 0%,100% 5%,99% 46%,100% 94%,72% 99%,38% 96%,12% 100%,0% 92%,1% 48%);
}
.skipsh{
  position:absolute;top:max(14px,env(safe-area-inset-top));right:max(22px,env(safe-area-inset-right));
  z-index:8;pointer-events:none;background:#4a3524;opacity:.26;rotate:-1.1deg;
  translate:5px 5px;padding:9px 15px 10px;font-family:var(--body);font-size:14px;font-weight:650;color:transparent;
  clip-path:polygon(1% 4%,26% 1%,58% 3%,84% 0%,100% 5%,99% 46%,100% 94%,72% 99%,38% 96%,12% 100%,0% 92%,1% 48%);
}
.skip:hover{background:#fbf1dc}
.skip:focus-visible,.plain:focus-visible,.sr a:focus,.ui a:focus-visible{outline:3px solid #2a3f57;outline-offset:3px}

/* =====================================================================
   THE SOUND TAG
   A second paper chip, cut from the same sheet as the skip tag and hung
   just under it. It is off when the page opens and it remembers nothing:
   the room is silent until somebody asks for it, every time.
   ===================================================================== */
.snd{
  position:absolute;top:calc(max(14px,env(safe-area-inset-top)) + 46px);
  right:max(22px,env(safe-area-inset-right));
  z-index:9;pointer-events:auto;
  display:inline-flex;align-items:center;gap:7px;min-height:44px;
  padding:9px 14px 10px 12px;
  font-family:var(--body);font-size:13px;font-weight:650;letter-spacing:.01em;
  color:#4a3524;background:none;border:0;cursor:pointer;rotate:1.2deg;
  -webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent;
}
.snd-sh,.snd-fc{position:absolute;inset:0;
  clip-path:polygon(1% 4%,26% 1%,58% 3%,84% 0%,100% 5%,99% 46%,100% 94%,72% 99%,38% 96%,12% 100%,0% 92%,1% 48%)}
.snd-sh{background:#4a3524;opacity:.26;translate:5px 5px}
.snd-fc{background:#f3e5cb}
.snd:hover .snd-fc{background:#fbf1dc}
.snd:focus-visible{outline:3px solid #2a3f57;outline-offset:3px}
.snd-ic{position:relative;width:18px;height:18px;flex:none;overflow:visible}
.snd-lb{position:relative}
.snd-cone{fill:currentColor}
.snd-w,.snd-cut{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}
.snd-w{opacity:0}
/* on: the cut closes up and the two arcs are let out */
.snd[aria-pressed="true"]{color:#93412f}
.snd[aria-pressed="true"] .snd-cut{opacity:0}
.snd[aria-pressed="true"] .snd-w{opacity:1}
/* the label is a luxury on a phone; the cut speaker says it all */
@media (max-width:560px){ .snd{padding:12px;gap:0} .snd-lb{display:none} }
/* nowhere to send the sound: take the tag away rather than hang a
   button that cannot do anything */
.snd.off{display:none}

.plain{
  position:absolute;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));
  z-index:9;pointer-events:auto;display:none;
  padding:9px 15px 10px;font-family:var(--body);font-size:14px;font-weight:650;color:#4a3524;text-decoration:none;
  background:#f3e5cb;rotate:.9deg;
  clip-path:polygon(1% 4%,26% 1%,58% 3%,84% 0%,100% 5%,99% 46%,100% 94%,72% 99%,38% 96%,12% 100%,0% 92%,1% 48%);
}
html.rm .plain{display:inline-block}

/* =====================================================================
   INTEGRAL TEXT
   A caption is not a card. It is a stack of torn paper strips blocked
   into the negative space of its own scene: a paper tag for the year,
   display letters cut onto one strip per line, and a wider strip for
   the body. Each strip carries its own solid offset cut shadow.
   ===================================================================== */
.capw{position:absolute;left:0;top:0;width:max-content;max-width:var(--mw,600px);
  opacity:0;visibility:hidden;translate:0 15px;rotate:var(--tilt,-1deg);
  transition:opacity .42s ease,translate .5s cubic-bezier(.2,.7,.3,1),visibility 0s linear .5s}
/* the closing card must not pop. It rises on a long slow drift while
   the family is still walking, so the last words arrive the way the
   evening does: gradually, and from a little further down. This rule
   sits BEFORE .capw.on so that .on can still zero the delays when the
   card shows: swap the order and the card hides through its whole
   fade, then snaps in, which is the pop again. */
.capw.slow{translate:0 34px;
  transition:opacity 1.6s ease,translate 1.9s cubic-bezier(.22,.61,.25,1),visibility 0s linear 1.9s}
.capw.on{opacity:1;visibility:visible;translate:0 0;transition-delay:0s,0s,0s}

.strip{position:relative;display:block;width:max-content;max-width:100%;rotate:var(--rot,0deg)}
.strip .sh{position:absolute;inset:0;background:#4a3524;opacity:.3;translate:6px 7px;clip-path:var(--tear)}
.strip .fc{position:relative;display:block;background:#f7ebd5;color:#2d231d;clip-path:var(--tear)}

/* The three sizes below are cut against the height of the window and not
   its width alone. The scene is drawn from the ground line up, and that
   line stands at 962 on a 1080-tall screen and at 696 on an 800-tall one:
   266px of sky and wall leave the frame while a width-only clamp keeps the
   words the same size, so the art climbs into the paper. The vh term holds
   the block to the same share of the picture at every height, and each one
   is set so that a 1080-tall screen still lands on the old maximum and
   nothing there moves. The lower bound is untouched: the phone band is
   narrow, not short, so it stays on the vw term. */

/* year / place plaque: a painted board nailed into the scene, cut and
   lettered like the shop signs, never a small interface tag. Two cream
   nail heads and a keyline are painted inside the torn silhouette. */
.cp{margin:0 0 13px 4px}
.cp .fc{font-family:var(--display);font-size:clamp(22px,min(2.35vw,3vh),32px);font-weight:800;
  letter-spacing:.055em;text-transform:uppercase;padding:9px 26px 12px;color:#fdf5e6;
  background:
    radial-gradient(circle at 13px 52%, #f0dcb8 0 2.4px, rgba(0,0,0,0) 2.7px),
    radial-gradient(circle at calc(100% - 13px) 52%, #f0dcb8 0 2.4px, rgba(0,0,0,0) 2.7px),
    #93412f;
  box-shadow:inset 0 0 0 3px #93412f, inset 0 0 0 5px #f0dcb8}
.cp .sh{opacity:.36}

/* display headline: one strip per line, hand placed.
   The size is a variable with the house clamp as its default, so a
   caption that has to hold a long sentence on ONE line can be cut
   smaller by hand without touching any other headline in the story. */
.hl{margin:0 0 7px}
.hl .fc{font-family:var(--display);font-weight:800;
  font-size:var(--hl-fs, clamp(30px,min(4.5vw,5.6vh),60px));line-height:1.02;letter-spacing:-.022em;
  padding:.2em .34em .26em;max-width:calc(100vw - 28px)}
.capw.big .hl .fc{font-size:var(--hl-fs, clamp(34px,6.4vw,86px))}
/* a headline set as one unbreakable line: it shrinks, it never wraps */
.hl.one .fc{white-space:nowrap}

/* the signature: a small scrap, hand-set, torn off the closing line */
.sig{margin:10px 0 0 26px}
.sig .fc{font-family:var(--display);font-weight:800;font-style:italic;
  font-size:clamp(21px,min(2.1vw,2.7vh),30px);letter-spacing:.01em;
  padding:.24em .6em .3em;color:#4a3524;background:#f3e5cb}
.capw.dark .sig .fc{background:#2b2839;color:#f4e8d0}

/* body: a wider strip, ruled like a note pad */
.bd{margin:12px 0 0 8px;width:var(--bw,520px);max-width:calc(100vw - 28px)}
.bd .fc{font-family:var(--body);font-size:clamp(18px,min(1.6vw,2.05vh),22px);line-height:1.5;
  font-weight:450;letter-spacing:-.004em;padding:17px 23px 20px;
  background:repeating-linear-gradient(180deg,rgba(70,105,140,0) 0 32px,rgba(70,105,140,.1) 32px 33px),#f7ebd5}
.bd .fc p{margin:0}
.bd .fc p + p{margin-top:.6em}

/* contact tags on the last strip */
.lnks{margin:16px 0 0 6px;display:flex;flex-wrap:wrap;gap:10px;max-width:calc(100vw - 28px)}
.lnk{position:relative;display:inline-block;rotate:var(--rot,0deg)}
.lnk .sh{position:absolute;inset:0;background:#4a3524;opacity:.3;translate:5px 6px;clip-path:var(--tear)}
.lnk a{position:relative;display:block;text-decoration:none;clip-path:var(--tear);
  font-family:var(--body);font-size:clamp(18px,1.3vw,20px);font-weight:650;
  padding:11px 18px 13px;background:#f3e5cb;color:#3a2e28}
.lnk a:hover{background:#fdf5e2}

/* night scenes flip the paper: dark stock, pale ink */
.capw.dark .strip .fc{background:#2b2839;color:#f4e8d0}
.capw.dark .bd .fc{background:repeating-linear-gradient(180deg,rgba(230,240,255,0) 0 32px,rgba(230,240,255,.09) 32px 33px),#2b2839}
.capw.dark .cp .fc{color:#2a2118;
  background:
    radial-gradient(circle at 13px 52%, #4a3524 0 2.4px, rgba(0,0,0,0) 2.7px),
    radial-gradient(circle at calc(100% - 13px) 52%, #4a3524 0 2.4px, rgba(0,0,0,0) 2.7px),
    #e0b256;
  box-shadow:inset 0 0 0 3px #e0b256, inset 0 0 0 5px #6b4a22}
.capw.dark .strip .sh{background:#120f1c;opacity:.42}

/* the title moment: same paper family, bigger scissors */
.titw .hl .fc{font-size:clamp(40px,8vw,104px);letter-spacing:-.035em;padding:.16em .3em .22em}
/* the opening is set like a title card: a small line in, the name cut
   large, then the promise. Three sizes, one block, no scroll needed. */
.titw .hl.t1 .fc{font-size:clamp(24px,3.5vw,45px);letter-spacing:-.012em}
.titw .hl.t2 .fc{font-size:clamp(56px,10.4vw,134px)}
.titw .hl.t3 .fc{font-size:clamp(23px,3.1vw,41px);letter-spacing:-.012em}
.titw .hl.t1{margin-left:10px}
.titw .hl.t3{margin:11px 0 0 16px}
.hint{margin:20px 0 0 6px;position:relative;display:inline-block;rotate:-.6deg}
.hint .sh{position:absolute;inset:0;background:#4a3524;opacity:.3;translate:5px 6px;clip-path:var(--tear)}
.hint .fc{position:relative;display:flex;align-items:center;gap:10px;clip-path:var(--tear);
  font-family:var(--body);font-size:15px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;
  padding:10px 17px 11px;background:#f3e5cb;color:#93412f}
.arrow{display:inline-block;width:11px;height:11px;border-right:2.6px solid #9b4736;border-bottom:2.6px solid #9b4736;
  rotate:45deg;translate:0 -2px}
/* three nudges and it stops. Nothing on this page loops for ever. */
.capw.on .arrow{animation:nudge 2.1s ease-in-out 3 both}
@keyframes nudge{0%,100%{translate:0 -2px}50%{translate:3px 1px}}

/* =====================================================================
   ARTIFACTS
   Real screens and real clippings, pinned into the set as objects: a
   torn cream mount, two strips of paper tape, and a small cut tag that
   says the thing opens somewhere else. Every one is a link. They are
   placed low in the frame, under the height any caption ever reaches.
   ===================================================================== */
.arts{position:absolute;inset:0;transform:translate3d(0,0,0)}
/* the lit sheets hang in front of the dusk wash, so this layer covers
   the whole box. It must stay transparent to the mouse or it would
   take the clicks meant for the clippings behind it. */
.arts.lit{pointer-events:none}
.art{position:absolute;display:block;text-decoration:none;color:inherit;
  cursor:pointer;rotate:var(--tilt,0deg);pointer-events:auto;
  transition:translate .2s cubic-bezier(.2,.7,.3,1)}
.art-sh{position:absolute;inset:0;background:#4a3524;opacity:.28;translate:7px 8px;
  clip-path:var(--tear)}
.art-fc{position:absolute;inset:0;background:#f7ebd5;clip-path:var(--tear);
  padding:var(--pad,8px);overflow:hidden}
.art-fc img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 0}
.art:hover{translate:0 -5px}
.art-leg{position:absolute;left:50%;top:100%;width:11px;height:var(--leg,0px);
  margin-left:-5px;background:#7a5c3c;
  clip-path:polygon(6% 0,94% 2%,88% 100%,14% 98%)}
.art-leg::after{content:"";position:absolute;inset:0;background:#4a3524;opacity:.2;
  translate:5px 4px;clip-path:polygon(6% 0,94% 2%,88% 100%,14% 98%)}
.art:focus-visible{outline:3px solid #2a3f57;outline-offset:4px}
/* a sheet that belongs to a later beat. It is cut out of the picture
   until the reader reaches the words that earn it, then it is pinned up
   on the same fade the captions use, so the two arrive as one move */
.art.late{opacity:0;visibility:hidden;
  transition:translate .2s cubic-bezier(.2,.7,.3,1),opacity .42s ease,visibility 0s linear .42s}
.art.late.up{opacity:1;visibility:visible;transition-delay:0s,0s,0s}

/* paper tape, torn at both ends */
.art-tape{position:absolute;width:30%;min-width:36px;height:16px;background:#efe3c6;opacity:.88}
.art-tape.t1{left:-6%;top:-8px;rotate:-8deg;clip-path:polygon(0% 14%,100% 0%,100% 86%,0% 100%)}
.art-tape.t2{right:-6%;bottom:-8px;rotate:-7deg;clip-path:polygon(0% 0%,100% 15%,100% 100%,0% 85%)}

/* the small cut tag: the words, then a drawn arrow, no glyph font */
.art-open{position:absolute;right:-7px;bottom:-14px;display:flex;align-items:center;gap:6px;
  padding:4px 10px 5px;background:#93412f;color:#fdf5e6;clip-path:var(--tear2);
  font-family:var(--body);font-size:var(--os,11px);font-weight:800;letter-spacing:.11em;
  text-transform:uppercase;white-space:nowrap}
.oa{display:inline-block;width:7px;height:7px;translate:0 1px;rotate:45deg;
  border-top:2.2px solid #fdf5e6;border-right:2.2px solid #fdf5e6}

/* a news clipping is typography, not a screenshot: masthead, rule, headline */
.art.clip .art-fc{background:#efe6d2;display:flex;flex-direction:column;
  padding:var(--pad,10px) calc(var(--pad,10px) + 2px)}
.cl-m{font-family:var(--body);font-size:var(--ms,11px);font-weight:800;letter-spacing:.15em;
  text-transform:uppercase;color:#93412f;border-bottom:2px solid #4a3524;
  padding-bottom:5px;margin-bottom:7px;white-space:nowrap;overflow:hidden}
.cl-h{font-family:var(--display);font-size:var(--fs,17px);line-height:1.13;font-weight:800;
  letter-spacing:-.016em;color:#241d19}

/* a prop is a drawn cutout, not a link: nothing to open, nothing to hover */
.art.prop{cursor:default;pointer-events:none}
.art.prop:hover{translate:0 0}
.art.prop .art-fc{padding:0;background:#f4e8d0}
.art.prop .art-fc svg{display:block;width:100%;height:100%}

/* a hero shot is the product itself, so it is never cropped: the whole
   frame is shown, on a paper mat cut to the same aspect */
.art.shot .art-fc{background:#e7d9ba;padding:var(--pad,9px)}
.art.shot .art-fc img{object-fit:contain;object-position:50% 50%}

/* the trailer: the film's own still behind a cut play tab. The window is
   cut to the still's own 16:9, so the picture is shown whole and at full
   strength, the way any player shows it before the press. The frame is
   only ever built on a click, so no player loads until the reader asks. */
.art.video .art-fc{padding:0;background:#171326}
.art.video .art-fc img{object-fit:cover;object-position:50% 50%}
.art.video iframe{display:block;width:100%;height:100%;border:0}
.art-play{position:absolute;left:50%;top:50%;translate:-50% -50%;
  display:flex;align-items:center;justify-content:center;
  width:26%;min-width:64px;aspect-ratio:1.42;background:#f3e5cb;clip-path:var(--tear2)}
.art-play i{width:0;height:0;translate:12% 0;
  border-left:1.6em solid #93412f;border-top:1.05em solid transparent;
  border-bottom:1.05em solid transparent;font-size:min(2.2vw,15px)}
.art.video:hover .art-play{background:#fdf5e6}

/* screen reader story: the whole arc, independent of scroll */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.sr a:focus{position:fixed;left:12px;top:64px;width:auto;height:auto;clip-path:none;
  padding:9px 13px;background:#f3e5cb;z-index:20}

.nojs{position:fixed;z-index:40;;left:0;right:0;top:0;padding:14px 18px;background:#f3e5cb;color:#3a2e28;
  font-size:16px;z-index:30;text-align:center}
#metrics{display:none}

/* ---------- reduced motion: no lerp, no gait, no ambient ---------- */
@media (prefers-reduced-motion:reduce){
  .stage *,.ui *{animation:none !important;transition:none !important}
  .capw{opacity:1;visibility:visible;translate:0 0}
  .arrow{animation:none}
}
/* the first painted frame never dissolves: on load, and on a deep link,
   the picture and the opening words are simply there */
html.boot .capw,html.boot .strip,html.boot .scenegrp{transition:none !important}
html.boot .capw.on .arrow{animation:none}
html.rm .stage *,html.rm .ui *{animation:none !important;transition:none !important}
html.rm .capw{transition:none}

/* how far along the walk is: a hairline of brick red laid on the top
   edge of the paper. It says nothing until the title is left behind,
   and it never asks to be touched. */
.prog{
  position:absolute;z-index:34;top:0;left:0;height:5px;width:0%;
  background:rgba(155,71,54,.65);
  opacity:0;transition:opacity .6s ease;
  pointer-events:none;
}
.prog.on{opacity:1}

@media (max-width:700px){
  .capw{--mw:calc(100vw - 22px)}
  .bd{margin-left:4px}
  .bd .fc{padding:15px 18px 17px}
  .hl .fc{padding:.2em .3em .26em}
  .skip,.skipsh,.plain{font-size:13px;padding:8px 13px 9px}
}
</style>
</head>

<div class="scroll" id="scroll" tabindex="0">
<div class="sticky">

  <span class="skipsh" aria-hidden="true">Skip to the end</span>
  <a class="skip" href="classic.html">Skip to the end</a>
  <a class="plain" href="classic.html">Prefer the plain page?</a>

  <button class="snd" id="sndTag" type="button" aria-pressed="false" aria-label="Ambient sound">
    <span class="snd-sh" aria-hidden="true"></span>
    <span class="snd-fc" aria-hidden="true"></span>
    <svg class="snd-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path class="snd-cone" d="M4 9.5h3.6L12.4 5.4c.5-.4 1.3-.1 1.3.6v12c0 .7-.8 1-1.3.6L7.6 14.5H4c-.6 0-1-.4-1-1v-3c0-.6.4-1 1-1z"/>
      <path class="snd-w" d="M16.6 9.2c1.1 1.5 1.1 4.1 0 5.6"/>
      <path class="snd-w" d="M19.1 6.9c2.2 2.8 2.2 7.4 0 10.2"/>

  <div class="stage" id="stage" aria-hidden="true">
    <div class="diorama">
      <div class="skyfill" id="skyfill"></div>
      <!-- sun, moon and stars are pinned to the back of the box, behind
           every sheet of paper, so a roofline or a shop sign passes in
           FRONT of them the way it would in a real cut paper set. -->
      <div class="sky-lights" id="skyLights">
        <div class="stars" id="starHost"></div>
        <div class="celestwrap" id="celestWrap">
          <div class="celest" id="sunBox"></div>
          <div class="celest" id="moonBox"></div>
        </div>
      </div>
      <div class="world" id="world"></div>
      <div class="tint" id="tint"></div>
      <div class="glows layer" id="glowLayer"></div>
    </div>

  </div>

  <div class="ui" id="ui" aria-hidden="true"></div>

</div>

<script>
(function(){
"use strict";

/* =================================================================
   0. PAPER TOOLKIT
   Deterministic hand cut edges: polygon vertices jittered along the
   edge normal, seeded, so every reload cuts the paper the same way.
   ================================================================= */

var TAU = Math.PI * 2;
function rng(seed){ var a = seed >>> 0; return function(){
  a = a + 0x6D2B79F5 | 0;
  var t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
};}
function f(n){ return Math.round(n * 10) / 10; }
function lerp(a,b,t){ return a + (b - a) * t; }
function clamp(v,a,b){ return v < a ? a : v > b ? b : v; }
function smooth(a,b,v){ var t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }

function cut(pts, amp, seed, maxSeg){
  var r = rng(seed), d = "", i, k;
  maxSeg = maxSeg || 30;
  for(i = 0; i < pts.length; i++){
    var a = pts[i], b = pts[(i + 1) % pts.length];
    var dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
    var nx = -dy / len, ny = dx / len;
    var n = Math.max(1, Math.min(maxSeg, Math.round(len / 26)));
    if(i === 0) d += "M" + f(a[0]) + " " + f(a[1]);
    for(k = 1; k <= n; k++){
      var t = k / n;
      var j = (k === n) ? (r() - 0.5) * amp * 0.7 : (r() - 0.5) * 2 * amp;
      d += "L" + f(a[0] + dx * t + nx * j) + " " + f(a[1] + dy * t + ny * j);
    }
  }
  return d + "Z";
}
function rectPts(x,y,w,h){ return [[x,y],[x+w,y],[x+w,y+h],[x,y+h]]; }
function cutRect(x,y,w,h,amp,seed,maxSeg){ return cut(rectPts(x,y,w,h), amp, seed, maxSeg); }
function cutDisc(cx,cy,rad,amp,seed,n){
  var r = rng(seed), pts = [], i; n = n || 16;
  for(i = 0; i < n; i++){
    var a = i / n * TAU, rr = rad + (r() - 0.5) * 2 * amp;
    pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
  }
  return cut(pts, amp * 0.3, seed + 7, 1);
}
function cutLine(x1,y1,x2,y2,amp,seed,step){
  var r = rng(seed), dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx,dy) || 1;
  var nx = -dy/len, ny = dx/len, n = Math.max(2, Math.min(300, Math.round(len/(step||24))));
  var d = "M" + f(x1) + " " + f(y1), k;
  for(k = 1; k <= n; k++){
    var t = k/n, j = (r() - 0.5) * 2 * amp;
    d += "L" + f(x1 + dx*t + nx*j) + " " + f(y1 + dy*t + ny*j);
  }
  return d;
}
/* a stack of paths in one paper colour sharing ONE offset shadow */
function sheet(ds, cls, sx, sy, shCls){
  var s = "", i;
  if(sx || sy){
    var g = "";
    for(i = 0; i < ds.length; i++) g += '<path d="' + ds[i] + '"/>';
    s += '<g class="' + (shCls || "psh") + '" transform="translate(' + sx + ',' + sy + ')">' + g + "</g>";
  }
  for(i = 0; i < ds.length; i++) s += '<path class="' + cls + '" d="' + ds[i] + '"/>';
  return s;
}
function one(d, cls, sx, sy, shCls){ return sheet([d], cls, sx, sy, shCls); }

/* world signage. Two flat passes: a dark offset copy, then the face. */
function label(x, y, str, size, fam, fill, anchor){
  var c = 'text-anchor="' + (anchor || "middle") + '" font-size="' + size + '" class="' + (fam || "sgn") + '"';
  return '<text x="' + f(x + size * 0.05) + '" y="' + f(y + size * 0.07) + '" ' + c +
      ' fill="#3b2a1e" opacity=".33">' + str + "</text>" +
    '<text x="' + f(x) + '" y="' + f(y) + '" ' + c + ' fill="' + fill + '">' + str + "</text>";
}

/* torn edges for the HTML strips, as clip-path polygons */
function tearPoly(seed, ax, ay){
  var r = rng(seed), p = [], n, N = 9;
  for(n = 0; n <= N; n++) p.push([(n / N) * 100, r() * ay]);
  for(n = 1; n <= 3; n++) p.push([100 - r() * ax, (n / 4) * 100]);
  for(n = N; n >= 0; n--) p.push([(n / N) * 100, 100 - r() * ay]);
  for(n = 3; n >= 1; n--) p.push([r() * ax, (n / 4) * 100]);
  var s = [], i;
  for(i = 0; i < p.length; i++) s.push(f(p[i][0]) + "% " + f(p[i][1]) + "%");
  return "polygon(" + s.join(",") + ")";
}
var TEARS = [], ti;
for(ti = 0; ti < 8; ti++) TEARS.push(tearPoly(3100 + ti * 13, 1.5, 4.6));
var TEARS_S = [];
for(ti = 0; ti < 6; ti++) TEARS_S.push(tearPoly(3400 + ti * 17, 2.6, 9));

/* =================================================================
   PROPS
   Drawn paper keepsakes for the scenes that have no press. Each one
   is cut from the same palette as the world and is authored inside
   its own record sized viewBox, so the artifact chassis carries it
   with no extra rules. A prop says nothing the story has not said.
   ================================================================= */
var PROPS = {};

/* a six year old draws the machine that just arrived. Wax lines, no ruler */
PROPS.crayon = function(w, h){
  var o = "", st = function(d, col, sw){
    return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + f(sw) +
      '" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>';
  };
  /* sun, top right, with a fistful of rays */
  o += one(cutDisc(w * 0.85, h * 0.15, w * 0.075, 0.9, 4101, 13), "f-gold");
  var a, cx = w * 0.85, cy = h * 0.15, r0 = w * 0.105, r1 = w * 0.155;
  for(a = 0; a < 7; a++){
    var t = (a / 7) * Math.PI * 2 + 0.3;
    o += st("M" + f(cx + Math.cos(t) * r0) + " " + f(cy + Math.sin(t) * r0) +
      "L" + f(cx + Math.cos(t) * r1) + " " + f(cy + Math.sin(t) * r1), "#e0b256", w * 0.022);
  }
  /* the monitor, a happy box */
  o += st(cut(rectPts(w * 0.15, h * 0.22, w * 0.52, h * 0.38), 1.6, 4103, 9), "#4d6c88", w * 0.032);
  o += st(cut(rectPts(w * 0.22, h * 0.29, w * 0.38, h * 0.24), 1.1, 4105, 9), "#8ea364", w * 0.02);
  o += one(cutDisc(w * 0.31, h * 0.38, w * 0.022, 0.4, 4107, 9), "f-ink");
  o += one(cutDisc(w * 0.49, h * 0.38, w * 0.022, 0.4, 4109, 9), "f-ink");
  o += st("M" + f(w * 0.29) + " " + f(h * 0.45) + "Q" + f(w * 0.40) + " " + f(h * 0.53) +
    " " + f(w * 0.51) + " " + f(h * 0.45), "#c05f48", w * 0.026);
  /* stand and keyboard */
  o += st(cutLine(w * 0.41, h * 0.60, w * 0.41, h * 0.68, 0.7, 4111, 9), "#4d6c88", w * 0.028);
  o += st(cutLine(w * 0.30, h * 0.69, w * 0.52, h * 0.69, 0.7, 4113, 9), "#4d6c88", w * 0.028);
  o += st(cut(rectPts(w * 0.20, h * 0.75, w * 0.44, h * 0.10), 1.1, 4115, 9), "#4d6c88", w * 0.026);
  /* the floor of the room, and two scribbles that mean nothing at all */
  o += st(cutLine(w * 0.07, h * 0.92, w * 0.93, h * 0.92, 1.1, 4117, 14), "#8ea364", w * 0.026);
  o += st(cutLine(w * 0.72, h * 0.62, w * 0.86, h * 0.55, 1.4, 4119, 9), "#c05f48", w * 0.02);
  o += st(cutLine(w * 0.74, h * 0.72, w * 0.90, h * 0.70, 1.4, 4121, 9), "#7c5f80", w * 0.02);
  return o;
};

/* the bedroom wall poster of a teenage server that got to the top. the sheet
   is cream, not red, because this beat runs at night and a dark poster on a
   dark wall reads as a smudge. */
PROPS.gposter = function(w, h){
  var o = '<rect x="-2" y="-2" width="' + f(w + 4) + '" height="' + f(h + 4) + '" class="f-cream"/>';
  o += one(cutRect(0, 0, w, h * 0.19, 1.1, 4201), "f-red2");

/* =================================================================
   2. TIMELINE  -- the data shape, written before the engine.

   Each record owns:
     id, span    world units this scene occupies
     season      spring | summer | fall | winter, blended between scenes
     light       [[t, L], ...] keyframes across the span, L in 0..1
                 L = 1 full day, 0.5 dusk, 0 deep night
     indoor      [[from, to], ...] scene ranges under a roof, so the
                 sun, moon and stars fade out
     layers      { sky|far|mid|near|ground|fg: [piece, ...] }
                 piece = { t: painterName, x, ...args }, x scene relative.
                 band:{from,to} is scene relative and anchors a backdrop
                 across that world range at its own parallax depth.
                 from/to on a ground piece are SCENE RELATIVE too, so a
                 reorder of the list can never leave a hole in the road.
                 to:"END" means "as far as the world goes", for
                 set pieces that must span scenes (the cardboard base,
                 the walking surface, the ocean).
     glows       [{ x, y, r, c, str, when, cls }] lamp pools, each under
                 a lamp. when: night|day|any|home -- home pools light
                 only once an enter beat has put the family indoors.
                 cls adds an extra class (g-up is the upstairs window,
                 so the bedtime play can turn that one light out)
     rate        [[from, to, mult, ease], ...] the scroll rate map.
                 mult > 1 holds the camera (the two computer dwells, the
                 capstone); mult < 1 speeds transit up (the flight, the
                 walks between buildings). ease is the ramp width in
                 world units so a hold arrives and leaves smoothly.
     caps        [{ x, chip, head, body, col, row, ... }] captions, each
                 anchored in the world and blocked into a screen region.
                 slow true swaps the reveal for a long drift (the
                 closing card, which must not pop)
     arts        [{ x, y, w, h, kind, src|mast+head, href, tilt }]
                 real prints and news clippings pinned into the set,
                 world units, each one a link that opens in a new tab
     hero        [{ x, form, gait, seat, pal, enter }] beat list, scene
                 relative
                 form: none|baby|child|teen|adult|parent|family
                 gait: toddle|walk|sit|play|idle
                 seat {x} parks the puppet at a world point so it can
                 reach the chair before the camera pins the desk. A
                 run of beats stepping seat.x forward in small jumps
                 walks the puppet in stride with the scroll instead of
                 one long sprint (the end scene's approach to the door)
                 pal true walks the second figure alongside
                 enter true sends the puppet through the door it is
                 seated at: arrive, step in, gone until scrolled back

   Adding a scene is a data only edit: push a record, nothing else.
   ================================================================= */

/* =================================================================
   3. PIECE PAINTERS
   Every painter takes one piece record with x already resolved into
   its own layer's coordinates, and returns SVG markup. Paper rules:
   solid offset shadows only, never a blur; anything that must line up
   with the puppet (seat, desk top, screen base) is a parameter, never
   a constant, so a chair can never float away from a hip.
   ================================================================= */

var P = {};

/* --- ground, land, sky --------------------------------------------- */

P.base = function(p){
  var x = p.x, w = p.w, top = FLOOR + 28, i;
  var out = one(cut([[x, top],[x + w, top],[x + w, WORLDH + 90],[x, WORLDH + 90]], 3, p.seed, 300), "f-kraft2", 0, 0);
  out += one(cut([[x, top + 26],[x + w, top + 24],[x + w, WORLDH + 90],[x, WORLDH + 90]], 2.6, p.seed + 1, 300), "f-kraft3", 0, 0);
  out += '<path class="core" d="' + cutLine(x, top + 6, x + w, top + 5, 2.2, p.seed + 2, 30) + '"/>';
  var fl = "";
  for(i = 0; i < Math.floor(w / 34); i++){
    fl += '<path d="' + cutRect(x + 8 + i * 34, top + 32, 16, 12, 1.1, p.seed + 40 + i, 3) + '"/>';
  }
  out += '<g class="f-kraft" style="opacity:.3">' + fl + "</g>";
  return out;
};

P.surface = function(p){
  var x = p.x, w = p.w, r = rng(p.seed), i, out = "";
  if(p.kind === "grass"){
    var pts = [[x, FLOOR + 28]], cx = x;
    while(cx < x + w){
      var st = 34 + r() * 30;
      pts.push([cx + st * 0.5, FLOOR - 7 - r() * 10], [cx + st, FLOOR + 3 + r() * 5]);
      cx += st;
    }
    pts.push([x + w, FLOOR + 34]);
    out += one(cut(pts, 1.8, p.seed + 1, 3), "f-green2", 0, 6, "psh-l");
    out += one(cut([[x, FLOOR + 14],[x + w, FLOOR + 12],[x + w, FLOOR + 34],[x, FLOOR + 36]], 2, p.seed + 2, 200), "f-green3", 0, 0);
  } else if(p.kind === "snow"){
    var sp = [[x, FLOOR + 30]], sx = x;
    while(sx < x + w){
      var ss = 90 + r() * 70;
      sp.push([sx + ss * 0.5, FLOOR - 10 - r() * 7], [sx + ss, FLOOR - 2 + r() * 6]);
      sx += ss;
    }
    sp.push([x + w, FLOOR + 34]);
    out += one(cut(sp, 2, p.seed + 1, 4), "f-snow", 0, 7, "psh-l");
    out += one(cut([[x, FLOOR + 16],[x + w, FLOOR + 14],[x + w, FLOOR + 34],[x, FLOOR + 36]], 2, p.seed + 2, 200), "f-glass", 0, 0);
  } else {
    out += one(cut([[x, FLOOR - 4],[x + w, FLOOR - 6],[x + w, FLOOR + 32],[x, FLOOR + 34]], 2.4, p.seed + 1, 200), "f-cream3", 0, 6, "psh-l");
    var ds = "";
    for(i = 0; i < Math.floor(w / 130); i++){
      ds += '<path d="' + cutRect(x + 34 + i * 130, FLOOR + 8, 58, 5, 1, p.seed + 20 + i) + '"/>';
    }
    out += '<g class="f-kraft3" style="opacity:.4">' + ds + "</g>";
  }
  return out;
};

P.grassrow = function(p){
  var r = rng(p.seed), i, ds = [];
  for(i = 0; i < p.n; i++){
    var x = p.x + (i + r() * 0.7) * (p.w / p.n);
    var h = 15 + r() * 20;
    ds.push(cut([[x, FLOOR + 8],[x + 3, FLOOR - h],[x + 9, FLOOR - h * 0.55],[x + 13, FLOOR + 8]], 1.1, p.seed + i));
  }
  return sheet(ds, "f-green3", 3, 3);
};

P.blade = function(p){
  var h = p.h, x = p.x, bot = FLOOR + 120;
  var a = cut([[x, bot],[x - 7, FLOOR - h * 0.5],[x + 10, FLOOR - h],[x + 24, FLOOR - h * 0.42],[x + 26, bot]], 2.2, p.seed, 10);
  var b = cut([[x + 18, bot],[x + 28, FLOOR - h * 0.62],[x + 46, FLOOR - h * 0.24],[x + 43, bot]], 2.0, p.seed + 1, 8);
  var c = cut([[x - 22, bot],[x - 26, FLOOR - h * 0.3],[x - 8, FLOOR - h * 0.54],[x - 2, bot]], 1.8, p.seed + 2, 8);
  return sheet([c, b], "f-green4", 8, 6) + sheet([a], "f-green3", 8, 6);
};

P.hill = function(p){
  var x = p.x, w = p.w, top = p.top, base = FLOOR + 200;
  var pts = [[x, base],[x, top + 70],[x + w * 0.16, top + 26],[x + w * 0.34, top + 4],
             [x + w * 0.5, top + 30],[x + w * 0.66, top],[x + w * 0.84, top + 34],
             [x + w, top + 58],[x + w, base]];
  return one(cut(pts, 3.4, p.seed, 26), p.fill, 8, 9, "psh-l");
};

P.treeline = function(p){
  var r = rng(p.seed), pts = [[p.x, FLOOR + 130],[p.x, p.top + 34]], x = p.x;
  while(x < p.x + p.w){
    var step = 46 + r() * 46, hgt = p.top + r() * 42;
    pts.push([x + step * 0.22, hgt + 22], [x + step * 0.5, hgt], [x + step * 0.74, hgt + 16],
             [x + step, hgt + 30 + r() * 20]);
    x += step;
  }
  pts.push([p.x + p.w, FLOOR + 130]);
  return one(cut(pts, 2.2, p.seed + 1, 3), "f-green3", 6, 7, "psh-l");
};

P.rooftops = function(p){
  var r = rng(p.seed), x = p.x, ds = [];
  while(x < p.x + p.w){
    var bw = 54 + r() * 66, bh = 58 + r() * 64;
    ds.push(cutRect(x, FLOOR - bh, bw, bh + 150, 2.0, p.seed + Math.round(x), 14));
    ds.push(cut([[x - 9, FLOOR - bh + 5],[x + bw * 0.5, FLOOR - bh - 27 - r() * 18],[x + bw + 9, FLOOR - bh + 5]], 1.8, p.seed + 3 + Math.round(x), 10));
    x += bw + 10 + r() * 24;
  }
  return sheet(ds, "f-blue3", 7, 8, "psh-l");
};

P.tree = function(p){
  var s = p.s || 1, h = p.h * s, x = p.x, base = FLOOR + 10;
  var trunk = cut([[x - 8 * s, base],[x - 5 * s, base - h * 0.72],[x + 5 * s, base - h * 0.72],[x + 8 * s, base]], 1.6, p.seed);
  var c1 = cutDisc(x, base - h * 0.84, 31 * s, 2.6, p.seed + 1, 15);
  var c2 = cutDisc(x - 23 * s, base - h * 0.67, 21 * s, 2.2, p.seed + 2, 13);
  var c3 = cutDisc(x + 22 * s, base - h * 0.70, 23 * s, 2.2, p.seed + 3, 13);
  return one(trunk, "f-brown", 4, 4) + sheet([c2, c3, c1], "f-leaf", 6, 7);
};

P.bush = function(p){
  var s = p.s || 1, x = p.x, base = FLOOR + 8;
  var a = cutDisc(x, base - 23 * s, 25 * s, 2.4, p.seed, 14);
  var b = cutDisc(x - 20 * s, base - 13 * s, 17 * s, 2.0, p.seed + 1, 12);
  var c = cutDisc(x + 20 * s, base - 15 * s, 19 * s, 2.0, p.seed + 2, 12);
  return sheet([b, c, a], "f-green2", 5, 6);
};

P.leafpile = function(p){
  var x = p.x, r = rng(p.seed), i, ds = [];
  for(i = 0; i < 9; i++){
    ds.push(cutDisc(x + r() * 76, FLOOR + 6 - r() * 15, 8 + r() * 6, 1.4, p.seed + i, 8));
  }
  return sheet(ds, "f-leaf", 3, 4);
};

P.fence = function(p){
  var i, ds = [], n = Math.round(p.w / 34);
  for(i = 0; i <= n; i++){
    var x = p.x + i * 34;
    ds.push(cut([[x, FLOOR + 8],[x + 3, FLOOR - 62],[x + 8, FLOOR - 68],[x + 13, FLOOR - 62],[x + 16, FLOOR + 8]], 1.3, p.seed + i));

};

P.mailbox = function(p){

  out += one(cut([[x + 5, FLOOR + 6],[x + 8, FLOOR - 74],[x + 14, FLOOR - 74],[x + 17, FLOOR + 6]], 1.2, p.seed), "f-brown", 3, 4);
  /* the lid curves over the top corner, so the shape reads as a mailbox

P.cloud = function(p){

P.bench = function(p){

/* the four of them out in the snow. This is the only place in the road
   where the family is not walking: they have stopped, and the second
   child is the reason. It is one wide tableau rather than four separate
   props so the spacing between the figures, and who stands in front of
   whom, can never drift apart. It is cut to sit inside 270 units, which
   is what a phone can hold in frame at this beat. */
P.snowplay = function(p){
  var x = p.x, base = FLOOR + 4, s = p.seed, out = "";

  /* --- the snowman, off to the left ------------------------------- */
  var mx = x + 20;
  out += one(cutDisc(mx, base - 26, 25, 1.8, s + 1, 16), "f-snow", 5, 6);
  out += one(cutDisc(mx, base - 62, 18.5, 1.6, s + 2, 14), "f-snow", 4, 5);
  out += '<g stroke="#6b4a34" stroke-width="3.4" fill="none" stroke-linecap="round"><path d="' +
    cutLine(mx - 16, base - 64, mx - 36, base - 80, 1.2, s + 3, 8) + '"/><path d="' +
    cutLine(mx + 16, base - 64, mx + 35, base - 76, 1.2, s + 4, 8) + '"/></g>';
  out += one(cutDisc(mx, base - 88, 13, 1.4, s + 5, 12), "f-snow", 3, 4);
  out += one(cut([[mx - 15, base - 76],[mx + 15, base - 78],[mx + 16, base - 71],[mx - 14, base - 69]], 1.1, s + 6, 5), "f-red2", 3, 3);
  out += one(cut([[mx + 9, base - 74],[mx + 16, base - 74],[mx + 13, base - 58],[mx + 7, base - 59]], 1, s + 7, 4), "f-red2", 2, 2);
  out += '<g class="f-ink"><path d="' + cutDisc(mx - 4, base - 91, 2.3, 0.5, s + 8, 8) + '"/>' +
    '<path d="' + cutDisc(mx + 5, base - 91, 2.3, 0.5, s + 9, 8) + '"/></g>';
  out += one(cut([[mx + 11, base - 88],[mx + 24, base - 86],[mx + 11, base - 83]], 1, s + 10, 4), "f-gold", 0, 0);
  out += one(cutRect(mx - 13, base - 105, 26, 7, 1.1, s + 11, 6), "f-brown2", 3, 3);
  out += one(cutRect(mx - 9, base - 116, 18, 12, 1.1, s + 12, 6), "f-brown2", 2, 2);

  /* --- a pail and a spade left in the snow ------------------------- */
  out += one(cut([[x + 40, base - 20],[x + 60, base - 20],[x + 57, base - 3],[x + 43, base - 3]], 1.2, s + 90, 6), "f-blue3", 3, 4);
  out += '<g stroke="#6b4a34" stroke-width="3" fill="none" stroke-linecap="round"><path d="' +
    cutLine(x + 52, base - 22, x + 44, base - 48, 1.2, s + 91, 8) + '"/></g>';
  out += one(cut([[x + 37, base - 52],[x + 52, base - 50],[x + 50, base - 42],[x + 38, base - 44]], 1, s + 92, 4), "f-gold", 2, 2);

  /* --- the father, standing, a snowball in the raised hand ---------- */
  var fx = x + 80;
  out += one(cutRect(fx - 13, base - 54, 11, 54, 1.2, s + 40, 8), "f-blue4", 4, 5);
  out += one(cutRect(fx + 3, base - 54, 11, 54, 1.2, s + 41, 8), "f-blue4", 3, 4);
  out += '<g class="f-ink"><path d="' + cutRect(fx - 16, base - 9, 16, 9, 1, s + 42, 5) + '"/>' +
    '<path d="' + cutRect(fx + 2, base - 9, 16, 9, 1, s + 43, 5) + '"/></g>';
  out += one(cut([[fx - 20, base - 48],[fx - 17, base - 98],[fx + 17, base - 98],[fx + 20, base - 48]], 1.7, s + 44, 8), "f-red", 5, 6);
  out += one(cut([[fx + 14, base - 94],[fx + 36, base - 108],[fx + 40, base - 101],[fx + 18, base - 86]], 1.4, s + 45, 6), "f-red", 3, 3);
  out += one(cut([[fx - 15, base - 92],[fx - 27, base - 68],[fx - 21, base - 65],[fx - 10, base - 87]], 1.4, s + 46, 6), "f-red", 3, 3);
  out += '<g class="f-kraft"><path d="' + cutDisc(fx + 42, base - 105, 5.6, 0.8, s + 47, 9) + '"/>' +
    '<path d="' + cutDisc(fx - 23, base - 61, 5.6, 0.8, s + 48, 9) + '"/>' +
    '<path d="' + cutDisc(fx + 1, base - 112, 13, 1.4, s + 49, 13) + '"/></g>';
  out += one(cutDisc(fx + 50, base - 112, 7, 0.9, s + 50, 10), "f-snow", 2, 2);
  out += '<g class="f-ink"><path d="' + cutDisc(fx + 5, base - 113, 2.3, 0.5, s + 51, 8) + '"/>' +
    '<path d="' + cutDisc(fx - 4, base - 113, 2.3, 0.5, s + 52, 8) + '"/></g>';
  out += one(cut([[fx - 14, base - 112],[fx - 11, base - 125],[fx + 6, base - 127],[fx + 14, base - 116],
                  [fx + 4, base - 119],[fx - 7, base - 117]], 1.4, s + 53, 7), "f-ink", 0, 0);

  /* --- the mother, kneeling behind the sled ------------------------ */
  var wx = x + 186;
  out += one(cut([[wx - 27, base],[wx + 21, base],[wx + 17, base - 36],[wx - 23, base - 33]], 1.8, s + 20, 8), "f-blue4", 5, 6);
  out += '<g class="f-brown2"><path d="' + cut([[wx + 10, base - 104],[wx - 17, base - 100],
    [wx - 24, base - 78],[wx - 21, base - 54],[wx - 6, base - 56],[wx + 4, base - 82]], 1.6, s + 21, 8) + '"/></g>';
  out += one(cut([[wx - 21, base - 30],[wx - 17, base - 80],[wx + 15, base - 80],[wx + 19, base - 30]], 1.7, s + 22, 8), "f-plum", 4, 5);
  out += '<g class="f-kraft"><path d="' + cutDisc(wx - 2, base - 92, 13, 1.4, s + 25, 13) + '"/></g>';
  out += '<g class="f-ink"><path d="' + cutDisc(wx - 8, base - 93, 2.3, 0.5, s + 26, 8) + '"/>' +
    '<path d="' + cutDisc(wx + 1, base - 94, 2.3, 0.5, s + 27, 8) + '"/></g>';
  out += one(cut([[wx - 15, base - 92],[wx - 12, base - 104],[wx + 4, base - 106],[wx + 11, base - 96],
                  [wx + 2, base - 99],[wx - 8, base - 97]], 1.4, s + 28, 7), "f-brown2", 0, 0);

  /* --- the sled, with the youngest sitting in it -------------------- */
  var sx = x + 142;
  out += '<g stroke="#6b4a34" stroke-width="2.6" fill="none" stroke-linecap="round"><path d="' +
    cutLine(sx - 30, base - 20, fx - 25, base - 59, 1.6, s + 60, 16) + '"/></g>';
  out += one(cut([[sx - 14, base - 26],[sx - 11, base - 54],[sx + 11, base - 54],[sx + 14, base - 26]], 1.4, s + 61, 7), "f-gold", 4, 5);
  out += one(cut([[sx - 12, base - 50],[sx - 26, base - 40],[sx - 28, base - 33],[sx - 11, base - 42]], 1.2, s + 62, 5), "f-gold", 2, 2);
  out += '<g class="f-kraft"><path d="' + cutDisc(sx - 31, base - 32, 4.6, 0.7, s + 63, 9) + '"/>' +
    '<path d="' + cutDisc(sx - 1, base - 64, 10.5, 1.2, s + 64, 12) + '"/></g>';
  out += '<g class="f-ink"><path d="' + cutDisc(sx - 5, base - 65, 2, 0.5, s + 65, 8) + '"/>' +
    '<path d="' + cutDisc(sx + 3, base - 65, 2, 0.5, s + 66, 8) + '"/></g>';
  out += one(cut([[sx - 12, base - 68],[sx - 9, base - 78],[sx + 9, base - 78],[sx + 12, base - 68]], 1.2, s + 67, 6), "f-blue3", 0, 0);
  out += one(cutDisc(sx + 1, base - 80, 4.4, 0.7, s + 68, 8), "f-blue3", 0, 0);
  out += one(cut([[sx - 32, base - 26],[sx + 32, base - 26],[sx + 30, base - 12],[sx - 30, base - 12]], 1.4, s + 69, 8), "f-red2", 4, 5);
  out += one(cut([[sx - 34, base - 14],[sx + 34, base - 14],[sx + 34, base - 8],[sx - 34, base - 8]], 1, s + 70, 8), "f-brown2", 2, 2);
  out += one(cut([[sx - 34, base - 26],[sx - 42, base - 34],[sx - 45, base - 27],[sx - 36, base - 18]], 1.2, s + 71, 5), "f-brown2", 2, 2);

  /* her arm is laid down after the sled, so it comes round the front of
     the child instead of disappearing behind it */
  out += one(cut([[wx - 14, base - 76],[wx - 42, base - 60],[wx - 45, base - 51],[wx - 13, base - 66]], 1.4, s + 23, 6), "f-plum", 3, 3);
  out += '<g class="f-kraft"><path d="' + cutDisc(wx - 48, base - 50, 5.6, 0.8, s + 24, 9) + '"/></g>';

  /* --- the older one, crouched in front, reaching for the baby ------ */
  var kx = x + 240;
  out += one(cut([[kx - 19, base],[kx + 17, base],[kx + 15, base - 27],[kx - 17, base - 25]], 1.5, s + 80, 7), "f-blue3", 4, 5);
  out += one(cut([[kx - 15, base - 22],[kx - 12, base - 53],[kx + 13, base - 53],[kx + 16, base - 22]], 1.5, s + 81, 7), "f-teal", 3, 4);
  out += one(cut([[kx - 11, base - 49],[kx - 33, base - 40],[kx - 35, base - 33],[kx - 10, base - 41]], 1.3, s + 82, 6), "f-teal", 2, 2);
  out += '<g class="f-kraft"><path d="' + cutDisc(kx - 38, base - 34, 5, 0.7, s + 83, 9) + '"/>' +
    '<path d="' + cutDisc(kx - 1, base - 64, 11.6, 1.3, s + 84, 12) + '"/></g>';
  out += '<g class="f-ink"><path d="' + cutDisc(kx - 7, base - 65, 2.1, 0.5, s + 85, 8) + '"/>' +
    '<path d="' + cutDisc(kx + 1, base - 65, 2.1, 0.5, s + 86, 8) + '"/></g>';
  out += one(cut([[kx - 13, base - 64],[kx - 10, base - 76],[kx + 6, base - 78],[kx + 13, base - 68],
                  [kx + 3, base - 71],[kx - 6, base - 69]], 1.3, s + 87, 7), "f-brown2", 0, 0);

  /* --- what the four of them left lying about ---------------------- */
  out += one(cutDisc(kx + 24, base - 8, 7.5, 0.9, s + 88, 10), "f-red", 2, 3);
  out += '<g class="f-snow">' +
    '<path d="' + cutDisc(x + 112, base - 6, 5.5, 0.8, s + 93, 8) + '"/>' +
    '<path d="' + cutDisc(x + 124, base - 4, 4.4, 0.7, s + 94, 8) + '"/></g>';
  return out;
};


/* --- the flight: sea, plane, city ---------------------------------- */

P.ocean = function(p){
  var x = p.x, w = p.w, out = "";
  out += one(cut([[x, FLOOR - 2],[x + w, FLOOR - 6],[x + w, WORLDH + 90],[x, WORLDH + 90]], 2.2, p.seed, 200), "f-blue2", 0, 0);
  out += '<path class="core" d="' + cutLine(x + 4, FLOOR + 2, x + w - 4, FLOOR - 2, 2, p.seed + 2, 34) + '"/>';
  function wband(y, fill, cls, seed, amp){
    var r = rng(seed), pts = [[x - 60, y + 18]], cx = x - 60;
    while(cx < x + w + 60){
      var st = 56 + r() * 38;
      pts.push([cx + st * 0.5, y - amp - r() * amp], [cx + st, y + 9]);
      cx += st;
    }
    pts.push([x + w + 60, WORLDH + 90], [x - 60, WORLDH + 90]);
    return '<g class="' + cls + '">' + one(cut(pts, 1.8, seed + 1, 4), fill, 0, 5, "psh-l") + "</g>";
  }
  out += wband(FLOOR + 22, "f-blue3", "", p.seed + 10, 7);
  out += wband(FLOOR + 62, "f-blue2", "a-wave1", p.seed + 20, 10);
  out += wband(FLOOR + 116, "f-blue4", "a-wave2", p.seed + 30, 13);
  return out;
};

/* the hangar the small plane rolls out of */
P.hangar = function(p){
  var x = p.x, w = p.w, base = FLOOR + 4, top = base - 150;
  var shell = cut([[x, base],[x, top + 54],[x + w * 0.22, top + 8],[x + w * 0.5, top - 6],
                   [x + w * 0.78, top + 8],[x + w, top + 54],[x + w, base]], 2.6, p.seed, 18);
  var mouth = cut([[x + w * 0.2, base],[x + w * 0.2, top + 62],[x + w * 0.5, top + 24],
                   [x + w * 0.8, top + 62],[x + w * 0.8, base]], 2.2, p.seed + 1, 14);
  return one(shell, "f-cream2", 8, 9) + one(mouth, "f-blue4", 0, 0) +
    one(cutRect(x + w * 0.24, base - 26, w * 0.52, 26, 1.6, p.seed + 2, 14), "f-blue3", 0, 0);
};

/* THE AEROPLANE. It stands on the tarmac with its wheels on the same
   ground the man walks on, its door open and a set of stairs run up to
   it. He walks the apron, he climbs the stairs, he steps in -- and only
   then does the whole machine roll, lift and go, carrying his face in
   the window it left with. Nothing here fades out and nothing here is
   swapped: the figure is handed from the ground to the aircraft in
   front of the reader.

   The take off is driven by the SCROLL, not by a clock, which is why
   the group is given an id instead of an animation class. A timed
   animation fires when the scene group goes live, roughly a thousand
   units of world before this beat, and the plane would have left
   without him.

   Measured from (x, base) so the whole aircraft is two numbers in the
   timeline: x = the tail, base = the ground the wheels stand on. */
P.jet = function(p){
  var x = p.x, base = p.base == null ? FLOOR + 4 : p.base, cy = base - 104, i, out = "";
  var sd = p.seed;

  /* tailplane and fin first, so the fuselage laps over their roots */
  out += one(cut([[x + 2, cy - 18],[x + 30, cy - 30],[x + 56, cy - 26],[x + 30, cy - 10]], 1.3, sd + 1, 8),
    "f-cream2", 5, 6, "psh-l");
  out += one(cut([[x + 4, cy - 22],[x - 12, cy - 94],[x + 34, cy - 90],[x + 58, cy - 24]], 1.6, sd + 2, 12),
    "f-red", 6, 7, "psh-l");
  out += one(cut([[x + 6, cy - 78],[x + 30, cy - 76],[x + 40, cy - 44],[x + 12, cy - 46]], 1.1, sd + 3, 7),
    "f-cream", 0, 0);

  /* undercarriage, behind the body */
  out += '<g class="f-slate"><path d="' + cutRect(x + 176, cy + 26, 9, base - cy - 34, 1, sd + 4, 8) + '"/>' +
    '<path d="' + cutRect(x + 262, cy + 22, 8, base - cy - 30, 1, sd + 5, 8) + '"/></g>';
  out += '<g class="f-ink"><path d="' + cutDisc(x + 180, base - 9, 11, 0.9, sd + 6, 12) + '"/>' +
    '<path d="' + cutDisc(x + 266, base - 8, 9, 0.9, sd + 7, 12) + '"/></g>';

  /* the fuselage: tail cone on the left, nose on the right */
  out += one(cut([[x, cy - 8],[x + 40, cy - 32],[x + 210, cy - 34],[x + 272, cy - 22],
                  [x + 300, cy - 2],[x + 288, cy + 16],[x + 230, cy + 28],[x + 44, cy + 30],[x + 4, cy + 14]],
    1.9, sd, 16), "f-cream", 8, 9, "psh-l");
  /* the cheat line, the one stripe every airliner in the world carries */
  out += '<g class="f-blue3" style="opacity:.55"><path d="' +
    cutRect(x + 16, cy + 12, 268, 8, 1, sd + 8, 40) + '"/></g>';
  /* the nose cone and the flight deck glass */
  out += one(cut([[x + 272, cy - 22],[x + 300, cy - 2],[x + 288, cy + 16],[x + 268, cy + 4]], 1.2, sd + 9, 8),
    "f-blue2", 0, 0);
  out += one(cut([[x + 258, cy - 20],[x + 282, cy - 8],[x + 258, cy - 2]], 0.9, sd + 10, 6), "f-glass", 0, 0);

  /* the wing, swept back toward the reader, with its engine slung under */
  out += one(cut([[x + 170, cy + 4],[x + 268, cy + 8],[x + 236, cy + 54],[x + 142, cy + 46]], 1.6, sd + 11, 12),
    "f-cream2", 6, 7, "psh-l");
  out += one(cutRect(x + 172, cy + 34, 66, 24, 1.3, sd + 12, 10), "f-blue4", 4, 5, "psh-l");

  /* the plain row of portholes, with a gap kept for his */
  var win = "";
  for(i = 0; i < 9; i++){
    if(i === 3) continue;
    win += '<path d="' + cutDisc(x + 128 + i * 17, cy - 10, 4.4, 0.6, sd + 30 + i, 10) + '"/>';
  }
  out += '<g class="f-blue3" style="opacity:.7">' + win + "</g>";

  /* the open door, and the sill his feet land on */
  out += one(cutRect(x + 118, cy - 30, 30, 56, 1.3, sd + 20, 10), "f-blue4", 0, 0);
  out += '<g class="f-cream3"><path d="' + cutRect(x + 118, cy + 22, 30, 6, 0.9, sd + 21, 6) + '"/></g>';

  /* HIS window, cut bigger than the rest on purpose: a face at this size
     has to survive being a third of an inch tall. This is where he is
     once the doorway is empty, so no one has to take it on trust.
     The empty window is cut here, but the FACE is held back: it is
     switched on by the scroll at the exact beat the doorway empties.
     Painted always on, he would be sitting at the window while he is
     still walking the tarmac, and there would be two of him. */
  var wx = x + 179, wy = cy - 22;
  out += one(cutRect(wx, wy, 26, 26, 1.1, sd + 40, 6), "f-blue4", 0, 0);
  out += one(cutRect(wx + 3, wy + 3, 20, 20, 0.9, sd + 41, 5), "f-glass", 0, 0);
  out += '<g id="jetFace" style="opacity:0">';
  out += '<g class="f-kraft"><path d="' + cutDisc(wx + 13, wy + 15, 7.4, 0.9, sd + 42, 12) + '"/></g>';
  out += '<g class="f-ink"><path d="' + cut([[wx + 6, wy + 10],[wx + 8, wy + 5],[wx + 16, wy + 4],
    [wx + 21, wy + 8],[wx + 20, wy + 12],[wx + 16, wy + 9],[wx + 10, wy + 11]], 0.7, sd + 43, 5) + '"/>' +
    '<path d="' + cutDisc(wx + 14.6, wy + 14, 1.5, 0.3, sd + 44, 8) + '"/>' +
    '<path d="' + cutDisc(wx + 10.6, wy + 14, 1.5, 0.3, sd + 45, 8) + '"/></g>';
  /* one hand flat against the glass */
  out += '<g class="f-kraft"><path d="' + cutDisc(wx + 5, wy + 20, 3.2, 0.6, sd + 46, 10) + '"/></g>';
  out += "</g>";

  return '<g id="jetGo">' + out + "</g>";
};

/* The stairs. A run of treads on two stringers, wheeled, with a rail on
   the near side. They are pulled away the moment the door closes. */
P.airstairs = function(p){
  /* run is a DELTA, not a second x. The scene builder only moves the key
     called x into world space, so any painter that took a second absolute
     x drew itself from this beat back to the start of the story. */
  var x = p.x, run = p.run == null ? 92 : p.run, top = x + run;
  var ty = p.ty, base = p.base == null ? FLOOR + 4 : p.base;
  var rise = base - ty, n = 9, i, tr = "";
  var out = "";
  /* stringers */
  out += one(cut([[x, base],[x + 14, base],[top + 6, ty + 6],[top - 4, ty - 4]], 1.5, p.seed, 16),
    "f-cream3", 5, 6, "psh-l");
  for(i = 1; i <= n; i++){
    var t = i / (n + 1), sx2 = x + run * t, sy = base - rise * t;
    tr += '<path d="' + cutRect(sx2 - 3, sy - 5, 26, 6, 0.9, p.seed + 10 + i, 6) + '"/>';
  }
  out += '<g class="f-cream2">' + tr + "</g>";
  /* the near rail, on a pair of stanchions */
  out += '<g stroke="#8f6641" stroke-width="4" fill="none"><path d="' +
    cutLine(x + 4, base - 42, top + 2, ty - 40, 1.4, p.seed + 40, 18) + '"/><path d="' +
    cutLine(x + 6, base, x + 6, base - 44, 1, p.seed + 41, 10) + '"/><path d="' +
    cutLine(top, ty + 2, top, ty - 42, 1, p.seed + 42, 10) + '"/></g>';
  /* the little platform at the top, level with the cabin floor */
  out += one(cutRect(top - 6, ty - 6, 34, 8, 1, p.seed + 50, 8), "f-cream3", 3, 4);
  /* wheels */
  out += '<g class="f-ink" style="opacity:.85"><path d="' + cutDisc(x + 8, base - 7, 8, 0.8, p.seed + 60, 11) + '"/>' +
    '<path d="' + cutDisc(x + 30, base - 7, 8, 0.8, p.seed + 61, 11) + '"/></g>';
  return '<g id="jetStairs">' + out + "</g>";
};

/* --- New York beat --------------------------------------------------
   This city has to be unmistakable and unlike every other street in the
   story, so the towers are cut tall enough to run out of the top of the
   frame, the roofs carry water tanks, and the near flats are walk ups
   with fire escapes zig zagged down their faces. */

/* the far skyline: dense, very tall, all original shapes */
P.nyskyline = function(p){
  var r = rng(p.seed), x = p.x, i, k, ds = [], caps = [], tanks = [], lit = [];
  while(x < p.x + p.w){
    var bw = 40 + r() * 54;
    /* two thirds of the block runs off the top of the picture. The rest
       is capped low enough for its roof, and its tank, to be read. */
    var tall = r() > 0.34;
    var bh = tall ? 470 + r() * 140 : 250 + r() * 130;
    var top = FLOOR - bh;
    ds.push(cutRect(x, top, bw, bh + 120, 2.2, p.seed + Math.round(x), 24));
    if(!tall){
      caps.push(cutRect(x - 5, top - 12, bw + 10, 14, 1.3, p.seed + 900 + Math.round(x), 8));
      /* a water tank: the one silhouette that says this city and no
         other. A paper barrel on four paper legs. */
      var tx = x + bw * 0.5, ty = top - 74;
      for(k = 0; k < 3; k++) tanks.push(cutRect(tx - 15 + k * 14, ty + 34, 4, 30, 0.8, p.seed + 300 + k + Math.round(x), 6));
      tanks.push(cut([[tx - 17, ty + 36],[tx - 15, ty + 6],[tx, ty - 12],[tx + 15, ty + 6],
                      [tx + 17, ty + 36]], 1.4, p.seed + 320 + Math.round(x), 7));
    }
    /* lit window grid, the second half of the New York silhouette */
    var rows = Math.floor((bh - 40) / 46), cols = Math.max(2, Math.floor(bw / 22));
    for(i = 0; i < rows; i++){
      for(k = 0; k < cols; k++){
        if(r() > 0.44) continue;
        lit.push(cutRect(x + 7 + k * ((bw - 12) / cols), top + 26 + i * 46, 9, 16, 0.7, p.seed + 500 + i * 9 + k, 3));
      }
    }
    x += bw + 5 + r() * 13;
  }
  return sheet(ds, "f-blue3", 8, 9, "psh-l") +
    sheet(caps.concat(tanks), "f-blue4", 5, 6, "psh-l") +
    '<g class="f-gold" style="opacity:.4">' + lit.map(function(d){ return '<path d="' + d + '"/>'; }).join("") + "</g>";
};

/* a walk up on the near flat: cornice, fire escape, stoop, lit glass */
P.tenement = function(p){
  var x = p.x, w = p.w, h = p.h, base = FLOOR + 6, top = base - h, i, out = "";
  out += one(cutRect(x, top, w, h, 3, p.seed, 40), p.fill, 10, 11);
  /* the cornice, which is what makes it a walk up and not an office */
  out += one(cutRect(x - 12, top - 22, w + 24, 30, 2, p.seed + 1, 26), "f-cream3", 7, 8);
  out += one(cutRect(x - 6, top + 6, w + 12, 10, 1.3, p.seed + 2, 22), "f-brown", 0, 0);
  /* window bays: two columns, the fire escape hangs between them */
  var rows = Math.floor((h - 96) / 84), gl = "", sl = "";
  for(i = 0; i < rows * 2; i++){
    var cx = x + 16 + (i % 2) * (w - 78), cy = top + 46 + Math.floor(i / 2) * 84;
    gl += '<path d="' + cutRect(cx, cy, 60, 58, 1.5, p.seed + 20 + i, 8) + '"/>';
    sl += '<path d="' + cutRect(cx - 5, cy - 11, 70, 11, 1.1, p.seed + 60 + i, 8) + '"/>';
  }
  out += '<g class="f-cream3">' + sl + "</g>";
  out += '<g class="f-gold" style="opacity:.62">' + gl + "</g>";
  /* the fire escape: landings, rails and a ladder run down the middle */
  var fx = x + w * 0.5 - 34, fe = "", rail = "";
  for(i = 0; i < rows; i++){
    var fy = top + 96 + i * 84;
    fe += '<path d="' + cutRect(fx, fy, 68, 8, 1, p.seed + 100 + i, 10) + '"/>';
    rail += '<path d="' + cutLine(fx, fy, fx, fy - 26, 1, p.seed + 120 + i, 12) + '"/>';
    rail += '<path d="' + cutLine(fx + 68, fy, fx + 68, fy - 26, 1, p.seed + 130 + i, 12) + '"/>';
    rail += '<path d="' + cutLine(fx, fy - 26, fx + 68, fy - 26, 1, p.seed + 140 + i, 16) + '"/>';
    rail += '<path d="' + cutLine(fx + 12, fy, fx + 56, fy + 84, 1.2, p.seed + 150 + i, 14) + '"/>';
  }
  out += '<g class="f-ink" style="opacity:.72">' + fe + "</g>";
  out += '<g stroke="#3a2e28" stroke-width="2.4" fill="none" style="opacity:.6">' + rail + "</g>";
  /* stoop and door, so the street has a way into the building */
  var st = "";
  for(i = 0; i < 4; i++) st += '<path d="' + cutRect(x + w * 0.62 - i * 8, base - 16 - i * 15, 58 + i * 8, 16, 1.2, p.seed + 200 + i, 8) + '"/>';
  out += '<g class="f-cream3">' + st + "</g>";
  out += one(cutRect(x + w * 0.66, base - 118, 44, 74, 1.5, p.seed + 210, 10), "f-brown2", 0, 0);
  return out;
};

/* a campus arch at the edge of the story, not a copy of any real one */
P.arch = function(p){
  var x = p.x, w = p.w, base = FLOOR + 6, top = base - 250, i;
  var out = one(cutRect(x, top + 26, 40, base - top - 26, 2.2, p.seed, 20), "f-cream2", 7, 8);

  var iv = "";

/* --- New York beat -------------------------------------------------- */

P.bridge = function(p){
  var x = p.x, w = p.w, deck = 452, i, out = "";
  out += one(cutRect(x, deck, w, 22, 2, p.seed, 90), "f-blue3", 0, 8, "psh-l");
  var towers = [x + w * 0.28, x + w * 0.72];
  var cables = "";
  for(i = 0; i < 2; i++){
    out += one(cut([[towers[i] - 26, deck + 10],[towers[i] - 26, deck - 190],[towers[i] - 8, deck - 208],
                    [towers[i] + 8, deck - 208],[towers[i] + 26, deck - 190],[towers[i] + 26, deck + 10]], 2.2, p.seed + 5 + i, 16), "f-blue3", 6, 7, "psh-l");
    out += one(cut([[towers[i] - 20, deck - 128],[towers[i] + 20, deck - 128],[towers[i] + 20, deck - 104],[towers[i] - 20, deck - 104]], 1.6, p.seed + 8 + i, 6), "f-blue4", 0, 0);
  }
  for(i = 0; i <= 14; i++){
    var t = i / 14, sx = lerp(towers[0], towers[1], t);
    var sy = deck - 190 + Math.sin(Math.PI * t) * 96;
    cables += '<path d="' + cutLine(sx, sy, sx, deck, 1.2, p.seed + 60 + i, 30) + '"/>';
  }
  cables += '<path d="' + cutLine(towers[0], deck - 190, towers[0] + (towers[1] - towers[0]) * 0.5, deck - 94, 2, p.seed + 90, 26) + '"/>';
  cables += '<path d="' + cutLine(towers[0] + (towers[1] - towers[0]) * 0.5, deck - 94, towers[1], deck - 190, 2, p.seed + 91, 26) + '"/>';
  out += '<g stroke="#37536d" stroke-width="3" fill="none" style="opacity:.62">' + cables + "</g>";
  return out;
};

P.cab = function(p){

P.streetlamp = function(p){

P.house = function(p){
  /* Two houses live in this painter. The plain one is scenery. The
     home one (p.home) is the house the whole story walks to, so it is
     cut a size up and given the things a lived-in house has: shutters,
     an upstairs window under the eave, a porch slab, a few flat path
     stones, and the rigging for the going-to-bed play -- two small
     silhouette heads clipped inside the upstairs pane, three chimney
     puffs, and three sleep letters. All of those are cut at opacity
     zero or below the pane, and only the .home class winds them up. */
  var home = p.home, base = FLOOR + 6;
  var x = p.x, w = p.w, bodyTop = base - (home ? 226 : 196);
  var body = cutRect(x, bodyTop, w, home ? 230 : 200, 2.6, p.seed, 30);
  var roof = cut([[x - 26, bodyTop + 8],[x + w * 0.5, bodyTop - (home ? 84 : 76)],[x + w + 26, bodyTop + 8],[x + w + 12, bodyTop + 22],[x - 12, bodyTop + 22]], 2.4, p.seed + 1, 20);
  var chim = home ? cutRect(x + w * 0.30, bodyTop - 98, 26, 88, 1.6, p.seed + 2) :
    cutRect(x + w * 0.7, bodyTop - 64, 24, 54, 1.6, p.seed + 2);
  var door = cutRect(x + w * 0.6, base - 94, 52, 94, 1.6, p.seed + 3);
  var win = home ? cutRect(x + w * 0.13, bodyTop + 62, 70, 66, 1.6, p.seed + 4) :
    cutRect(x + w * 0.14, bodyTop + 50, 64, 58, 1.6, p.seed + 4);
  var out = one(chim, "f-red2", 4, 5);
  if(home){
    /* the chimney breathes only once somebody is in to light the stove */
    out += '<g fill="#cbc3c9">' +
      '<ellipse class="puff p1" cx="' + f(x + w * 0.30 + 13) + '" cy="' + f(bodyTop - 104) + '" rx="6.5" ry="5"/>' +
      '<ellipse class="puff p2" cx="' + f(x + w * 0.30 + 9)  + '" cy="' + f(bodyTop - 122) + '" rx="8.5" ry="6.5"/>' +
      '<ellipse class="puff p3" cx="' + f(x + w * 0.30 + 17) + '" cy="' + f(bodyTop - 142) + '" rx="10.5" ry="8"/></g>';
  }
  out += one(body, "f-cream", 8, 9) + one(roof, "f-red", 6, 7);
  if(home){
    out += '<g class="f-red2"><path d="' + cutRect(x + w * 0.13 - 13, bodyTop + 64, 10, 62, 1.2, p.seed + 9) + '"/>' +
      '<path d="' + cutRect(x + w * 0.13 + 73, bodyTop + 64, 10, 62, 1.2, p.seed + 10) + '"/></g>';
  }
  out += one(win, "f-glass", 3, 4) +
    '<g class="f-cream2"><path d="' + (home ?
      cutRect(x + w * 0.13 + 32, bodyTop + 62, 6, 66, 1, p.seed + 5) :
      cutRect(x + w * 0.14 + 29, bodyTop + 50, 6, 58, 1, p.seed + 5)) + '"/>' +
    '<path d="' + (home ?
      cutRect(x + w * 0.13, bodyTop + 92, 70, 6, 1, p.seed + 6) :
      cutRect(x + w * 0.14, bodyTop + 76, 64, 6, 1, p.seed + 6)) + '"/></g>';
  if(home){
    var win2 = cutRect(x + w * 0.54, bodyTop + 28, 40, 34, 1.4, p.seed + 7);
    out += one(win2, "f-glass", 3, 4) +
      /* the pane is its own clip, so the heads rise inside the glass
         and nowhere else: a shadow theatre the size of one window */
      '<clipPath id="homewin"><path d="' + win2 + '"/></clipPath>' +
      '<g clip-path="url(#homewin)" fill="#2a2234">' +
      '<g class="kidpeek"><circle cx="' + f(x + w * 0.54 + 13) + '" cy="' + f(bodyTop + 56) + '" r="8"/>' +
      '<circle cx="' + f(x + w * 0.54 + 9) + '" cy="' + f(bodyTop + 50) + '" r="4"/></g>' +
      '<g class="babypeek"><circle cx="' + f(x + w * 0.54 + 29) + '" cy="' + f(bodyTop + 59) + '" r="6.5"/>' +
      '<circle cx="' + f(x + w * 0.54 + 32) + '" cy="' + f(bodyTop + 53) + '" r="2.6"/></g></g>' +
      '<g class="f-cream2"><path d="' + cutRect(x + w * 0.54 + 17, bodyTop + 28, 6, 34, 1, p.seed + 8) + '"/></g>';
    out += '<g class="f-cream2"><path d="' + cutRect(x + w * 0.565, base - 6, 70, 12, 1.2, p.seed + 11) + '"/></g>' +
      '<g class="f-cream2" opacity=".55">' +
      '<path d="' + cutRect(x + w * 0.49 - 17, base + 4, 34, 7, 1.2, p.seed + 12) + '"/>' +
      '<path d="' + cutRect(x + w * 0.26 - 17, base + 8, 34, 7, 1.2, p.seed + 13) + '"/>' +
      '<path d="' + cutRect(x + w * 0.02 - 17, base + 5, 34, 7, 1.2, p.seed + 14) + '"/>' +
      '<path d="' + cutRect(x - w * 0.21 - 17, base + 9, 34, 7, 1.2, p.seed + 15) + '"/></g>';
  }
  out += one(door, "f-brown", 3, 4) +
    '<g class="f-gold"><circle cx="' + f(x + w * 0.6 + 42) + '" cy="' + f(base - 48) + '" r="3.4"/></g>';
  if(home){
    out += '<g fill="#f4e8d0" text-anchor="middle">' +
      '<text class="sgn zz z1" x="' + f(x + w * 0.755) + '" y="' + f(bodyTop + 14) + '" font-size="11">z</text>' +
      '<text class="sgn zz z2" x="' + f(x + w * 0.81) + '" y="' + f(bodyTop - 2) + '" font-size="14">z</text>' +
      '<text class="sgn zz z3" x="' + f(x + w * 0.875) + '" y="' + f(bodyTop - 20) + '" font-size="18">z</text></g>';
  }
  return out;
};

P.housefar = function(p){
  var x = p.x, w = p.w, base = FLOOR + 60, top = base - 150;
  return one(cutRect(x, top, w, 154, 2.2, p.seed, 20), "f-blue3", 5, 6, "psh-l") +
    one(cut([[x - 13, top + 5],[x + w * 0.5, top - 46],[x + w + 13, top + 5]], 2.0, p.seed + 1, 14), "f-blue4", 5, 6, "psh-l");
};

/* --- rooms ---------------------------------------------------------- */

/* A room is a cutaway box, never a curtain. It has a measured top, a
   ceiling beam and a roof over it, so the sky still reads above the
   house and the interior sits inside the landscape instead of erasing
   it. p.top is the ceiling line in world units. */
P.wall = function(p){
  var x = p.x, w = p.w, top = p.top == null ? 330 : p.top, i;
  var r = rng(p.seed);
  var left = [], right = [], n = 22, bottom = FLOOR + 30;
  for(i = 0; i <= n; i++){
    var t = i / n;
    left.push([x + 10 + (r() - 0.5) * 26, top + t * (bottom - top)]);
    right.push([x + w - 10 - (r() - 0.5) * 26, top + t * (bottom - top)]);
  }
  var pts = [].concat([[x + 10, top]], left, [[x + w - 10, bottom]], right.reverse(), [[x + w - 10, top]]);
  /* roof slab first, so the room front laps over its lower edge */
  var pk = Math.min(78, Math.max(38, w * 0.11));
