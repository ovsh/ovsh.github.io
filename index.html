/* =================================================================
   8. LIGHT, SEASON, INDOORS
   One scalar L drives the whole palette. The sky gradient is divided
   by the multiply tint first, so the sky reads as painted paper under
   the same light as everything else instead of double darkening.
   ================================================================= */

/* THE LIGHT IS TWO SHEETS. See the .tint / .tint-b note in the stylesheet.
   TINT is the weak sheet over the whole set, TINT_B the deep one that
   reaches the background only. Multiplied together they come to
   [255,255,255] / [214,186,168] / [104,110,150] -- the single tint the
   set used to be lit by -- so the far country is exactly where it was
   and the man, his desk, his screen and every pinned clipping are not. */
var TINT   = [[255,255,255],[244,236,230],[220,218,230]];   /* day, dusk, night */
var TINT_B = [[255,255,255],[224,201,186],[121,129,166]];
var SKY  = [[[143,182,207],[188,214,221],[240,220,184]],
            [[104,124,164],[186,150,150],[226,166,124]],
            [[ 38, 50, 84],[ 56, 70,106],[ 92, 96,128]]];
var SEASONS = {
  spring:{leaf:[125,154, 92], gr2:[142,163,100], gr3:[ 99,122, 70]},
  summer:{leaf:[106,142, 78], gr2:[126,154, 86], gr3:[ 84,110, 62]},
  fall:  {leaf:[192,124, 60], gr2:[176,142, 78], gr3:[140, 98, 52]},
  winter:{leaf:[176,182,176], gr2:[196,200,196], gr3:[150,158,158]}
};

function mix3(set, L){
  /* L: 1 day, .5 dusk, 0 night. Two segments, smooth at the join. */
  var t, a, b;
  if(L >= 0.5){ t = (L - 0.5) * 2; a = set[1]; b = set[0]; }
  else { t = L * 2; a = set[2]; b = set[1]; }
  if(a[0] instanceof Array){
    var out = [], i;
    for(i = 0; i < a.length; i++) out.push([lerp(a[i][0],b[i][0],t), lerp(a[i][1],b[i][1],t), lerp(a[i][2],b[i][2],t)]);
    return out;
  }
  return [lerp(a[0],b[0],t), lerp(a[1],b[1],t), lerp(a[2],b[2],t)];
}
function rgb(c){ return "rgb(" + Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]) + ")"; }
/* the tint sheet multiplies everything, so pre-divide the sky by it */
function pre(c, t){
  return [clamp(c[0] / Math.max(0.06, t[0] / 255), 0, 255),
          clamp(c[1] / Math.max(0.06, t[1] / 255), 0, 255),
          clamp(c[2] / Math.max(0.06, t[2] / 255), 0, 255)];
}
function mixc(a, b, t){ return [lerp(a[0],b[0],t), lerp(a[1],b[1],t), lerp(a[2],b[2],t)]; }

/* light, season and indoor state read straight off the timeline */
function lightAt(x){
  var n = TIMELINE.length - 1, s;
  for(; n >= 0; n--) if(x >= starts[n]) break;
  if(n < 0) n = 0;
  s = TIMELINE[n];
  var t = clamp((x - starts[n]) / s.span, 0, 1), k = s.light, i;
  for(i = 0; i < k.length - 1; i++){
    if(t <= k[i + 1][0]){
      var u2 = (t - k[i][0]) / Math.max(1e-6, k[i + 1][0] - k[i][0]);
      return lerp(k[i][1], k[i + 1][1], smooth(0, 1, u2));
    }
  }
  return k[k.length - 1][1];
}
function indoorAt(x){
  var n = TIMELINE.length - 1;
  for(; n >= 0; n--) if(x >= starts[n]) break;
  if(n < 0) n = 0;
  var s = TIMELINE[n], lx = x - starts[n], r = s.indoor || [], i, best = 0;
  for(i = 0; i < r.length; i++){
    var a = r[i][0], b = r[i][1], fade = 70;
    var v = Math.min(smooth(a - fade, a + fade, lx), 1 - smooth(b - fade, b + fade, lx));
    if(v > best) best = v;
  }
  return clamp(best, 0, 1);
}
/* seasons cross fade over the scene boundary so nothing snaps green */
function seasonAt(x){
  var n = TIMELINE.length - 1;
  for(; n >= 0; n--) if(x >= starts[n]) break;
  if(n < 0) n = 0;
  var cur = SEASONS[TIMELINE[n].season], t = (x - starts[n]) / TIMELINE[n].span;
  var blend = 0.22;
  if(t < blend && n > 0) return {a:SEASONS[TIMELINE[n - 1].season], b:cur, t:smooth(0, blend, t)};
  if(t > 1 - blend && n < TIMELINE.length - 1) return {a:cur, b:SEASONS[TIMELINE[n + 1].season], t:smooth(1 - blend, 1, t)};
  return {a:cur, b:cur, t:0};
}
function sceneAt(x){
  for(var n = TIMELINE.length - 1; n >= 0; n--) if(x >= starts[n]) return TIMELINE[n].id;
  return TIMELINE[0].id;
}
function beatAt(x){
  var n = TIMELINE.length - 1;
  for(; n >= 0; n--) if(x >= starts[n]) break;
  if(n < 0) n = 0;
  var s = TIMELINE[n], lx = x - starts[n], list = s.hero || [], i, pick = null;
  for(i = 0; i < list.length; i++) if(lx >= list[i].x) pick = list[i];
  if(!pick){
    /* fall back to the last beat of the last scene that had one */
    for(i = n - 1; i >= 0 && !pick; i--){
      var pl = TIMELINE[i].hero || [];
      if(pl.length) pick = pl[pl.length - 1];
    }
  }
  if(!pick) pick = {form:"none", gait:"walk"};
  /* rise lifts the whole puppet off the floor line, in world units. It
     is what carries him up the airstairs: the stage floor stays where
     it is and the man climbs above it. */
  var r = pick.rise || 0;
  /* enter only means something at a seat: the door you step through is
     the place you walked to. Without a seat the flag is dropped. */
  if(pick.seat) return {form:pick.form, gait:pick.gait, pal:pick.pal, rise:r, enter:pick.enter, seat:{x:starts[n] + pick.seat.x}};
  return {form:pick.form, gait:pick.gait, pal:pick.pal, rise:r, seat:null};
}

/* =================================================================
   9. THE SCROLL RATE MAP
   The page is not a constant speed dolly. Every rate zone becomes a
   run of piecewise linear cost segments: cost is what the reader
   spends in scroll, world x is what they get. mult > 1 holds the
   camera on a beat, mult < 1 throws transit away. Ease is expressed
   as data, by subdividing the ramp, so the engine stays one line.
   ================================================================= */

var SEGS = [], costTotal = 0, mapEnd = 0;

/* The map runs from 0 to the camera stop, not to the end of the paper.
   The last screen of world is the closing frame, so no scroll is spent
   pushing the camera into it. */
function buildScrollMap(){
  var raw = [], j, i;
  mapEnd = xMax > 200 ? xMax : WORLD_SPAN;
  for(j = 0; j < TIMELINE.length; j++){
    var z = TIMELINE[j].rate || [];
    for(i = 0; i < z.length; i++){
      var a = starts[j] + z[i][0], b = starts[j] + z[i][1], m = z[i][2], e = z[i][3] || 0;
      e = Math.min(e, (b - a) / 2);
      if(e > 1){
        var STEPS = 5, k;
        for(k = 0; k < STEPS; k++){
          var t0 = k / STEPS, t1 = (k + 1) / STEPS;
          raw.push([a + e * t0, a + e * t1, lerp(1, m, smooth(0, 1, (t0 + t1) / 2))]);
          raw.push([b - e * t1, b - e * t0, lerp(1, m, smooth(0, 1, (t0 + t1) / 2))]);
        }
        raw.push([a + e, b - e, m]);
      } else {
        raw.push([a, b, m]);
      }
    }
  }
  raw.sort(function(p, q2){ return p[0] - q2[0]; });

  SEGS = []; costTotal = 0;
  var cursor = 0;
  function push(x0, x1, m){
    if(x1 - x0 < 0.5) return;
    var c0 = costTotal;
    costTotal += (x1 - x0) * m;
    SEGS.push({x0:x0, x1:x1, m:m, c0:c0, c1:costTotal});
  }
  for(i = 0; i < raw.length; i++){
    if(raw[i][0] >= mapEnd) break;
    if(raw[i][0] > cursor) push(cursor, raw[i][0], 1);
    var s0 = Math.max(cursor, raw[i][0]), s1 = Math.min(raw[i][1], mapEnd);
    if(s1 > s0){ push(s0, s1, raw[i][2]); cursor = s1; }
  }
  if(cursor < mapEnd) push(cursor, mapEnd, 1);
}
/* cost -> world x, the inverse of the map */
function worldAt(p){
  var c = clamp(p, 0, 1) * costTotal, lo = 0, hi = SEGS.length - 1;
  while(lo < hi){
    var mid = (lo + hi) >> 1;
    if(SEGS[mid].c1 < c) lo = mid + 1; else hi = mid;
  }
  var s = SEGS[lo];
  if(!s) return 0;
  return clamp(s.x0 + (c - s.c0) / s.m, 0, mapEnd);
}
/* world x -> cost, used only to report the dwell metrics */
function costAt(x){
  var i;
  for(i = 0; i < SEGS.length; i++){
    var s = SEGS[i];
    if(x <= s.x1) return s.c0 + Math.max(0, x - s.x0) * s.m;
  }
  return costTotal;
}

/* =================================================================
   10. LAYOUT
   ================================================================= */

var vw = 0, vh = 0, SH = 0, STOP = 0, letterbox = false;
var u = 1, floorY = 0, docH = 1, pad = 30, xMax = 0;
var RATE = 0.50;   /* scroll cost -> pixels. Tuned so the whole story is
                      10 to 13 screens on a laptop and every beat is meaty. */

/* the reader's place in the story, kept as progress and not as pixels.
   A window resize, or a headless window that settles on its real size
   after the first paint, changes how tall the scroll track is: without
   this the page would keep the old pixel offset and quietly land on a
   different beat than the one the deep link asked for. */
var keepP = -1;
/* a deep link is authoritative until the reader takes over: the viewport
   can settle to a different height after the first paint and the browser
   shifts the scroll position with it, which would land the page on a
   different beat than the one the link asked for. */
var lockP = -1;

function layout(){
  if(docH > 1) keepP = clamp(scrollEl.scrollTop / Math.max(1, docH - vh), 0, 1);
  var vwReal = scrollEl.clientWidth || window.innerWidth;
  vh = scrollEl.clientHeight || window.innerHeight;
  letterbox = vh / vwReal > 1.12;
  /* the scenery svg is cut once, at load, so a sheet that has to sit in a
     different place on a narrow stage cannot be re painted. The flag is
     put on the stage instead and the css moves it. */
  stage.classList.toggle("lb", letterbox);
  /* Past this width the set stops growing and stands centred on the paper
     backdrop, the same way the tall phone letterband works. A wider stage
     shows more world at once, so on an ultrawide screen the camera starts
     already past the opening scene and the reader never sees the title. */
  vw = Math.min(vwReal, STAGE_MAX);
  var SX = Math.round((vwReal - vw) / 2);
  /* on a phone the diorama takes the top band and the text takes the
     rest, because 60px display letters cannot share a 375px column */
  SH = letterbox ? Math.round(Math.min(vh * 0.46, vw * 1.34)) : vh;
  STOP = letterbox ? Math.round((vh - SH) * 0.20) : 0;
  stage.style.left = SX + "px";
  stage.style.width = vw + "px";
  stage.style.right = "auto";
  stage.style.top = STOP + "px";
  stage.style.height = SH + "px";
  stage.style.bottom = "auto";
  uiHost.style.left = SX + "px";
  uiHost.style.width = vw + "px";
  uiHost.style.right = "auto";
  pad = vw < 620 ? 12 : 28;

  var WH = letterbox ? 520 : 470;
  u = letterbox ? clamp(SH / WH, 0.42, 1.6)
                : clamp(Math.min(vw / VPW * 1.18, SH / WH), 0.62, 1.7);
  floorY = Math.round(SH - clamp(SH * 0.13, 54, 118));
  /* the camera stops when the last sheet of paper reaches the right edge,
     so the closing frame is the capstone and not empty world past it */
  xMax = Math.max(0, WORLD_SPAN - vw / u);
  buildScrollMap();

  var vhMin = 11, vhMax = letterbox ? 15 : 14;
  docH = Math.round(clamp(costTotal * u * RATE, vhMin * vh, vhMax * vh) + vh);
  spacer.style.height = Math.max(0, docH - vh) + "px";   /* the sticky pane already fills one screen */
  var back = lockP >= 0 ? lockP : keepP;
  if(back >= 0) scrollEl.scrollTop = Math.round(back * Math.max(1, docH - vh));

  var li, ci;
  for(li = 0; li < layers.length; li++){
    var lay = layers[li], wUnits = lay.hi - lay.lo;
    lay.svg.setAttribute("viewBox", lay.lo + " 0 " + wUnits + " " + WORLDH);
    lay.svg.style.left = f(lay.lo * u) + "px";
    lay.svg.style.width = f(wUnits * u) + "px";
    lay.svg.style.height = f(WORLDH * u) + "px";
    lay.svg.style.top = f(floorY - FLOOR * u) + "px";
  }
  for(ci = 0; ci < glowEls.length; ci++){
    var ge = glowEls[ci];
    ge.el.style.width = f(ge.r * 2 * u) + "px";
    ge.el.style.height = f(ge.r * 2 * u) + "px";
  }
  var cs = Math.max(0.9, u), sz = f(160 * cs), hz = f(380 * cs);
  ["sun", "moon"].forEach(function(id){
    var e = document.getElementById(id);
    e.style.width = sz + "px"; e.style.height = sz + "px";
    e.style.left = f(-80 * cs) + "px"; e.style.top = f(-80 * cs) + "px";
  });
  ["sunHalo", "moonHalo"].forEach(function(id){
    var e = document.getElementById(id);
    e.style.width = hz + "px"; e.style.height = hz + "px";
    e.style.left = f(-190 * cs) + "px"; e.style.top = f(-190 * cs) + "px";
  });
  /* a pinned print is sized in world units like every other object in
     the set, so it grows and shrinks with the paper around it */
  for(ci = 0; ci < arts.length; ci++){
    var ar = arts[ci], AW = ar.w * u, AH = ar.h * u;
    ar.el.style.width = f(AW) + "px";
    ar.el.style.height = f(AH) + "px";
    /* a phone frame holds half as much world, so a wide sheet is nudged
       along the set to stay on the paper instead of half off the edge */
    ar.el.style.left = f((ar.x + (letterbox ? ar.mx : 0)) * u) + "px";
    ar.el.style.top = f(floorY - (FLOOR - ar.y) * u) + "px";
    ar.el.style.setProperty("--pad", f(clamp(AW * 0.05, 5, 17)) + "px");
    ar.el.style.setProperty("--fs", f(clamp(AH * 0.105, 11, 27)) + "px");
    ar.el.style.setProperty("--ms", f(clamp(AH * 0.072, 9, 17)) + "px");
    ar.el.style.setProperty("--os", f(clamp(AH * 0.068, 9, 15)) + "px");
    /* a stake so a sign standing in the open reads as planted, not
       floating. It runs from the foot of the mount to the floor line. */
    if(ar.leg) ar.el.style.setProperty("--leg",
      f(Math.max(0, floorY - (floorY - (FLOOR - ar.y) * u) - AH)) + "px");
  }
  for(ci = 0; ci < caps.length; ci++) measureCap(caps[ci]);
  drawFrame();
  dirty = true;
}

/* a caption is measured while briefly visible, then hidden again, so
   an off screen strip is never a focus trap and never a layout guess */
function measureCap(cp){
  var was = cp.el.classList.contains("on");
  if(!was) cp.el.style.visibility = "hidden";
  cp.el.style.display = "block";
  cp.w = cp.el.offsetWidth;
  cp.h = cp.el.offsetHeight;
  if(!was) cp.el.style.visibility = "";
}

function drawFrame(){
  var b = vw < 620 ? 7 : 13;
  var outer = "M0 0H" + vw + "V" + SH + "H0Z";
  var inner = cut([[b, b], [vw - b, b], [vw - b, SH - b], [b, SH - b]], vw < 620 ? 1.6 : 2.6, 909, 40);
  frameEl.setAttribute("viewBox", "0 0 " + vw + " " + SH);
  frameEl.setAttribute("width", vw);
  frameEl.setAttribute("height", SH);
  frameEl.innerHTML = '<path class="fsh" fill-rule="evenodd" d="' + outer + inner + '" transform="translate(3,4)"/>' +
    '<path fill-rule="evenodd" d="' + outer + inner + '"/>';
}

var lastL = -1, lastIndoor = -1, lastSeason = "";
function applyLight(L, x){
  if(Math.abs(L - lastL) > 0.0015){
    lastL = L;
    var tint = mix3(TINT, L), tintB = mix3(TINT_B, L), sky = mix3(SKY, L);
    /* the sky sits under BOTH sheets, so it is pre-divided by both */
    var comp = [tint[0] * tintB[0] / 255, tint[1] * tintB[1] / 255, tint[2] * tintB[2] / 255];
    tintEl.style.backgroundColor = rgb(tint);
    tintBackEl.style.backgroundColor = rgb(tintB);
    skyfill.style.setProperty("--sky-a", rgb(pre(sky[0], comp)));
    skyfill.style.setProperty("--sky-b", rgb(pre(sky[1], comp)));
    skyfill.style.setProperty("--sky-c", rgb(pre(sky[2], comp)));
    var night = clamp((0.55 - L) / 0.5, 0, 1);
    glowLayer.style.setProperty("--night", f(night * 100) / 100);
    var so = clamp((0.42 - L) / 0.3, 0, 1);
    starHost.style.setProperty("--star-op", f(so * 100) / 100);
    starHost.classList.toggle("live", so > 0.05);
    /* one disc at a time, and the two ranges do not touch: the stagehand
       has the moon fully off the set before the sun is pushed on, so no
       frame is ever lit by both */
    var sunOn = clamp((L - 0.52) / 0.16, 0, 1);
    var moonOn = clamp((0.46 - L) / 0.16, 0, 1);
    sunBox.style.opacity = f(sunOn * 100) / 100;
    sunBox.style.display = sunOn < 0.01 ? "none" : "block";
    /* the sun rides down and turns over as the day goes: high and pale
       gold at noon, low and orange at dusk. Without this it hangs in
       the top corner at full height while the sky underneath is pink,
       and the multiply tint drains it to grey. */
    var low = 1 - clamp((L - 0.55) / 0.4, 0, 1);
    sunBox.style.top = f(12 + low * 40) + "%";
    sunBox.style.setProperty("--sunfill", rgb(mixc([226, 179, 85], [232, 122, 62], low)));
    moonBox.style.opacity = f(moonOn * 100) / 100;
    moonBox.style.display = moonOn < 0.01 ? "none" : "block";
  }
  var sn = seasonAt(x), key = sn.a.leaf[0] + ":" + sn.b.leaf[0] + ":" + f(sn.t);
  if(key !== lastSeason){
    lastSeason = key;
    var st = document.documentElement.style;
    st.setProperty("--leaf", rgb(mixc(sn.a.leaf, sn.b.leaf, sn.t)));
    st.setProperty("--gr2", rgb(mixc(sn.a.gr2, sn.b.gr2, sn.t)));
    st.setProperty("--gr3", rgb(mixc(sn.a.gr3, sn.b.gr3, sn.t)));
  }
}

/* =================================================================
   11. THE LOOP
   Transforms only, one rAF, and it parks itself when nothing moves.
   ================================================================= */

var q = new URLSearchParams(location.search);
var RM = q.get("rm") === "1" ||
  (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
if(RM) document.documentElement.classList.add("rm");
/* the first frame is painted, not animated: the opening words are on the
   paper before anything can fade, and a deep link lands on a finished
   picture instead of a dissolve. */
document.documentElement.classList.add("boot");

var X = 0, targetX = 0, dirty = true, running = false;
var heroWorld = 0, prevEff = 0, gaitPhase = 0, heroKeyOn = "", lastGait = "", heroRise = 0;
var heroGone = false;
var trkOpen = 0;

function setHeroForm(form, pal){
  var key = form + (pal && HERO[form + "-pal"] ? "-pal" : "");
  if(form === "none") key = "";
  if(key === heroKeyOn) return;
  if(heroKeyOn && HERO[heroKeyOn]) HERO[heroKeyOn].classList.remove("on", "enter", "gone");
  if(heroGone){ heroGone = false; document.documentElement.classList.remove("home"); }
  heroKeyOn = key;
  lastGait = "";           /* a fresh puppet needs its pose written */
  if(key && HERO[key]){
    HERO[key].classList.add("on");
    if(!RM){
      HERO[key].classList.remove("enter");
      void HERO[key].offsetWidth;
      HERO[key].classList.add("enter");
    }
  }
}

/* the caption placement system.
   col blocks the strip into a third of the frame, row blocks it into a
   band. The clamp keeps it on screen without ever letting it drift into
   the middle of the set, so the words stay composed with the picture
   instead of floating over it. */
function placeCap(cp){
  var w = cp.w, h = cp.h, lo, hi;
  /* the measured width covers the faces only. Each strip also throws a
     solid paper shadow to the right and is turned a degree or so, and
     both of those reach past the box, so the right stop is pulled in. */
  var bleed = 12;
  var xMaxC = Math.max(pad, vw - w - pad - bleed);
  if(letterbox){
    /* phone: the diorama is a band at the top, the text owns the rest */
    var cxm = clamp((cp.x - X) * u - w * 0.5, pad, xMaxC);
    var top = STOP + SH + Math.max(10, (vh - STOP - SH - h) * 0.30);
    return [cxm, Math.min(top, Math.max(STOP + SH + 6, vh - h - 8))];
  }
  if(cp.col === "left"){ lo = pad; hi = Math.max(pad, vw * 0.30); }
  else if(cp.col === "right"){ lo = vw * 0.52; hi = xMaxC; }
  else { lo = (vw - w) / 2 - vw * 0.14; hi = (vw - w) / 2 + vw * 0.14; }
  if(hi < lo) hi = lo;
  lo = clamp(lo, pad, xMaxC);
  hi = clamp(hi, pad, xMaxC);
  if(hi < lo) hi = lo;
  var cx = clamp((cp.x - X) * u - w * 0.5, lo, hi);
  var cy;
  if(cp.row === "top") cy = STOP + SH * 0.055;
  else if(cp.row === "mid") cy = STOP + (SH - h) * 0.42;
  else if(cp.row === "low") cy = STOP + SH - h - SH * 0.10;
  else cy = STOP + SH * 0.12;
  cy = clamp(cy, STOP + 10, STOP + SH - h - 10);
  if(h > SH - 24) cy = STOP + 10;
  return [cx, cy];
}

function frame(){
  var maxScroll = Math.max(1, docH - vh);
  var p = clamp(scrollEl.scrollTop / maxScroll, 0, 1);
  targetX = Math.min(worldAt(p), xMax);

  if(RM) X = targetX;
  else {
    var dx = targetX - X;
    if(Math.abs(dx) < 0.05) X = targetX; else X += dx * 0.13;
  }

  var vpw = vw / u;
  var focus = X + vpw * 0.34;
  applyLight(lightAt(focus), focus);
  flyJet(focus);
  var ind = indoorAt(focus);
  if(Math.abs(ind - lastIndoor) > 0.004){
    lastIndoor = ind;
    skyLights.style.opacity = f((1 - ind) * 100) / 100;
  }

  var li, ci;
  for(li = 0; li < layers.length; li++){
    var lay = layers[li];
    lay.el.style.transform = "translate3d(" + f(-X * lay.d * u) + "px,0,0)";
    /* a group is on when its own paper overlaps the visible window,
       measured in this layer's own coordinates */
    var Xd = X * lay.d;
    for(ci = 0; ci < lay.groups.length; ci++){
      var gp = lay.groups[ci];
      var on = gp.hi > Xd && gp.lo < Xd + vpw;
      if(on !== gp.on){ gp.on = on; gp.el.classList.toggle("off", !on); }
      /* live drives the one shot ambient: it starts when the reader
         reaches the beat that owns it, and it ends. It never loops. */
      var live = on && !RM && X > gp.sc0 - vpw * 0.85 && X < gp.sc1 + vpw * 0.5;
      if(live !== gp.live){ gp.live = live; gp.el.classList.toggle("live", live); }
      /* a backdrop flat leaves the stage when the next one takes the frame */
      if(gp.wlo !== undefined){
        var dm = X < gp.wlo || X > gp.whi;
        if(dm !== gp.dim){ gp.dim = dm; gp.el.classList.toggle("dim", dm); }
      }
    }
  }
  artLayer.style.transform = "translate3d(" + f(-X * u) + "px,0,0)";
  litLayer.style.transform = artLayer.style.transform;
  /* the ride is drawn as it is ridden: the clip window opens from the
     start marker to a little ahead of the traveller, and never closes */
  if(trkRect && TRK){
    var cut0 = TRK.x - 80, reach = clamp(focus + 270 - cut0, 0, TRK.w + 380);
    if(reach > trkOpen){ trkOpen = reach; trkRect.setAttribute("width", f(reach)); }
  }
  glowLayer.style.transform = "translate3d(" + f(-X * u) + "px,0,0)";
  for(ci = 0; ci < glowEls.length; ci++){
    var ge = glowEls[ci];
    ge.el.style.transform = "translate3d(" + f(ge.x * u - ge.r * u) + "px," +
      f(floorY - (FLOOR - ge.y) * u - ge.r * u) + "px,0)";
  }
  celestWrap.style.transform = "translate3d(" + f(-p * vw * 0.10) + "px,0,0)";

  /* ---- hero ---- */
  var beat = beatAt(focus);
  setHeroForm(beat.form, beat.pal);
  var anchorWorld = X + vpw * 0.34;
  var wantWorld = beat.seat ? beat.seat.x : anchorWorld;
  if(RM || heroWorld === 0) heroWorld = wantWorld;
  else heroWorld += (wantWorld - heroWorld) * 0.11;
  var sx = clamp((heroWorld - X) * u, vw * 0.10, vw * 0.74);
  var eff = X + sx / u, vel = eff - prevEff;
  prevEff = eff;
  if(RM) heroRise = beat.rise || 0;
  else heroRise += ((beat.rise || 0) - heroRise) * 0.11;

  var el = heroKeyOn ? HERO[heroKeyOn] : null;
  if(el){
    var F = FORMS[beat.form] || FORMS.adult, k = u * F.sc;
    heroWrap.style.width = f(200 * k) + "px";
    heroWrap.style.height = f(176 * k) + "px";
    heroWrap.style.transform = "translate3d(" + f(sx - CX * k) + "px," +
      f(floorY - FOOTY * k - heroRise * u) + "px,0)";
    var moving = Math.abs(vel) > 0.4;
    var gait = beat.gait;
    /* sitting only once he has actually reached the chair, so the walk
       carries him in and the pose is never a teleport. And only while
       he is still ON it: past the seat the edge clamp starts dragging
       the drawn position away, and a boy sliding across the room in the
       chair pose is a boy glued to a chair. eff is where he is actually
       drawn, so the second test stands him up the moment he is pulled
       off the seat. */
    if((gait === "sit" || gait === "play") &&
       (Math.abs(heroWorld - wantWorld) > 26 || Math.abs(eff - wantWorld) > 14)) gait = "walk";
    if(moving) gaitPhase += Math.abs(vel) * (beat.form === "baby" ? 0.058 : 0.040);
    var pose;
    if(gait === "sit") pose = SIT;
    else if(gait === "play") pose = PLAY;
    else if(gait === "toddle") pose = TODDLE[moving ? Math.floor(gaitPhase) % TODDLE.length : 0];
    else if(moving) pose = WALK[Math.floor(gaitPhase) % WALK.length];
    else pose = STAND;
    var pkey = gait + ":" + (moving ? Math.floor(gaitPhase) % 6 : "s");
    if(pkey !== lastGait){ lastGait = pkey; setPose(el, pose); }
    /* the door. A beat marked enter walks its puppet to the seat like
       any other, and only once it has truly arrived -- the chased
       position AND the drawn position both at the door -- does it step
       through: gone holds the last frame of the exit, the root goes
       .home and the window glows come on. Scrolling back out pulls the
       drawn position off the door and hands everything back. The two
       thresholds are far apart so the edge cannot flutter. */
    var dh = Math.abs(heroWorld - wantWorld), de = Math.abs(eff - wantWorld);
    var gone = beat.enter ? (heroGone ? dh < 46 && de < 34 : dh < 12 && de < 9) : false;
    if(gone !== heroGone){
      heroGone = gone;
      el.classList.toggle("gone", gone);
      document.documentElement.classList.toggle("home", gone);
    }
  }

  /* ---- captions ----
     One block of words at a time. Whichever caption is nearest the focus
     owns the frame, and only if the focus is actually inside its reach,
     so between beats the picture is allowed to be silent. This is what
     keeps two headlines from ever stacking on each other. */
  var reach = Math.max(vpw * 0.55, 460);
  var best = -1, bestd = 1e9, dd;
  for(ci = 0; ci < caps.length; ci++){
    dd = Math.abs(caps[ci].x - focus);
    if(dd < bestd){ bestd = dd; best = ci; }
  }
  for(ci = 0; ci < caps.length; ci++){
    var cp = caps[ci], dist = Math.abs(cp.x - focus);
    var on = ci === best && dist < reach;
    if(on !== cp.on){ cp.on = on; cp.el.classList.toggle("on", on); }
    if(dist > reach * 2.4) continue;
    if(!cp.w) measureCap(cp);
    var xy = placeCap(cp);
    cp.el.style.transform = "translate3d(" + f(xy[0]) + "px," + f(xy[1]) + "px,0)";
  }

  /* ---- late sheets ----
     A punchline is never on the wall before the words that land it, so a
     sheet with a rev is held back until the focus has passed it. The
     switch sits on the same line as the caption hand-over, which puts the
     paper up in the same move that the words come in. */
  for(ci = 0; ci < lateArts.length; ci++){
    var la = lateArts[ci];
    var up = (la.rev == null || focus >= la.rev) &&
             (la.gone == null || focus < la.gone);
    if(up !== la.up){ la.up = up; la.el.classList.toggle("up", up); }
  }

  window.__journey = {progress:p, x:X, scene:sceneAt(focus)};

  if(progEl){
    progEl.style.width = (p * 100).toFixed(2) + "%";
    var pv = p > 0.03;
    if(pv !== progOn){ progOn = pv; progEl.classList.toggle("on", pv); }
  }

  var settled = Math.abs(targetX - X) < 0.05 && Math.abs(vel) < 0.02;
  if(settled && !dirty){ running = false; writeMetrics(); return; }
  dirty = false;
  requestAnimationFrame(frame);
}

function kick(){
  dirty = true;
  if(!running){ running = true; requestAnimationFrame(frame); }
}

scrollEl.addEventListener("scroll", kick, {passive:true});
/* the skip chip stays on the paper: it rides the scroll to the end of
   the story instead of leaving for another page. The camera's own
   easing turns the jump into a fast riffle through the set, and with
   reduced motion the engine already lands it in one frame. The href
   still points at classic.html so the chip keeps working without JS. */
(function(){
  var sk = document.querySelector("a.skip");
  if(!sk) return;
  sk.addEventListener("click", function(ev){
    ev.preventDefault();
    lockP = -1;
    scrollEl.scrollTop = Math.max(1, docH - vh);
    kick();
  });
})();
window.addEventListener("resize", function(){ layout(); kick(); writeMetrics(); });
window.addEventListener("orientationchange", function(){ setTimeout(function(){ layout(); kick(); }, 140); });

/* paper grain, one generated tile, no network */
(function(){
  try{
    var c = document.createElement("canvas");
    c.width = c.height = 64;
    var g = c.getContext("2d"), im = g.createImageData(64, 64), r = rng(4242), n;
    for(n = 0; n < im.data.length; n += 4){
      var v = 219 + Math.floor(r() * 36);
      if(r() > 0.986) v = 180 + Math.floor(r() * 30);
      im.data[n] = im.data[n + 1] = im.data[n + 2] = v;
      im.data[n + 3] = 255;
    }
    g.putImageData(im, 0, 0);
    var url = "url(" + c.toDataURL() + ")";
    document.getElementById("grain").style.setProperty("--grain", url);
    document.getElementById("grainB").style.setProperty("--grain", url);
  }catch(e){ /* grain is decoration only */ }
})();

/* =================================================================
   12. METRICS, for verification rather than for the reader
   ================================================================= */
function writeMetrics(){
  var out = [], j;
  var fx = X + (vw / u) * 0.34, onc = [];
  for(j = 0; j < caps.length; j++) if(caps[j].on) onc.push(f(caps[j].x));
  out.push("X=" + f(X) + " focus=" + f(fx) + " scene=" + sceneAt(fx) +
    " L=" + f(lightAt(fx) * 100) / 100 + " indoor=" + f(indoorAt(fx) * 100) / 100 +
    " hero=" + (heroKeyOn || "none") + " capsOn=[" + onc.join(" ") + "]");
  out.push("docH=" + docH + "px  vh=" + vh + "  screens=" + f(docH / vh) +
  "  scrollTop=" + Math.round(scrollEl.scrollTop) + "  maxScroll=" + Math.max(1, docH - vh));
  out.push("worldSpan=" + WORLD_SPAN + "  cameraStop=" + f(mapEnd) +
    "  costTotal=" + f(costTotal) + "  u=" + f(u * 100) / 100);
  out.push("screensOfWorldPerScreenOfScroll=" +
    f((mapEnd / (docH / vh)) / (vw / u) * 100) / 100);
  for(j = 0; j < TIMELINE.length; j++){
    var s = TIMELINE[j], c0 = costAt(starts[j]), c1 = costAt(starts[j] + s.span);
    var line = s.id + " weight=" + f((c1 - c0) / costTotal * 1000) / 10 + "%";
    var dw = null, i;
    for(i = 0; i < (s.rate || []).length; i++) if(s.rate[i][2] > 1) dw = s.rate[i];
    if(dw){
      var d0 = costAt(starts[j] + dw[0]), d1 = costAt(starts[j] + dw[1]);
      line += " dwell=" + f((d1 - d0) / (c1 - c0) * 1000) / 10 + "%";
    }
    out.push(line);
  }
  metricsEl.textContent = out.join("\n");
}

/* =================================================================
   13. BOOT
   ?p= sets the real scroll position and then gets out of the way, and
   the first frame is painted synchronously so a headless capture can
   never photograph a blank or half settled stage.
   ================================================================= */

if("scrollRestoration" in history) history.scrollRestoration = "manual";
layout();

/* the deep link sets the real scroll position and then gets out of the
   way. Nothing overrides progress afterwards, so the page stays in sync
   with the scrollbar from the first pixel the reader moves it. */
var p0 = parseFloat(q.get("p"));
var pp = Number.isFinite(p0) ? clamp(p0, 0, 1) : 0;
scrollEl.scrollTop = Math.round(pp * Math.max(1, docH - vh));
keepP = pp;
if(Number.isFinite(p0)) lockP = pp;
["wheel", "touchstart", "keydown", "pointerdown"].forEach(function(ev){
  window.addEventListener(ev, function(){ lockP = -1; }, {passive:true, once:true});
});
X = targetX = Math.min(worldAt(clamp(scrollEl.scrollTop / Math.max(1, docH - vh), 0, 1)), xMax);
heroWorld = 0;
prevEff = X + (vw / u) * 0.34;
/* paint now, in this tick, so a headless capture is never blank */
running = true;
dirty = true;
frame();
writeMetrics();
if(RM) document.documentElement.classList.remove("boot");
else requestAnimationFrame(function(){
  document.documentElement.classList.remove("boot");
  world.classList.add("tr");
});

})();
</script>

<!-- The room tone. Every sound in it is synthesised on the spot: the
     file fetches nothing, and nothing at all is built until the reader
     presses the tag, because the audio clock may only be started from a
     real click. -->
<script src="v2/assets/ambient.js"></script>
<script>
(function(){
"use strict";

/* which bed each stretch of the road plays under. Neighbours share a
   bed on purpose: the crossfade is two seconds, and a street that is
   one walk should not be four rooms. */
var BED = {
  title:"childhood_day", age6:"childhood_day", age12:"gaming_night",
  flight:"flight", newyork:"new_york", potato:"campus_day",
  kid2019:"childhood_day", uber:"office_day", doordash:"office_day",
  affirm:"office_day", night:"night_build", kdm:"winter",
  kid2024:"winter", ainative:"campus_day",
  loadout:"campus_day", hypermark:"studio",
  cinema:"theater", end:"end_meadow"
};

var tag = document.getElementById("sndTag");
if(!tag) return;
if(typeof createAmbient !== "function"){ tag.className += " off"; return; }

var amb = createAmbient();           /* no audio clock is made here */
if(!amb.supported()){ tag.className += " off"; return; }

function sceneNow(){
  var j = window.__journey;
  return (j && BED[j.scene]) || "childhood_day";
}

/* the opening bed is only remembered, not played: while the sound is
   off this hands the key over and makes no noise */
amb.start(sceneNow());

/* the one gesture. This is the only path that reaches setEnabled, and
   it is a click, which is what the audio clock needs to be born. */
tag.addEventListener("click", function(){
  amb.setEnabled(!amb.enabled());
  tag.setAttribute("aria-pressed", amb.enabled() ? "true" : "false");
});

/* the road drives the sound. One read a frame, and the bed is only
   asked to change when the reader has walked into a new one. */
var last = null;
(function pump(){
  var key = sceneNow();
  if(key !== last){ last = key; amb.setChapter(key); }
  requestAnimationFrame(pump);
})();

window.__ambient = amb;
})();
</script>
</body>
