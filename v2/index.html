/* the picture house at the end of the street. The name is cut into the
   canopy well above the screen, because the screen is a real frame the
   reader can start, and nothing of ours may sit on top of it. */
P.marquee = function(p){
  var x = p.x, w = p.w, base = FLOOR + 6, top = base - 430, i, out = "";
  out += one(cutRect(x, top, w, base - top, 2.8, p.seed, 40), "f-plum", 10, 11);
  /* the canopy: one wide sheet with a row of bulbs along its lip */
  var ct = top - 18, cb = ct + 92;
  out += one(cut([[x - 34, cb],[x + w + 34, cb - 4],[x + w + 14, ct],[x - 14, ct + 4]], 2.6, p.seed + 1, 28), "f-cream", 9, 10);
  var bulbs = "";
  for(i = 0; i * 46 < w + 60; i++) bulbs += '<circle cx="' + f(x - 26 + i * 46) + '" cy="' + f(cb + 2) + '" r="5"/>';
  out += '<g class="f-gold">' + bulbs + "</g>";
  /* The name of the film is set 40 units right of the middle of the
     canopy, not on it, and it is cut at 28 and not at 34.
     At the stop where this beat is read the canopy runs across the top
     of the frame, and it has to pass between two things: the block of
     words, which is pinned to the left, and the two paper tabs in the
     top right corner. On a 1280 stage that lane is only 487 wide, which
     34 point letters do not fit through. 28 clears both sides at every
     stage width. On a phone the frame holds only half this front, and
     40 units the wrong way would push the name off the right edge, so
     the .lb rule slides the pair back. The canopy itself is one flat
     sheet and does not care where on it the type sits. */
  var tg = fitLabel(x + w / 2 + 40, ct + 46, COPY.cinema, 28, w - 90, "sgn", "#3a2e28") +
           fitLabel(x + w / 2 + 40, ct + 74, COPY.cinemaSub, 18, w - 90, "sgb", "#6b543f");
  out += '<g class="mqt">' + tg + "</g>";
  /* the ticket booth and the doors, both under the pinned screen */
  var bx = x + w - 176;
  out += one(cutRect(bx, base - 156, 132, 156, 2, p.seed + 10, 18), "f-cream2", 7, 8);
  out += one(cutRect(bx + 16, base - 132, 100, 62, 1.6, p.seed + 11, 12), "f-glass", 0, 0);
  out += one(cutRect(bx + 4, base - 172, 124, 24, 1.4, p.seed + 12, 12), "f-red", 4, 5);
  var dx = x + 30;
  for(i = 0; i < 2; i++){
    out += one(cutRect(dx + i * 76, base - 148, 64, 148, 1.8, p.seed + 20 + i, 14), "f-brown2", 4, 5);
    out += '<g class="f-gold"><path d="' + cutDisc(dx + i * 76 + (i ? 12 : 52), base - 74, 4.4, 0.8, p.seed + 30 + i, 8) + '"/></g>';
  }
  return out;
};

/* --- the growth track -------------------------------------------------
   The Affirm beat gets a rollercoaster cut from paper, in the shape the
   numbers actually make: a long flat run at nothing much, then a blade
   that goes almost straight up. It starts at a "$0" board on a stake
   and ends on a crest marked "$10B", with a small car parked on top.
   The rail is uncovered from the left as the traveller walks the beat,
   through a clip rectangle the loop widens, so the line is drawn rather
   than simply present. */

P.growthtrack = function(p){
  var x = p.x, w = p.w;
  var y0 = p.y0 == null ? 596 : p.y0, y1 = p.y1 == null ? 330 : p.y1;
  var rise = y0 - y1, n = 60, i, t, out = "";
  function ry(tt){
    /* nothing for the first two fifths, then a climb that gets steeper
       the whole way up. The small waver on the flat run keeps it a
       ride cut from paper instead of a chart line drawn with a rule. */
    var lift = Math.pow(clamp((tt - 0.42) / 0.58, 0, 1), 2);
    return y0 - rise * lift - Math.sin(tt * Math.PI * 3.4) * 5 * (1 - lift);
  }
  var top = [], bot = [], posts = "", ties = "";
  for(i = 0; i <= n; i++){
    t = i / n;
    top.push([x + w * t, ry(t) - 9]);
    bot.push([x + w * t, ry(t) + 9]);
  }
  /* gap: a stretch of the run, as a pair of fractions along it, with no
     legs under it, so the trestle never stands a row of posts across a
     sign that has to be read */
  var gp = p.gap || null;
  for(i = 5; i < n; i += 6){
    t = i / n;
    var qx = x + w * t, qy = ry(t) + 5;
    if(FLOOR + 6 - qy < 14) continue;
    if(gp && t > gp[0] && t < gp[1]) continue;
    posts += '<path d="' + cutRect(qx - 6, qy, 12, FLOOR + 6 - qy, 1.4, p.seed + 40 + i, 30) + '"/>';
  }
  out += '<g class="f-kraft3" style="opacity:.92">' + posts + "</g>";
  bot.reverse();
  out += one(cut(top.concat(bot), 1.5, p.seed, 8), "f-red2", 5, 7);
  for(i = 1; i < n; i += 2){
    t = i / n;
    ties += '<path d="' + cutRect(x + w * t - 3, ry(t) - 13, 6, 26, 0.9, p.seed + 200 + i, 4) + '"/>';
  }
  out += '<g class="f-kraft2" style="opacity:.8">' + ties + "</g>";

  /* the car, parked on the crest */
  var cx = x + w * 0.985, cy = ry(0.985) - 12;
  out += one(cut([[cx - 26, cy - 26],[cx + 26, cy - 30],[cx + 30, cy],[cx - 30, cy]], 1.6, p.seed + 9, 8), "f-gold", 4, 5);
  out += '<g class="f-ink" style="opacity:.85"><path d="' + cutDisc(cx - 15, cy + 5, 6, 1, p.seed + 10, 9) +
    '"/><path d="' + cutDisc(cx + 15, cy + 5, 6, 1, p.seed + 11, 9) + '"/></g>';

  /* the crest plaque, revealed with the rail it belongs to. It hangs
     over the top of the blade, where no walker and no caption reaches. */
  var lx = x + w * 0.9, ly = y1 - 112;
  out += one(cutRect(lx - 80, ly, 160, 66, 1.8, p.seed + 12, 12), "f-cream", 6, 7);
  out += label(lx, ly + 50, "$10B", 44, "sgn", "#93412f");

  var head = '<clipPath id="trkClip" clipPathUnits="userSpaceOnUse">' +
    '<rect id="trkRect" x="' + f(x - 80) + '" y="-700" width="0" height="2400"/></clipPath>';
  /* The start board is never hidden: the ride has to begin somewhere,
     and the number it begins at is half the point. It is carried on a
     stake up out of the walking band, because at rail height the man
     walking the beat stands in front of it. */
  var sx = x + 4, start = one(cutRect(sx - 4, y0 - 118, 12, 122, 1.2, p.seed + 21, 12), "f-kraft3", 4, 5) +
    one(cutRect(sx - 52, y0 - 172, 108, 60, 1.6, p.seed + 20, 10), "f-cream", 5, 6) +
    label(sx + 2, y0 - 128, "$0", 40, "sgn", "#6b543f");
  return head + '<g clip-path="url(#trkClip)">' + out + "</g>" + start;
};

/* =================================================================
   4. THE HERO
   Rebuilt as a real chain. The old rig hung every limb off the same
   pair of shared origins, so a rotated torso tore the arms off it.
   Now the hierarchy IS the skeleton:

     rig
       legB  -> shB                  (hip -> knee)
       torso -> armB -> fArmB        (hip -> shoulder -> elbow)
                head                 (neck)
                armF -> fArmF
       legF  -> shF

   Both legs pivot on the hip point; the torso pivots on the SAME hip
   point, so rotating the torso can never open a gap there. Every limb
   carries a cut paper disc centred exactly on its own pivot, and a
   disc centred on a rotation origin is rotation invariant, so no seam
   can appear at any frame. One local unit = one world unit at scale 1.
   ================================================================= */

var FOOTY = 158, KNEEY = 126, HIPY = 92, SHY = 50, NECKY = 44, CX = 80;
var THIGH = 34, SHIN = 32, UARM = 26, FARM = 24;

var FORMS = {
  /* the toddler walks past the cream house front, so cream legs would
     leave a shirt floating in mid air. He wears the same blue as the
     child he becomes, which also makes the growth read as one person. */
  baby:   {sc:0.50, hr:17, tw:13, lw:7.6, aw:6.6, fy:118,
           top:"f-gold",  bot:"f-blue3",  hair:"f-brown",  skin:"f-kraft"},
  child:  {sc:0.58, hr:17, tw:14, lw:8.0, aw:6.6, fy:158,
           top:"f-teal",  bot:"f-blue3",  hair:"f-brown2", skin:"f-kraft"},
  teen:   {sc:0.74, hr:16, tw:15, lw:8.4, aw:6.8, fy:158,
           top:"f-red2",  bot:"f-blue4",  hair:"f-brown2", skin:"f-kraft"},
  /* the grown up wears warm paper on purpose: a navy shirt vanishes
     into navy hills and night windows, and the hero must read against
     every backdrop in the story. */
  adult:  {sc:0.85, hr:15, tw:16, lw:8.8, aw:7.0, fy:158,
           top:"f-red",   bot:"f-blue4",  hair:"f-ink",    skin:"f-kraft"},
  parent: {sc:0.85, hr:15, tw:16, lw:8.8, aw:7.0, fy:158, stroller:1,
           top:"f-red",   bot:"f-blue4",  hair:"f-ink",    skin:"f-kraft"},
  /* the same walk with a second child in it: the older one on foot
     between his parents, the younger one still in the wagon. He is the
     child form shrunk to the height of a five year old standing next
     to a grown up, and he keeps the child colours so the boy who ran
     down the first street is recognisably the boy who is walking now. */
  family: {sc:0.85, hr:15, tw:16, lw:8.8, aw:7.0, fy:158, stroller:1,
           top:"f-red",   bot:"f-blue4",  hair:"f-ink",    skin:"f-kraft",
           kid:{ox:-40, k:0.682, hr:17, tw:14, lw:8.0, aw:6.6,
                top:"f-teal", bot:"f-blue3", hair:"f-brown2", skin:"f-kraft"}}
};

/* seat and desk heights fall out of the puppet: seated, the hip rests
   at shin height, so the chair can never be guessed wrong */
function seatOf(k){ return Math.round(FLOOR - SHIN * FORMS[k].sc); }

/* one limb segment: a tapered paper strip with a joint disc at each end.
   The disc at (jx,jy) sits exactly on the rotation origin. */
function seg(jx, jy, len, half, seed, cls){
  var body = cut([[jx - half, jy],[jx + half, jy],
                  [jx + half * 0.84, jy + len],[jx - half * 0.84, jy + len]], 1.1, seed, 6);
  return sheet([cutDisc(jx, jy, half * 1.06, 0.8, seed + 3, 11),
                body,
                cutDisc(jx, jy + len, half * 0.92, 0.8, seed + 5, 11)], cls, 0, 0);
}
function org(x, y){ return ' style="transform-origin:' + f(x) + 'px ' + f(y) + 'px"'; }

/* the whole figure, in its own local frame, offset by ox.
   swap flips the limb var assignment so a companion walking beside the
   hero is out of phase with him instead of marching in lockstep.
   k shrinks the whole figure about its own feet, so a shorter person
   can stand on the same ground line as the others. Every joint height,
   every limb length and every thickness is computed from k rather than
   wrapped in a scale transform: the poses are CSS rotations with an
   explicit transform-origin, and a nested scale would move the origins
   out from under them. At k = 1 the numbers come out at 158 / 126 / 92
   / 50 / 44 again, so the four figures that were here before are drawn
   exactly as they were. */
function puppet(ox, F, swap, seed, k){
  var hx = CX + ox, s = seed || 900, K = k || 1;
  var A = swap ? ["legF","shF","armF","fArmF"] : ["legB","shB","armB","fArmB"];
  var B = swap ? ["legB","shB","armB","fArmB"] : ["legF","shF","armF","fArmF"];
  /* joints, measured up from the feet */
  var FT = FOOTY,
      KN = FOOTY - (FOOTY - KNEEY) * K,
      HP = FOOTY - (FOOTY - HIPY) * K,
      SD = FOOTY - (FOOTY - SHY) * K,
      NK = FOOTY - (FOOTY - NECKY) * K;
  var TH = THIGH * K, SN = SHIN * K, UA = UARM * K, FA = FARM * K;
  var hr = F.hr * K, tw = F.tw * K, lw = F.lw * K, aw = F.aw * K;
  var hy = NK - hr + K;

  function leg(cn, sn, sd, cls){
    return '<g class="' + cn + '"' + org(hx, HP) + '>' +
      seg(hx, HP, TH, lw, sd, cls) +
      '<g class="' + sn + '"' + org(hx, KN) + '>' +
        seg(hx, KN, SN, lw * 0.9, sd + 11, cls) +
        one(cut([[hx - lw, FT - 4 * K],[hx + lw * 1.9, FT - 6 * K],
                 [hx + lw * 2.1, FT],[hx - lw * 1.1, FT + K]], 1, sd + 21, 4), "f-ink", 0, 0) +
      "</g></g>";
  }
  function arm(cn, fn, sd, cls){
    return '<g class="' + cn + '"' + org(hx, SD) + '>' +
      seg(hx, SD, UA, aw, sd, cls) +
      '<g class="' + fn + '"' + org(hx, SD + UA) + '>' +
        seg(hx, SD + UA, FA, aw * 0.9, sd + 11, cls) +
        '<g class="' + F.skin + '"><path d="' + cutDisc(hx, SD + UA + FA + 2 * K, aw * 1.15, 0.8, sd + 23, 10) + '"/></g>' +
      "</g></g>";
  }

  var torso = cut([[hx - tw * 0.92, HP + 2 * K],[hx - tw, SD + 6 * K],[hx - tw * 0.8, SD - 3 * K],
                   [hx + tw * 0.8, SD - 3 * K],[hx + tw, SD + 6 * K],[hx + tw * 0.92, HP + 2 * K]], 1.4, s + 40, 8);
  /* long hair is one sheet cut behind the head and taken down past the
     shoulder. It is laid down BEFORE the face, so the profile, the eyes
     and the smile all stay on top of it and the head still reads at the
     size a cutout figure is actually seen at. */
  var backHair = F.long ? '<g class="' + F.hair + '"><path d="' + cut([
      [hx + hr * 0.46, hy - hr * 1.16], [hx - hr * 1.02, hy - hr * 0.78],
      [hx - hr * 1.36, hy + hr * 0.58], [hx - hr * 1.24, SD + 24 * K],
      [hx - hr * 0.30, SD + 28 * K],    [hx + hr * 0.30, hy + hr * 0.88],
      [hx + hr * 0.94, hy - hr * 0.18]], 1.4, s + 56, 8) + '"/></g>' : "";
  var head = '<g class="head"' + org(hx, NK) + '>' +
    one(cutRect(hx - aw * 0.8, NK - 6 * K, aw * 1.6, 12 * K, 0.9, s + 50, 3), F.skin, 0, 0) +
    backHair +
    '<g class="' + F.skin + '"><path d="' + cutDisc(hx, hy, hr, 1.5, s + 51, 14) + '"/></g>' +
    '<g class="' + F.hair + '"><path d="' +
      cut([[hx - hr, hy + 2 * K],[hx - hr * 0.9, hy - hr * 0.9],[hx, hy - hr * 1.16],
           [hx + hr * 0.86, hy - hr * 0.78],[hx + hr * 0.66, hy - hr * 0.2],
           [hx + hr * 0.2, hy - hr * 0.5],[hx - hr * 0.5, hy - hr * 0.3]], 1.3, s + 52, 6) + '"/></g>' +
    '<g class="f-ink"><path d="' + cutDisc(hx + hr * 0.54, hy - K, 2.5 * K, 0.5, s + 53, 8) + '"/>' +
      '<path d="' + cutDisc(hx + hr * 0.08, hy - K, 2.5 * K, 0.5, s + 54, 8) + '"/></g>' +
    '<g class="f-red2" style="opacity:.34"><path d="' + cutDisc(hx + hr * 0.76, hy + hr * 0.42, hr * 0.2, 0.6, s + 55, 8) + '"/></g>' +
    '<path fill="none" stroke="#7a4a3a" stroke-width="' + f(hr * 0.14) + '" stroke-linecap="round" d="M' +
      f(hx + hr * 0.12) + " " + f(hy + hr * 0.42) + " q" + f(hr * 0.26) + " " + f(hr * 0.24) + " " + f(hr * 0.5) + " " + f(-hr * 0.06) + '"/>' +
    "</g>";

  return '<g class="rig"' + org(hx, FT) + '>' +
    leg(A[0], A[1], s + 100, F.bot) +
    '<g class="torso"' + org(hx, HP) + '>' +
      arm(A[2], A[3], s + 200, F.top) +
      sheet([cutDisc(hx, HP, tw * 0.92, 1, s + 41, 12), torso], F.top, 0, 0) +
      one(cut([[hx - tw * 0.94, HP - 12 * K],[hx + tw * 0.94, HP - 12 * K],
               [hx + tw * 0.92, HP + 3 * K],[hx - tw * 0.92, HP + 3 * K]], 1.1, s + 42, 5), F.bot, 0, 0) +
      head +
      arm(B[2], B[3], s + 300, F.top) +
    "</g>" +
    leg(B[0], B[1], s + 400, F.bot) +
  "</g>";
}

/* the stroller is a prop the parent pushes, cut from the same paper and
   parked in front of the hands so the walk still reads */
function stroller(F){
  var x = CX + 74, base = FOOTY, s = 1700, out = "";
  out += '<g class="f-ink" style="opacity:.9"><path d="' + cutDisc(x + 6, base - 9, 10, 1.1, s, 12) + '"/>' +
    '<path d="' + cutDisc(x + 52, base - 9, 10, 1.1, s + 1, 12) + '"/></g>';
  out += one(cut([[x - 4, base - 62],[x + 58, base - 70],[x + 60, base - 34],[x + 8, base - 26]], 1.6, s + 2, 8), "f-red2", 5, 6);
  out += one(cut([[x + 2, base - 74],[x + 44, base - 82],[x + 46, base - 60],[x + 4, base - 54]], 1.5, s + 3, 6), "f-cream2", 4, 4);
  /* one arm is up over the rim of the wagon and stays up. A baby holds
     a hand out of a pram at every age, and at the end of the road, when
     the other three turn and wave, it means the fourth of them is
     waving too without a rig of its own. */
  out += '<g class="' + F.skin + '"><path d="' +
    cut([[x + 15, base - 74],[x + 5, base - 90],[x - 1, base - 88],[x + 9, base - 70]], 1, s + 7, 5) + '"/>' +
    '<path d="' + cutDisc(x + 1, base - 92, 4.4, 0.7, s + 8, 9) + '"/></g>';
  out += '<g class="' + F.skin + '"><path d="' + cutDisc(x + 24, base - 84, 9, 1, s + 4, 10) + '"/></g>';
  /* the push bar ends at the hands, not in the air above them. Across
     the walk the hand disc travels between x 60 and 86 at y 98 to 101,
     so the bar is laid along that line and the grip is never broken. */
  out += '<g stroke="#3a2e28" stroke-width="4" fill="none" style="opacity:.85"><path d="' +
    cutLine(x - 4, base - 66, CX + 2, base - 57, 1.2, s + 5, 14) + '"/><path d="' +
    cutLine(x + 8, base - 28, x + 54, base - 34, 1.2, s + 6, 14) + '"/></g>';
  return out;
}

/* --- poses ---------------------------------------------------------- */

var V = ["by","rr","ta","ha","l1","s1","l2","s2","a1","e1","a2","e2"];

/* six stepped walk frames. The knee only ever folds backward. */
var WALK = [], wi;
for(wi = 0; wi < 6; wi++){
  var wa = wi / 6 * TAU;
  WALK.push({
    by: -1.4 - 1.4 * Math.cos(2 * wa),
    rr: 0,
    ta: 2 * Math.sin(2 * wa),
    ha: -1.6 * Math.sin(2 * wa),
    l1: -30 * Math.sin(wa),
    s1: 24 + 24 * Math.sin(wa + 2.4),
    l2: -30 * Math.sin(wa + Math.PI),
    s2: 24 + 24 * Math.sin(wa + Math.PI + 2.4),
    a1: 20 * Math.sin(wa),
    e1: -16 - 10 * Math.sin(wa),
    a2: 20 * Math.sin(wa + Math.PI),
    e2: -16 - 10 * Math.sin(wa + Math.PI)
  });
}

/* the first walk. He is upright, never on hands and knees: short flat
   footed steps, knees that never quite straighten, both arms held out
   for balance, and the whole rig rocking a little side to side. That
   rock is what makes it read as a toddler rather than a small adult. */
var TODDLE = [], ci;
for(ci = 0; ci < 6; ci++){
  var td = ci / 6 * TAU;
  TODDLE.push({
    by: -0.9 - 1.1 * Math.cos(2 * td),
    rr: 3.6 * Math.sin(td),
    ta: -5 + 2.4 * Math.sin(2 * td),
    ha: 3 - 3.2 * Math.sin(td),
    l1: -17 * Math.sin(td),
    s1: 21 + 16 * Math.sin(td + 2.4),
    l2: -17 * Math.sin(td + Math.PI),
    s2: 21 + 16 * Math.sin(td + Math.PI + 2.4),
    a1: -76 - 10 * Math.sin(td),
    e1: 18 + 8 * Math.sin(td),
    a2: -66 + 10 * Math.sin(td),
    e2: 14 - 8 * Math.sin(td)
  });
}

/* seated: the rig drops so the hip lands on the seat, the thighs go
   flat and the shins drop straight to the floor */
var SIT = {by: THIGH, rr:0, ta:-4, ha:3, l1:-90, s1:90, l2:-84, s2:84,
           a1:-45, e1:-48, a2:-38, e2:-42};
var WAVE = {by:0, rr:0, ta:-2, ha:-4, l1:-9, s1:6, l2:12, s2:16,
            a1:-152, e1:26, a2:14, e2:-20};
var STAND = {by:0, rr:0, ta:0, ha:0, l1:-7, s1:4, l2:9, s2:12,
             a1:-9, e1:-14, a2:11, e2:-18};

/* --- the puppets, built once, swapped by form ----------------------- */

var heroWrap = null, HERO = {}, heroKey = "";
function buildHeroes(){
  var keys = ["baby","child","teen","adult","parent","family"], n, out = "";
  for(n = 0; n < keys.length; n++){
    var k = keys[n], F = FORMS[k], pal;
    for(pal = 0; pal < 2; pal++){
      if(pal && (k === "baby" || k === "child" || k === "teen")) continue;
      var id = k + (pal ? "-pal" : "");
      var sh = '<g class="f-ink" style="opacity:.17"><path d="' +
        cutDisc(CX, F.fy + 3, F.tw * 1.5, 1.4, 1500 + n, 14) + '"/></g>';
      var body = "";
      if(pal){
        body += '<g class="f-ink" style="opacity:.13"><path d="' +
          cutDisc(CX - 74, F.fy + 3, F.tw * 1.3, 1.4, 1560, 14) + '"/></g>';
        body += puppet(-74, {sc:F.sc, hr:16, tw:15, lw:8.2, aw:6.6, long:1,
          top:"f-plum", bot:"f-blue4", hair:"f-brown2", skin:"f-kraft"}, 1, 1900);
      }
      /* the older child walks between the two of them, laid down after
         his mother and before his father, so the row overlaps the way a
         row of people actually does. He takes his father's phase, which
         leaves him out of step with the figure standing next to him. */
      if(F.kid){
        body += '<g class="f-ink" style="opacity:.13"><path d="' +
          cutDisc(CX + F.kid.ox, F.fy + 3, F.kid.tw * F.kid.k * 1.5, 1.3, 1580, 13) + '"/></g>';
        body += puppet(F.kid.ox, F.kid, 0, 2100, F.kid.k);
      }
      body += sh + puppet(0, F, 0, 900 + n * 7);
      if(F.stroller) body += stroller(F);
      out += '<svg class="hero" id="hero-' + id + '" viewBox="0 0 200 176" ' +
        'aria-hidden="true" focusable="false" preserveAspectRatio="xMidYMax meet">' + body + "</svg>";
      HERO[id] = null;
    }
  }
  heroWrap.innerHTML = out;
  var key;
  for(key in HERO) if(Object.prototype.hasOwnProperty.call(HERO, key)) HERO[key] = document.getElementById("hero-" + key);
}

function setPose(el, p){
  var k;
  for(k = 0; k < V.length; k++){
    var v = V[k];
    el.style.setProperty("--" + v, f(p[v] || 0) + (v === "by" ? "px" : "deg"));
  }
}

/* =================================================================
   5. BUILD: TIMELINE -> DOM, once, at load
   ================================================================= */

var VPW = 1000;
/* the set is built for a 1000 unit wide frame. Past this many pixels the
   stage stops growing and is centred instead, so an ultrawide window can
   not show so much world at once that the opening scene is already gone. */
var STAGE_MAX = 1920;
var DEPTHS = [{k:"sky",d:0.05},{k:"far",d:0.18},{k:"mid",d:0.44},
              {k:"near",d:0.72},{k:"ground",d:1.00},{k:"fg",d:1.20}];

var stage = document.getElementById("stage");
var world = document.getElementById("world");
var uiHost = document.getElementById("ui");
var tintEl = document.getElementById("tint");
var skyfill = document.getElementById("skyfill");
var glowLayer = document.getElementById("glowLayer");
var celestWrap = document.getElementById("celestWrap");
var skyLights = document.getElementById("skyLights");
var starHost = document.getElementById("starHost");
var sunBox = document.getElementById("sunBox");
var moonBox = document.getElementById("moonBox");
var spacer = document.getElementById("spacer");
var scrollEl = document.getElementById("scroll");
var frameEl = document.getElementById("frame");
var metricsEl = document.getElementById("metrics");

/* how far ahead of its own beat a backdrop flat is slid in, and how far
   past the end of it the flat is still guaranteed to cover the frame */
var BAND_IN = 240, BAND_OUT = 560;
var TRK = null;

var starts = [], WORLD_SPAN = 0, i, j, n;
for(i = 0; i < TIMELINE.length; i++){ starts.push(WORLD_SPAN); WORLD_SPAN += TIMELINE[i].span; }

/* --- parallax layers ------------------------------------------------ */

var layers = [];
for(i = 0; i < DEPTHS.length; i++){
  var d = DEPTHS[i].d, K = (1 - d) * (VPW / 2);
  var el = document.createElement("div");
  el.className = "layer";
  var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "sheetsvg");
  svg.setAttribute("preserveAspectRatio", "none");
  var rec = {el:el, d:d, svg:svg, groups:[], lo:Infinity, hi:-Infinity};
  var markup = "", bandLos = [];
  for(j = 0; j < TIMELINE.length; j++){
    var scn = TIMELINE[j], list = scn.layers[DEPTHS[i].k] || [], body = "";
    /* each group records the real span of paper it holds, in this layer's
       own coordinates. Culling by scene span instead would hide the world
       spanning cardboard base the moment scene 0 fell behind the camera. */
    var glo = Infinity, ghi = -Infinity, bandLo = Infinity;
    for(n = 0; n < list.length; n++){
      var pc = list[n], painter = P[pc.t];
      if(!painter) continue;
      var abs = {}, key;
      for(key in pc) if(Object.prototype.hasOwnProperty.call(pc, key)) abs[key] = pc[key];
      if(pc.band){
        var w0 = starts[j] + pc.band.from, w1 = starts[j] + pc.band.to;
        /* A backdrop flat belongs to its own beat. It is anchored so the
           moment the camera reaches that beat the flat already fills the
           frame, and it is cut wide enough to hold the frame to the end
           of it. Anchoring the flat to the viewport instead made every
           backdrop arrive thousands of units late, so a scene wore the
           flat of the beat three beats behind it. */
        abs.x = (w0 - BAND_IN) * d;
        abs.w = VPW + 900 + (w1 - w0 + BAND_IN + BAND_OUT) * d;
        if(w0 < bandLo) bandLo = w0;
      } else if(pc.from !== undefined && pc.to !== undefined){
        /* a strip of ground is measured from the start of its own beat, so
           the running order of the beats can be changed without every road
           and every stretch of water having to be measured again */
        var gto = pc.to === "END" ? WORLD_SPAN + 700 - starts[j] : pc.to;
        abs.to = gto;
        abs.x = (starts[j] + pc.from) * d + K;
        abs.w = gto - pc.from;
      } else {
        abs.x = (starts[j] + pc.x) * d + K;
      }
      if(pc.t === "growthtrack") TRK = {x:abs.x, w:abs.w};
      body += painter(abs);
      if(abs.x < glo) glo = abs.x;
      var right = abs.x + (abs.w !== undefined ? abs.w : 0);
      if(right > ghi) ghi = right;
    }
    if(glo === Infinity){ glo = 1; ghi = 0; }
    else {
      if(glo - 340 < rec.lo) rec.lo = glo - 340;
      if(ghi + 340 > rec.hi) rec.hi = ghi + 340;
    }
    bandLos.push(bandLo < Infinity ? bandLo : null);
    markup += '<g class="scenegrp" data-lo="' + f(glo - 340) + '" data-hi="' + f(ghi + 340) + '">' + body + "</g>";
  }
  if(rec.lo === Infinity){ rec.lo = 0; rec.hi = VPW; }
  rec.lo = Math.floor(rec.lo); rec.hi = Math.ceil(rec.hi);
  svg.innerHTML = markup;
  el.appendChild(svg);
  world.appendChild(el);
  var gs = svg.querySelectorAll(".scenegrp");
  /* a flat is on stage from just before its own beat until the next flat
     in the same layer takes the frame. One in, one out, like a stagehand,
     instead of every flat this layer owns piling up behind the traveller. */
  var firstBand = -1, jj;
  for(j = 0; j < gs.length; j++){
    /* the beat this group belongs to, kept so a one shot animation can
       be started when the reader reaches that beat. A far flat is only
       compressed by its depth, so on the back layers one group can
       overlap the frame from the first pixel of the story: without this
       the aeroplane would fly its single crossing at load, hours of
       scrolling before anyone got to the beat it belongs to. */
    var gg = {el:gs[j], lo:parseFloat(gs[j].getAttribute("data-lo")),
      hi:parseFloat(gs[j].getAttribute("data-hi")), on:true, live:false,
      sc0:starts[j], sc1:starts[j] + TIMELINE[j].span};
    if(bandLos[j] !== null){
      if(firstBand < 0) firstBand = j;
      var nxt = null;
      for(jj = j + 1; jj < bandLos.length; jj++){ if(bandLos[jj] !== null){ nxt = bandLos[jj]; break; } }
      gg.wlo = (j === firstBand) ? -1e7 : bandLos[j] - BAND_IN;
      gg.whi = nxt === null ? 1e7 : nxt - BAND_IN;
      gg.dim = false;
    }
    rec.groups.push(gg);
  }
  layers.push(rec);
  if(DEPTHS[i].k === "ground"){
    heroWrap = document.createElement("div");
    heroWrap.className = "heroWrap";
    world.appendChild(heroWrap);
  }
}

/* =================================================================
   8. LIGHT, SEASON, INDOORS
   One scalar L drives the whole palette. The sky gradient is divided
   by the multiply tint first, so the sky reads as painted paper under
   the same light as everything else instead of double darkening.
   ================================================================= */

var TINT = [[255,255,255],[214,186,168],[104,110,150]];   /* day, dusk, night */
var SKY  = [[[143,182,207],[188,214,221],[240,220,184]],
            [[104,124,164],[186,150,150],[226,166,124]],
            [[ 38, 50, 84],[ 56, 70,106],[ 92, 96,128]]];
var SEASONS = {
  spring:{leaf:[125,154, 92], gr2:[142,163,100], gr3:[ 99,122, 70]},
  summer:{leaf:[106,142, 78], gr2:[126,154, 86], gr3:[ 84,110, 62]},
  fall:  {leaf:[192,124, 60], gr2:[176,142, 78], gr3:[140, 98, 52]},
  winter:{leaf:[176,182,176], gr2:[196,200,196], gr3:[150,158,158]}
};

function mix3(set, L){
  /* L: 1 day, .5 dusk, 0 night. Two segments, smooth at the join. */
  var t, a, b;
  if(L >= 0.5){ t = (L - 0.5) * 2; a = set[1]; b = set[0]; }
  else { t = L * 2; a = set[2]; b = set[1]; }
  if(a[0] instanceof Array){
    var out = [], i;
    for(i = 0; i < a.length; i++) out.push([lerp(a[i][0],b[i][0],t), lerp(a[i][1],b[i][1],t), lerp(a[i][2],b[i][2],t)]);
    return out;
  }
  return [lerp(a[0],b[0],t), lerp(a[1],b[1],t), lerp(a[2],b[2],t)];
}
function rgb(c){ return "rgb(" + Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]) + ")"; }
/* the tint sheet multiplies everything, so pre-divide the sky by it */
function pre(c, t){
  return [clamp(c[0] / Math.max(0.06, t[0] / 255), 0, 255),
          clamp(c[1] / Math.max(0.06, t[1] / 255), 0, 255),
          clamp(c[2] / Math.max(0.06, t[2] / 255), 0, 255)];
}
function mixc(a, b, t){ return [lerp(a[0],b[0],t), lerp(a[1],b[1],t), lerp(a[2],b[2],t)]; }

/* light, season and indoor state read straight off the timeline */
function lightAt(x){
  var n = TIMELINE.length - 1, s;
  for(; n >= 0; n--) if(x >= starts[n]) break;
  if(n < 0) n = 0;
  s = TIMELINE[n];
  var t = clamp((x - starts[n]) / s.span, 0, 1), k = s.light, i;
  for(i = 0; i < k.length - 1; i++){
    if(t <= k[i + 1][0]){
      var u2 = (t - k[i][0]) / Math.max(1e-6, k[i + 1][0] - k[i][0]);
      return lerp(k[i][1], k[i + 1][1], smooth(0, 1, u2));
    }
  }
  return k[k.length - 1][1];
}
function indoorAt(x){
  var n = TIMELINE.length - 1;
  for(; n >= 0; n--) if(x >= starts[n]) break;
  if(n < 0) n = 0;
  var s = TIMELINE[n], lx = x - starts[n], r = s.indoor || [], i, best = 0;
  for(i = 0; i < r.length; i++){
    var a = r[i][0], b = r[i][1], fade = 70;
    var v = Math.min(smooth(a - fade, a + fade, lx), 1 - smooth(b - fade, b + fade, lx));
    if(v > best) best = v;
  }
  return clamp(best, 0, 1);
}
/* seasons cross fade over the scene boundary so nothing snaps green */
function seasonAt(x){
  var n = TIMELINE.length - 1;
  for(; n >= 0; n--) if(x >= starts[n]) break;
  if(n < 0) n = 0;
  var cur = SEASONS[TIMELINE[n].season], t = (x - starts[n]) / TIMELINE[n].span;
  var blend = 0.22;
  if(t < blend && n > 0) return {a:SEASONS[TIMELINE[n - 1].season], b:cur, t:smooth(0, blend, t)};
  if(t > 1 - blend && n < TIMELINE.length - 1) return {a:cur, b:SEASONS[TIMELINE[n + 1].season], t:smooth(1 - blend, 1, t)};
  return {a:cur, b:cur, t:0};
}
function sceneAt(x){
  for(var n = TIMELINE.length - 1; n >= 0; n--) if(x >= starts[n]) return TIMELINE[n].id;
  return TIMELINE[0].id;
}
function beatAt(x){
  var n = TIMELINE.length - 1;
  for(; n >= 0; n--) if(x >= starts[n]) break;
  if(n < 0) n = 0;
  var s = TIMELINE[n], lx = x - starts[n], list = s.hero || [], i, pick = null;
  for(i = 0; i < list.length; i++) if(lx >= list[i].x) pick = list[i];
  if(!pick){
    /* fall back to the last beat of the last scene that had one */
    for(i = n - 1; i >= 0 && !pick; i--){
      var pl = TIMELINE[i].hero || [];
      if(pl.length) pick = pl[pl.length - 1];
    }
  }
  if(!pick) pick = {form:"none", gait:"walk"};
  if(pick.seat) return {form:pick.form, gait:pick.gait, pal:pick.pal, seat:{x:starts[n] + pick.seat.x}};
  return {form:pick.form, gait:pick.gait, pal:pick.pal, seat:null};
}

/* =================================================================
   9. THE SCROLL RATE MAP
   The page is not a constant speed dolly. Every rate zone becomes a
   run of piecewise linear cost segments: cost is what the reader
   spends in scroll, world x is what they get. mult > 1 holds the
   camera on a beat, mult < 1 throws transit away. Ease is expressed
   as data, by subdividing the ramp, so the engine stays one line.
   ================================================================= */

var SEGS = [], costTotal = 0, mapEnd = 0;

/* The map runs from 0 to the camera stop, not to the end of the paper.
   The last screen of world is the closing frame, so no scroll is spent
   pushing the camera into it. */
function buildScrollMap(){
  var raw = [], j, i;
  mapEnd = xMax > 200 ? xMax : WORLD_SPAN;
  for(j = 0; j < TIMELINE.length; j++){
    var z = TIMELINE[j].rate || [];
    for(i = 0; i < z.length; i++){
      var a = starts[j] + z[i][0], b = starts[j] + z[i][1], m = z[i][2], e = z[i][3] || 0;
      e = Math.min(e, (b - a) / 2);
      if(e > 1){
        var STEPS = 5, k;
        for(k = 0; k < STEPS; k++){
          var t0 = k / STEPS, t1 = (k + 1) / STEPS;
          raw.push([a + e * t0, a + e * t1, lerp(1, m, smooth(0, 1, (t0 + t1) / 2))]);
          raw.push([b - e * t1, b - e * t0, lerp(1, m, smooth(0, 1, (t0 + t1) / 2))]);
        }
        raw.push([a + e, b - e, m]);
      } else {
        raw.push([a, b, m]);
      }
    }
  }
  raw.sort(function(p, q2){ return p[0] - q2[0]; });

  SEGS = []; costTotal = 0;
  var cursor = 0;
  function push(x0, x1, m){
    if(x1 - x0 < 0.5) return;
    var c0 = costTotal;
    costTotal += (x1 - x0) * m;
    SEGS.push({x0:x0, x1:x1, m:m, c0:c0, c1:costTotal});
  }
  for(i = 0; i < raw.length; i++){
    if(raw[i][0] >= mapEnd) break;
    if(raw[i][0] > cursor) push(cursor, raw[i][0], 1);
    var s0 = Math.max(cursor, raw[i][0]), s1 = Math.min(raw[i][1], mapEnd);
    if(s1 > s0){ push(s0, s1, raw[i][2]); cursor = s1; }
  }
  if(cursor < mapEnd) push(cursor, mapEnd, 1);
}
/* cost -> world x, the inverse of the map */
function worldAt(p){
  var c = clamp(p, 0, 1) * costTotal, lo = 0, hi = SEGS.length - 1;
  while(lo < hi){
    var mid = (lo + hi) >> 1;
    if(SEGS[mid].c1 < c) lo = mid + 1; else hi = mid;
  }
  var s = SEGS[lo];
  if(!s) return 0;
  return clamp(s.x0 + (c - s.c0) / s.m, 0, mapEnd);
}
/* world x -> cost, used only to report the dwell metrics */
function costAt(x){
  var i;
  for(i = 0; i < SEGS.length; i++){
    var s = SEGS[i];
    if(x <= s.x1) return s.c0 + Math.max(0, x - s.x0) * s.m;
  }
  return costTotal;
}

/* =================================================================
   10. LAYOUT
   ================================================================= */

var vw = 0, vh = 0, SH = 0, STOP = 0, letterbox = false;
var u = 1, floorY = 0, docH = 1, pad = 30, xMax = 0;
var RATE = 0.50;   /* scroll cost -> pixels. Tuned so the whole story is
                      10 to 13 screens on a laptop and every beat is meaty. */

/* the reader's place in the story, kept as progress and not as pixels.
   A window resize, or a headless window that settles on its real size
   after the first paint, changes how tall the scroll track is: without
   this the page would keep the old pixel offset and quietly land on a
   different beat than the one the deep link asked for. */
var keepP = -1;
/* a deep link is authoritative until the reader takes over: the viewport
   can settle to a different height after the first paint and the browser
   shifts the scroll position with it, which would land the page on a
   different beat than the one the link asked for. */
var lockP = -1;

function layout(){
  if(docH > 1) keepP = clamp(scrollEl.scrollTop / Math.max(1, docH - vh), 0, 1);
  var vwReal = scrollEl.clientWidth || window.innerWidth;
  vh = scrollEl.clientHeight || window.innerHeight;
  letterbox = vh / vwReal > 1.12;
  /* the scenery svg is cut once, at load, so a sheet that has to sit in a
     different place on a narrow stage cannot be re painted. The flag is
     put on the stage instead and the css moves it. */
  stage.classList.toggle("lb", letterbox);
  /* Past this width the set stops growing and stands centred on the paper
     backdrop, the same way the tall phone letterband works. A wider stage
     shows more world at once, so on an ultrawide screen the camera starts
     already past the opening scene and the reader never sees the title. */
  vw = Math.min(vwReal, STAGE_MAX);
  var SX = Math.round((vwReal - vw) / 2);
  /* on a phone the diorama takes the top band and the text takes the
     rest, because 60px display letters cannot share a 375px column */
  SH = letterbox ? Math.round(Math.min(vh * 0.46, vw * 1.34)) : vh;
  STOP = letterbox ? Math.round((vh - SH) * 0.20) : 0;
  stage.style.left = SX + "px";
  stage.style.width = vw + "px";
  stage.style.right = "auto";
  stage.style.top = STOP + "px";
  stage.style.height = SH + "px";
  stage.style.bottom = "auto";
  uiHost.style.left = SX + "px";
  uiHost.style.width = vw + "px";
  uiHost.style.right = "auto";
  pad = vw < 620 ? 12 : 28;

  var WH = letterbox ? 520 : 470;
  u = letterbox ? clamp(SH / WH, 0.42, 1.6)
                : clamp(Math.min(vw / VPW * 1.18, SH / WH), 0.62, 1.7);
  floorY = Math.round(SH - clamp(SH * 0.13, 54, 118));
  /* the camera stops when the last sheet of paper reaches the right edge,
     so the closing frame is the capstone and not empty world past it */
  xMax = Math.max(0, WORLD_SPAN - vw / u);
  buildScrollMap();

  var vhMin = 11, vhMax = letterbox ? 15 : 14;
  docH = Math.round(clamp(costTotal * u * RATE, vhMin * vh, vhMax * vh) + vh);
  spacer.style.height = Math.max(0, docH - vh) + "px";   /* the sticky pane already fills one screen */
  var back = lockP >= 0 ? lockP : keepP;
  if(back >= 0) scrollEl.scrollTop = Math.round(back * Math.max(1, docH - vh));

  var li, ci;
  for(li = 0; li < layers.length; li++){
    var lay = layers[li], wUnits = lay.hi - lay.lo;
    lay.svg.setAttribute("viewBox", lay.lo + " 0 " + wUnits + " " + WORLDH);
    lay.svg.style.left = f(lay.lo * u) + "px";
    lay.svg.style.width = f(wUnits * u) + "px";
    lay.svg.style.height = f(WORLDH * u) + "px";
    lay.svg.style.top = f(floorY - FLOOR * u) + "px";
  }
  for(ci = 0; ci < glowEls.length; ci++){
    var ge = glowEls[ci];
    ge.el.style.width = f(ge.r * 2 * u) + "px";
    ge.el.style.height = f(ge.r * 2 * u) + "px";
  }
  var cs = Math.max(0.9, u), sz = f(160 * cs), hz = f(380 * cs);
  ["sun", "moon"].forEach(function(id){
    var e = document.getElementById(id);
    e.style.width = sz + "px"; e.style.height = sz + "px";
    e.style.left = f(-80 * cs) + "px"; e.style.top = f(-80 * cs) + "px";
  });
  ["sunHalo", "moonHalo"].forEach(function(id){
    var e = document.getElementById(id);
    e.style.width = hz + "px"; e.style.height = hz + "px";
    e.style.left = f(-190 * cs) + "px"; e.style.top = f(-190 * cs) + "px";
  });
  /* a pinned print is sized in world units like every other object in
     the set, so it grows and shrinks with the paper around it */
  for(ci = 0; ci < arts.length; ci++){
    var ar = arts[ci], AW = ar.w * u, AH = ar.h * u;
    ar.el.style.width = f(AW) + "px";
    ar.el.style.height = f(AH) + "px";
    /* a phone frame holds half as much world, so a wide sheet is nudged
       along the set to stay on the paper instead of half off the edge */
    ar.el.style.left = f((ar.x + (letterbox ? ar.mx : 0)) * u) + "px";
    ar.el.style.top = f(floorY - (FLOOR - ar.y) * u) + "px";
    ar.el.style.setProperty("--pad", f(clamp(AW * 0.05, 5, 17)) + "px");
    ar.el.style.setProperty("--fs", f(clamp(AH * 0.105, 11, 27)) + "px");
    ar.el.style.setProperty("--ms", f(clamp(AH * 0.072, 9, 17)) + "px");
    ar.el.style.setProperty("--os", f(clamp(AH * 0.068, 9, 15)) + "px");
    /* a stake so a sign standing in the open reads as planted, not
       floating. It runs from the foot of the mount to the floor line. */
    if(ar.leg) ar.el.style.setProperty("--leg",
      f(Math.max(0, floorY - (floorY - (FLOOR - ar.y) * u) - AH)) + "px");
  }
  for(ci = 0; ci < caps.length; ci++) measureCap(caps[ci]);
  drawFrame();
  dirty = true;
}

/* a caption is measured while briefly visible, then hidden again, so
   an off screen strip is never a focus trap and never a layout guess */
function measureCap(cp){
  var was = cp.el.classList.contains("on");
  if(!was) cp.el.style.visibility = "hidden";
  cp.el.style.display = "block";
  cp.w = cp.el.offsetWidth;
  cp.h = cp.el.offsetHeight;
  if(!was) cp.el.style.visibility = "";
}

function drawFrame(){
  var b = vw < 620 ? 7 : 13;
  var outer = "M0 0H" + vw + "V" + SH + "H0Z";
  var inner = cut([[b, b], [vw - b, b], [vw - b, SH - b], [b, SH - b]], vw < 620 ? 1.6 : 2.6, 909, 40);
  frameEl.setAttribute("viewBox", "0 0 " + vw + " " + SH);
  frameEl.setAttribute("width", vw);
  frameEl.setAttribute("height", SH);
  frameEl.innerHTML = '<path class="fsh" fill-rule="evenodd" d="' + outer + inner + '" transform="translate(3,4)"/>' +
    '<path fill-rule="evenodd" d="' + outer + inner + '"/>';
}

var lastL = -1, lastIndoor = -1, lastSeason = "";
function applyLight(L, x){
  if(Math.abs(L - lastL) > 0.0015){
    lastL = L;
    var tint = mix3(TINT, L), sky = mix3(SKY, L);
    tintEl.style.backgroundColor = rgb(tint);
    skyfill.style.setProperty("--sky-a", rgb(pre(sky[0], tint)));
    skyfill.style.setProperty("--sky-b", rgb(pre(sky[1], tint)));
    skyfill.style.setProperty("--sky-c", rgb(pre(sky[2], tint)));
    var night = clamp((0.55 - L) / 0.5, 0, 1);
    glowLayer.style.setProperty("--night", f(night * 100) / 100);
    var so = clamp((0.42 - L) / 0.3, 0, 1);
    starHost.style.setProperty("--star-op", f(so * 100) / 100);
    starHost.classList.toggle("live", so > 0.05);
    /* one disc at a time, and the two ranges do not touch: the stagehand
       has the moon fully off the set before the sun is pushed on, so no
       frame is ever lit by both */
    var sunOn = clamp((L - 0.52) / 0.16, 0, 1);
    var moonOn = clamp((0.46 - L) / 0.16, 0, 1);
    sunBox.style.opacity = f(sunOn * 100) / 100;
    sunBox.style.display = sunOn < 0.01 ? "none" : "block";
    /* the sun rides down and turns over as the day goes: high and pale
       gold at noon, low and orange at dusk. Without this it hangs in
       the top corner at full height while the sky underneath is pink,
       and the multiply tint drains it to grey. */
    var low = 1 - clamp((L - 0.55) / 0.4, 0, 1);
    sunBox.style.top = f(12 + low * 40) + "%";
    sunBox.style.setProperty("--sunfill", rgb(mixc([226, 179, 85], [232, 122, 62], low)));
    moonBox.style.opacity = f(moonOn * 100) / 100;
    moonBox.style.display = moonOn < 0.01 ? "none" : "block";
  }
  var sn = seasonAt(x), key = sn.a.leaf[0] + ":" + sn.b.leaf[0] + ":" + f(sn.t);
  if(key !== lastSeason){
    lastSeason = key;
    var st = document.documentElement.style;
    st.setProperty("--leaf", rgb(mixc(sn.a.leaf, sn.b.leaf, sn.t)));
    st.setProperty("--gr2", rgb(mixc(sn.a.gr2, sn.b.gr2, sn.t)));
    st.setProperty("--gr3", rgb(mixc(sn.a.gr3, sn.b.gr3, sn.t)));
  }
}

/* =================================================================
   11. THE LOOP
   Transforms only, one rAF, and it parks itself when nothing moves.
   ================================================================= */

var q = new URLSearchParams(location.search);
var RM = q.get("rm") === "1" ||
  (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
if(RM) document.documentElement.classList.add("rm");
/* the first frame is painted, not animated: the opening words are on the
   paper before anything can fade, and a deep link lands on a finished
   picture instead of a dissolve. */
document.documentElement.classList.add("boot");

var X = 0, targetX = 0, dirty = true, running = false;
var heroWorld = 0, prevEff = 0, gaitPhase = 0, heroKeyOn = "", lastGait = "";
var trkOpen = 0;

function setHeroForm(form, pal){
  var key = form + (pal && HERO[form + "-pal"] ? "-pal" : "");
  if(form === "none") key = "";
  if(key === heroKeyOn) return;
  if(heroKeyOn && HERO[heroKeyOn]) HERO[heroKeyOn].classList.remove("on", "enter");
  heroKeyOn = key;
  lastGait = "";           /* a fresh puppet needs its pose written */
  if(key && HERO[key]){
    HERO[key].classList.add("on");
    if(!RM){
      HERO[key].classList.remove("enter");
      void HERO[key].offsetWidth;
      HERO[key].classList.add("enter");
    }
  }
}

/* the caption placement system.
   col blocks the strip into a third of the frame, row blocks it into a
   band. The clamp keeps it on screen without ever letting it drift into
   the middle of the set, so the words stay composed with the picture
   instead of floating over it. */
function placeCap(cp){
  var w = cp.w, h = cp.h, lo, hi;
  /* the measured width covers the faces only. Each strip also throws a
     solid paper shadow to the right and is turned a degree or so, and
     both of those reach past the box, so the right stop is pulled in. */
  var bleed = 12;
  var xMaxC = Math.max(pad, vw - w - pad - bleed);
  if(letterbox){
    /* phone: the diorama is a band at the top, the text owns the rest */
    var cxm = clamp((cp.x - X) * u - w * 0.5, pad, xMaxC);
    var top = STOP + SH + Math.max(10, (vh - STOP - SH - h) * 0.30);
    return [cxm, Math.min(top, Math.max(STOP + SH + 6, vh - h - 8))];
  }
  if(cp.col === "left"){ lo = pad; hi = Math.max(pad, vw * 0.30); }
  else if(cp.col === "right"){ lo = vw * 0.52; hi = xMaxC; }
  else { lo = (vw - w) / 2 - vw * 0.14; hi = (vw - w) / 2 + vw * 0.14; }
  if(hi < lo) hi = lo;
  lo = clamp(lo, pad, xMaxC);
  hi = clamp(hi, pad, xMaxC);
  if(hi < lo) hi = lo;
  var cx = clamp((cp.x - X) * u - w * 0.5, lo, hi);
  var cy;
  if(cp.row === "top") cy = STOP + SH * 0.055;
  else if(cp.row === "mid") cy = STOP + (SH - h) * 0.42;
  else if(cp.row === "low") cy = STOP + SH - h - SH * 0.10;
  else cy = STOP + SH * 0.12;
  cy = clamp(cy, STOP + 10, STOP + SH - h - 10);
  if(h > SH - 24) cy = STOP + 10;
  return [cx, cy];
}

function frame(){
  var maxScroll = Math.max(1, docH - vh);
  var p = clamp(scrollEl.scrollTop / maxScroll, 0, 1);
  targetX = Math.min(worldAt(p), xMax);

  if(RM) X = targetX;
  else {
    var dx = targetX - X;
    if(Math.abs(dx) < 0.05) X = targetX; else X += dx * 0.13;
  }

  var vpw = vw / u;
  var focus = X + vpw * 0.34;
  applyLight(lightAt(focus), focus);
  var ind = indoorAt(focus);
  if(Math.abs(ind - lastIndoor) > 0.004){
    lastIndoor = ind;
    skyLights.style.opacity = f((1 - ind) * 100) / 100;
  }

  var li, ci;
  for(li = 0; li < layers.length; li++){
    var lay = layers[li];
    lay.el.style.transform = "translate3d(" + f(-X * lay.d * u) + "px,0,0)";
    /* a group is on when its own paper overlaps the visible window,
       measured in this layer's own coordinates */
    var Xd = X * lay.d;
    for(ci = 0; ci < lay.groups.length; ci++){
      var gp = lay.groups[ci];
      var on = gp.hi > Xd && gp.lo < Xd + vpw;
      if(on !== gp.on){ gp.on = on; gp.el.classList.toggle("off", !on); }
      /* live drives the one shot ambient: it starts when the reader
         reaches the beat that owns it, and it ends. It never loops. */
      var live = on && !RM && X > gp.sc0 - vpw * 0.85 && X < gp.sc1 + vpw * 0.5;
      if(live !== gp.live){ gp.live = live; gp.el.classList.toggle("live", live); }
      /* a backdrop flat leaves the stage when the next one takes the frame */
      if(gp.wlo !== undefined){
        var dm = X < gp.wlo || X > gp.whi;
        if(dm !== gp.dim){ gp.dim = dm; gp.el.classList.toggle("dim", dm); }
      }
    }
  }
  artLayer.style.transform = "translate3d(" + f(-X * u) + "px,0,0)";
  litLayer.style.transform = artLayer.style.transform;
  /* the ride is drawn as it is ridden: the clip window opens from the
     start marker to a little ahead of the traveller, and never closes */
  if(trkRect && TRK){
    var cut0 = TRK.x - 80, reach = clamp(focus + 270 - cut0, 0, TRK.w + 380);
    if(reach > trkOpen){ trkOpen = reach; trkRect.setAttribute("width", f(reach)); }
  }
  glowLayer.style.transform = "translate3d(" + f(-X * u) + "px,0,0)";
  for(ci = 0; ci < glowEls.length; ci++){
    var ge = glowEls[ci];
    ge.el.style.transform = "translate3d(" + f(ge.x * u - ge.r * u) + "px," +
      f(floorY - (FLOOR - ge.y) * u - ge.r * u) + "px,0)";
  }
  celestWrap.style.transform = "translate3d(" + f(-p * vw * 0.10) + "px,0,0)";

  /* ---- hero ---- */
  var beat = beatAt(focus);
  setHeroForm(beat.form, beat.pal);
  var anchorWorld = X + vpw * 0.34;
  var wantWorld = beat.seat ? beat.seat.x : anchorWorld;
  if(RM || heroWorld === 0) heroWorld = wantWorld;
  else heroWorld += (wantWorld - heroWorld) * 0.11;
  var sx = clamp((heroWorld - X) * u, vw * 0.10, vw * 0.74);
  var eff = X + sx / u, vel = eff - prevEff;
  prevEff = eff;

  var el = heroKeyOn ? HERO[heroKeyOn] : null;
  if(el){
    var F = FORMS[beat.form] || FORMS.adult, k = u * F.sc;
    heroWrap.style.width = f(200 * k) + "px";
    heroWrap.style.height = f(176 * k) + "px";
    heroWrap.style.transform = "translate3d(" + f(sx - CX * k) + "px," + f(floorY - FOOTY * k) + "px,0)";
    var moving = Math.abs(vel) > 0.4;
    var gait = beat.gait;
    /* sitting only once he has actually reached the chair, so the walk
       carries him in and the pose is never a teleport */
    if(gait === "sit" && Math.abs(heroWorld - wantWorld) > 26) gait = "walk";
    if(moving) gaitPhase += Math.abs(vel) * (beat.form === "baby" ? 0.058 : 0.040);
    var pose;
    if(gait === "sit") pose = SIT;
    else if(gait === "wave") pose = WAVE;
    else if(gait === "toddle") pose = TODDLE[moving ? Math.floor(gaitPhase) % TODDLE.length : 0];
    else if(moving) pose = WALK[Math.floor(gaitPhase) % WALK.length];
    else pose = STAND;
    var pkey = gait + ":" + (moving ? Math.floor(gaitPhase) % 6 : "s");
    if(pkey !== lastGait){ lastGait = pkey; setPose(el, pose); }
  }

  /* ---- captions ----
     One block of words at a time. Whichever caption is nearest the focus
     owns the frame, and only if the focus is actually inside its reach,
     so between beats the picture is allowed to be silent. This is what
     keeps two headlines from ever stacking on each other. */
  var reach = Math.max(vpw * 0.55, 460);
  var best = -1, bestd = 1e9, dd;
  for(ci = 0; ci < caps.length; ci++){
    dd = Math.abs(caps[ci].x - focus);
    if(dd < bestd){ bestd = dd; best = ci; }
  }
  for(ci = 0; ci < caps.length; ci++){
    var cp = caps[ci], dist = Math.abs(cp.x - focus);
    var on = ci === best && dist < reach;
    if(on !== cp.on){ cp.on = on; cp.el.classList.toggle("on", on); }
    if(dist > reach * 2.4) continue;
    if(!cp.w) measureCap(cp);
    var xy = placeCap(cp);
    cp.el.style.transform = "translate3d(" + f(xy[0]) + "px," + f(xy[1]) + "px,0)";
  }

  /* ---- late sheets ----
     A punchline is never on the wall before the words that land it, so a
     sheet with a rev is held back until the focus has passed it. The
     switch sits on the same line as the caption hand-over, which puts the
     paper up in the same move that the words come in. */
  for(ci = 0; ci < lateArts.length; ci++){
    var la = lateArts[ci];
    var up = (la.rev == null || focus >= la.rev) &&
             (la.gone == null || focus < la.gone);
    if(up !== la.up){ la.up = up; la.el.classList.toggle("up", up); }
  }

  window.__journey = {progress:p, x:X, scene:sceneAt(focus)};

  var settled = Math.abs(targetX - X) < 0.05 && Math.abs(vel) < 0.02;
  if(settled && !dirty){ running = false; writeMetrics(); return; }
  dirty = false;
  requestAnimationFrame(frame);
}

function kick(){
  dirty = true;
  if(!running){ running = true; requestAnimationFrame(frame); }
}

scrollEl.addEventListener("scroll", kick, {passive:true});
window.addEventListener("resize", function(){ layout(); kick(); writeMetrics(); });
window.addEventListener("orientationchange", function(){ setTimeout(function(){ layout(); kick(); }, 140); });

/* paper grain, one generated tile, no network */
(function(){
  try{
    var c = document.createElement("canvas");
    c.width = c.height = 64;
    var g = c.getContext("2d"), im = g.createImageData(64, 64), r = rng(4242), n;
    for(n = 0; n < im.data.length; n += 4){
      var v = 219 + Math.floor(r() * 36);
      if(r() > 0.986) v = 180 + Math.floor(r() * 30);
      im.data[n] = im.data[n + 1] = im.data[n + 2] = v;
      im.data[n + 3] = 255;
    }
    g.putImageData(im, 0, 0);
    var url = "url(" + c.toDataURL() + ")";
    document.getElementById("grain").style.setProperty("--grain", url);
    document.getElementById("grainB").style.setProperty("--grain", url);
  }catch(e){ /* grain is decoration only */ }
})();

/* =================================================================
   12. METRICS, for verification rather than for the reader
   ================================================================= */
function writeMetrics(){
  var out = [], j;
  var fx = X + (vw / u) * 0.34, onc = [];
  for(j = 0; j < caps.length; j++) if(caps[j].on) onc.push(f(caps[j].x));
  out.push("X=" + f(X) + " focus=" + f(fx) + " scene=" + sceneAt(fx) +
    " L=" + f(lightAt(fx) * 100) / 100 + " indoor=" + f(indoorAt(fx) * 100) / 100 +
    " hero=" + (heroKeyOn || "none") + " capsOn=[" + onc.join(" ") + "]");
  out.push("docH=" + docH + "px  vh=" + vh + "  screens=" + f(docH / vh) +
  "  scrollTop=" + Math.round(scrollEl.scrollTop) + "  maxScroll=" + Math.max(1, docH - vh));
  out.push("worldSpan=" + WORLD_SPAN + "  cameraStop=" + f(mapEnd) +
    "  costTotal=" + f(costTotal) + "  u=" + f(u * 100) / 100);
  out.push("screensOfWorldPerScreenOfScroll=" +
    f((mapEnd / (docH / vh)) / (vw / u) * 100) / 100);
  for(j = 0; j < TIMELINE.length; j++){
    var s = TIMELINE[j], c0 = costAt(starts[j]), c1 = costAt(starts[j] + s.span);
    var line = s.id + " weight=" + f((c1 - c0) / costTotal * 1000) / 10 + "%";
    var dw = null, i;
    for(i = 0; i < (s.rate || []).length; i++) if(s.rate[i][2] > 1) dw = s.rate[i];
    if(dw){
      var d0 = costAt(starts[j] + dw[0]), d1 = costAt(starts[j] + dw[1]);
      line += " dwell=" + f((d1 - d0) / (c1 - c0) * 1000) / 10 + "%";
    }
    out.push(line);
  }
  metricsEl.textContent = out.join("\n");
}

/* =================================================================
   13. BOOT
   ?p= sets the real scroll position and then gets out of the way, and
   the first frame is painted synchronously so a headless capture can
   never photograph a blank or half settled stage.
   ================================================================= */

if("scrollRestoration" in history) history.scrollRestoration = "manual";
layout();

/* the deep link sets the real scroll position and then gets out of the
   way. Nothing overrides progress afterwards, so the page stays in sync
   with the scrollbar from the first pixel the reader moves it. */
var p0 = parseFloat(q.get("p"));
var pp = Number.isFinite(p0) ? clamp(p0, 0, 1) : 0;
scrollEl.scrollTop = Math.round(pp * Math.max(1, docH - vh));
keepP = pp;
if(Number.isFinite(p0)) lockP = pp;
["wheel", "touchstart", "keydown", "pointerdown"].forEach(function(ev){
  window.addEventListener(ev, function(){ lockP = -1; }, {passive:true, once:true});
});
X = targetX = Math.min(worldAt(clamp(scrollEl.scrollTop / Math.max(1, docH - vh), 0, 1)), xMax);
heroWorld = 0;
prevEff = X + (vw / u) * 0.34;
/* paint now, in this tick, so a headless capture is never blank */
running = true;
dirty = true;
frame();
writeMetrics();
if(RM) document.documentElement.classList.remove("boot");
else requestAnimationFrame(function(){
  document.documentElement.classList.remove("boot");
  world.classList.add("tr");
});

})();
</script>

<!-- The room tone. Every sound in it is synthesised on the spot: the
     file fetches nothing, and nothing at all is built until the reader
     presses the tag, because the audio clock may only be started from a
     real click. -->
<script src="assets/ambient.js"></script>
<script>
(function(){
"use strict";

/* which bed each stretch of the road plays under. Neighbours share a
   bed on purpose: the crossfade is two seconds, and a street that is
   one walk should not be four rooms. */
var BED = {
  title:"childhood_day", age6:"childhood_day", age12:"gaming_night",
  flight:"flight", newyork:"new_york", potato:"campus_day",
  kid2019:"childhood_day", uber:"office_day", doordash:"office_day",
  affirm:"office_day", night:"night_build", kdm:"winter",
  kid2024:"winter", tools:"campus_day", ainative:"campus_day",
  loadout:"campus_day", hypermark:"studio",
  cinema:"theater", end:"end_meadow"
};

var tag = document.getElementById("sndTag");
if(!tag) return;
if(typeof createAmbient !== "function"){ tag.className += " off"; return; }

var amb = createAmbient();           /* no audio clock is made here */
if(!amb.supported()){ tag.className += " off"; return; }

function sceneNow(){
  var j = window.__journey;
  return (j && BED[j.scene]) || "childhood_day";
}

/* the opening bed is only remembered, not played: while the sound is
   off this hands the key over and makes no noise */
amb.start(sceneNow());

/* the one gesture. This is the only path that reaches setEnabled, and
   it is a click, which is what the audio clock needs to be born. */
tag.addEventListener("click", function(){
  amb.setEnabled(!amb.enabled());
  tag.setAttribute("aria-pressed", amb.enabled() ? "true" : "false");
});

/* the road drives the sound. One read a frame, and the bed is only
   asked to change when the reader has walked into a new one. */
var last = null;
(function pump(){
  var key = sceneNow();
  if(key !== last){ last = key; amb.setChapter(key); }
  requestAnimationFrame(pump);
})();

window.__ambient = amb;
})();
</script>
